# Build + push the CI toolchain images (ci/images/*) to the local registry.
# Path-filtered: runs only when the image recipes (or this file) change.
# `manual` events bypass path filters (Woodpecker's on_empty default), so a
# manual pipeline trigger is the forced-rebuild knob — use it to pick up a
# new rustc; budget one cold cargo-cache run downstream afterwards.
#
# Registry resolution inside steps rides the Docker agent's mgmt-public

# builds use Kaniko, not privileged buildx.

labels:
  backend: docker
  host: nas
  platform: linux/amd64
  trust: unprivileged

when:
  - event: [push, manual]
    branch: main
    path: ['ci/images/**', '.woodpecker/ci-images.yml']

steps:
  - name: ci-rust
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: ${LOCAL_DOCKER_REGISTRY}
      repo: ci-rust
      context: .
      dockerfile: ci/images/ci-rust/Dockerfile
      cache: true
      cache_repo: ci-rust/cache
      tags: [latest]
      username:
        from_secret: local_registry_username
      password:
        from_secret: local_registry_password

  - name: ci-android
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: ${LOCAL_DOCKER_REGISTRY}
      repo: ci-android
      context: .
      dockerfile: ci/images/ci-android/Dockerfile
      cache: true
      cache_repo: ci-android/cache
      tags: [latest]
      username:
        from_secret: local_registry_username
      password:
        from_secret: local_registry_password
