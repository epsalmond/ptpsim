# NATS is intentionally private to the NAS-side management network. Report a
# failed Apple promotion (including timing-ratchet exit 42 and hard timeout 124)
# from a dependent Docker workflow instead of exposing the bus to macOS.

labels:
  backend: docker
  host: nas
  platform: linux/amd64
  trust: unprivileged

depends_on:
  - xcframework

when:
  - event: tag
    ref: refs/tags/apple-ffi-*
    status: [failure]

steps:
  - name: notify-apple-ffi-failure
    image: python:3.13-alpine
    commands:
      - >-
        python3 ci/publish-nats-alert.py
        "ALERT: ptpsim Apple FFI promotion failed or crossed a build-time ratchet.
        ${CI_PIPELINE_FORGE_URL}"
    environment:
      NATS_NOTIFY_URL: ${REGISTRY_GC_NATS_URL}
