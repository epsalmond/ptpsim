# Explicit Apple FFI promotion. Push an `apple-ffi-<sha8>` tag at a commit
# already merged to main. Ordinary main pushes never occupy the macOS runner.

labels:
  platform: darwin/amd64

when:
  - event: tag
    ref: refs/tags/apple-ffi-*

steps:
  - name: validate-promotion
    image: bash
    commands:
      - git fetch origin main
      - 'test "$CI_COMMIT_TAG" = "apple-ffi-${CI_COMMIT_SHA:0:8}" || { echo "tag must be apple-ffi-${CI_COMMIT_SHA:0:8}" >&2; exit 1; }'
      - 'git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main || { echo "$CI_COMMIT_SHA is not merged to main" >&2; exit 1; }'
      - '[ "$(du -sk "$CARGO_TARGET_DIR" 2>/dev/null | cut -f1)" -gt 41943040 ] && rm -rf "$CARGO_TARGET_DIR" || true'
    environment:
      HOME: /Users/woodpecker
      CARGO_HOME: /Users/woodpecker/.cargo
      RUSTUP_HOME: /Users/woodpecker/.rustup
      CARGO_TARGET_DIR: /Users/woodpecker/ci-cache/ptpsim-target
      CARGO_INCREMENTAL: "0"

  - name: build-ios-device
    image: bash
    commands:
      - ./ci/build-xcframework.sh build aarch64-apple-ios
    environment:
      HOME: /Users/woodpecker
      CARGO_HOME: /Users/woodpecker/.cargo
      RUSTUP_HOME: /Users/woodpecker/.rustup
      CARGO_TARGET_DIR: /Users/woodpecker/ci-cache/ptpsim-target
      CARGO_INCREMENTAL: "0"

  - name: build-ios-simulator-arm64
    image: bash
    commands:
      - ./ci/build-xcframework.sh build aarch64-apple-ios-sim
    environment:
      HOME: /Users/woodpecker
      CARGO_HOME: /Users/woodpecker/.cargo
      RUSTUP_HOME: /Users/woodpecker/.rustup
      CARGO_TARGET_DIR: /Users/woodpecker/ci-cache/ptpsim-target
      CARGO_INCREMENTAL: "0"

  - name: build-ios-simulator-x86_64
    image: bash
    commands:
      - ./ci/build-xcframework.sh build x86_64-apple-ios
    environment:
      HOME: /Users/woodpecker
      CARGO_HOME: /Users/woodpecker/.cargo
      RUSTUP_HOME: /Users/woodpecker/.rustup
      CARGO_TARGET_DIR: /Users/woodpecker/ci-cache/ptpsim-target
      CARGO_INCREMENTAL: "0"

  - name: generate-swift
    image: bash
    commands:
      - ./ci/build-xcframework.sh bindings
    environment:
      HOME: /Users/woodpecker
      CARGO_HOME: /Users/woodpecker/.cargo
      RUSTUP_HOME: /Users/woodpecker/.rustup
      CARGO_TARGET_DIR: /Users/woodpecker/ci-cache/ptpsim-target
      CARGO_INCREMENTAL: "0"

  - name: package-xcframework
    image: bash
    commands:
      - ./ci/build-xcframework.sh package
    environment:
      HOME: /Users/woodpecker
      CARGO_HOME: /Users/woodpecker/.cargo
      RUSTUP_HOME: /Users/woodpecker/.rustup
      CARGO_TARGET_DIR: /Users/woodpecker/ci-cache/ptpsim-target
      CARGO_INCREMENTAL: "0"

  - name: publish-xcframework
    image: bash
    commands:
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --generate-notes'
      - 'gh release upload "$TAG" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}.tar.gz" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}.xcframework.zip" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}.checksum" --clobber'
    environment:
      HOME: /Users/woodpecker
      CARGO_HOME: /Users/woodpecker/.cargo
      RUSTUP_HOME: /Users/woodpecker/.rustup
      CARGO_TARGET_DIR: /Users/woodpecker/ci-cache/ptpsim-target
      CARGO_INCREMENTAL: "0"
      GH_TOKEN:
        from_secret: github_token
