# macOS workflow — builds the iOS/macOS xcframework on the local-backend

# ci/ansible/woodpecker-agent.yml). Plan §11.11 has the design rationale;
# recipe lives in ci/build-xcframework.sh.
#
# Woodpecker 3.x requires `labels:` at the workflow top level (not per-step).


labels:
  platform: darwin/amd64

when:
  - event: push
    branch: main
    # Skip the whole macOS workflow unless the compiled artifacts could
    # change. Escape hatch: a commit message containing [ALL] (Woodpecker's
    # ignore_message default) runs everything regardless.
    path:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'ci/build-xcframework.sh'
      - 'ci/update-package-swift.sh'
      - '.woodpecker/xcframework.yml'

steps:
  - name: xcframework
    # `image:` for the local backend names the shell to run commands under.
    image: bash
    commands:
      # Size guard on the persistent target cache: stale fingerprints
      # accrete; past 40 GiB start over cold rather than grow unbounded.
      - '[ "$(du -sk "$CARGO_TARGET_DIR" 2>/dev/null | cut -f1)" -gt 41943040 ] && rm -rf "$CARGO_TARGET_DIR" || true'
      - ./ci/build-xcframework.sh
      # Artifacts land at out/dist/CameraProtocolFFI-<sha8>.{tar.gz, xcframework.zip, checksum}.
      # Publish all three to a GitHub release attached to the commit SHA tag:
      #   - tar.gz: legacy fetchers (curl + tar -xzf workflow)
      #   - xcframework.zip: SPM `binaryTarget(url:, checksum:)` consumers
      #   - checksum: SHA-256 hex of the zip, lets consumers fill the SPM
      #     `checksum:` field without re-computing locally
      # Tag is created on demand by `gh release create`; `--clobber` makes
      # each upload idempotent on retries. `--generate-notes` replaces the
      # prior literal "Auto-built artifacts." with a commits-since-last-tag
      # changelog GitHub generates from the PR + commit titles.
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --generate-notes'
      - 'gh release upload "$TAG" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}.tar.gz" --clobber'
      - 'gh release upload "$TAG" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}.xcframework.zip" --clobber'
      - 'gh release upload "$TAG" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}.checksum" --clobber'
    environment:
      # Woodpecker's local backend doesn't pass the agent's HOME/RUSTUP_HOME/
      # CARGO_HOME through to the step subprocess; it sets PATH and
      # WOODPECKER_* explicitly and that's it. Without these, rustup errors
      # with "could not create home directory" / "no default toolchain is
      # configured." The provisioning playbook installs the toolchain under
      # /Users/woodpecker, so point the step at that.
      HOME: /Users/woodpecker
      CARGO_HOME: /Users/woodpecker/.cargo
      RUSTUP_HOME: /Users/woodpecker/.rustup
      # Persistent target dir OUTSIDE the workspace: the local backend
      # re-clones fresh every run, which made all 4 Apple-target builds cold
      # (~8.6 min each, pipeline 113). Registry deps fingerprint against
      # CARGO_HOME (stable), so warm runs rebuild only the workspace crates.
      # Dir provisioned by ci/ansible/woodpecker-agent.yml; the build script
      # honours CARGO_TARGET_DIR via its TARGET_DIR indirection.
      CARGO_TARGET_DIR: /Users/woodpecker/ci-cache/ptpsim-target
      # Deps aren't compiled incrementally anyway; halves the cache size.
      CARGO_INCREMENTAL: "0"
      GH_TOKEN:
        from_secret: github_token   # fine-grained PAT with contents:write on the repo

  # AFTER the xcframework step uploads the zip + checksum, rewrite
  # Package.swift to point at this build's URL + checksum, then push the
  # bump to the `release/auto` branch. Consumers SPM-fetch via
  # `.package(url: ..., branch: "release/auto")` and get the latest
  # CameraProtocolFFI on every resolve — no per-release snippet authoring.
  # See docs/SPM_INTEGRATION.md for the consumer flow and ci/update-package-swift.sh
  # for the rewriter.
  #
  # Both remote ops authenticate as x-access-token over HTTPS with the
  # existing github_token PAT (contents:write) via a process-local inline
  # credential helper; nothing is written to git config or the workspace.
  - name: bump-package-swift
    image: bash
    depends_on: [xcframework]
    commands:
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      # Reset to a clean copy of main with our identity for the bump commit.
      # The workspace remote is plain https with no stored credentials, and
      # GitHub's git endpoint wants basic auth (x-access-token:<PAT>), not a
      # Bearer header — supply it via an inline credential helper for both
      # remote ops (nothing persisted to .git/config).
      - 'git -C "$CI_WORKSPACE" -c credential.helper="!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f" fetch origin main'
      - 'git -C "$CI_WORKSPACE" checkout -B release/auto origin/main'
      - 'git -C "$CI_WORKSPACE" config user.email "ci@ptpsim.local"'
      - 'git -C "$CI_WORKSPACE" config user.name  "ptpsim CI"'
      # Rewrite Package.swift to point at this release's artifacts.
      - 'bash "$CI_WORKSPACE/ci/update-package-swift.sh" "$TAG"'
      - 'git -C "$CI_WORKSPACE" add Package.swift'
      - 'git -C "$CI_WORKSPACE" commit -m "auto: bump Package.swift to $TAG"'
      # Force-push: the release/auto branch is CI-owned (only contains
      # auto-generated Package.swift bumps off main) and is recreated fresh

      # WOODPECKER_MAX_WORKFLOWS=1 so this step doesn't race with itself.
      - 'git -C "$CI_WORKSPACE" -c credential.helper="!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f" push --force origin release/auto'
    environment:
      # Woodpecker's local backend doesn't pass the agent's HOME/RUSTUP_HOME/
      # CARGO_HOME through to the step subprocess; it sets PATH and
      # WOODPECKER_* explicitly and that's it. Without these, rustup errors
      # with "could not create home directory" / "no default toolchain is
      # configured." The provisioning playbook installs the toolchain under
      # /Users/woodpecker, so point the step at that.
      HOME: /Users/woodpecker
      CARGO_HOME: /Users/woodpecker/.cargo
      RUSTUP_HOME: /Users/woodpecker/.rustup
      GH_TOKEN:
        from_secret: github_token   # fine-grained PAT with contents:write on the repo
