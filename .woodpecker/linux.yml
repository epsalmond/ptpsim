# Linux workflow — runs on Docker-backend Linux agents.
# Pure-Rust workspace (no openssl/ring/native deps), so rust:1-slim suffices.
# Image push and python wheel publish are gated on main+push.
#
# Without the platform label this workflow has no agent constraint and can
# land on the macOS local-backend agent, which would fail at `git lfs`
# during clone and at trying to exec `image: rust:1-slim` as a shell.

labels:
  platform: linux/amd64

when:
  - event: [push, pull_request]

steps:
  - name: smoke
    image: alpine
    commands:
      - echo "woodpecker reached ptpsim @ ${CI_COMMIT_SHA:0:8} on ${CI_COMMIT_BRANCH}"

  # Cargo caches: per-step host volumes (repo is trusted-volumes). Distinct
  # subdirs per step so parallel steps never contend; cross-pipeline sharing
  # serializes on cargo's build-dir flock, which is harmless. Docker creates
  # the host dirs root-owned on first mount; these steps run as root.
  - name: workspace
    image: rust:1-slim
    volumes:
      - /data/ci-cache/ptpsim/workspace:/ci-cache
    environment:
      CARGO_HOME: /ci-cache/cargo-home
      CARGO_TARGET_DIR: /ci-cache/target
      CARGO_INCREMENTAL: "0"
    commands:
      # Size guard: wipe past 40 GiB rather than grow unbounded.
      - '[ "$(du -sk /ci-cache 2>/dev/null | cut -f1)" -gt 41943040 ] && rm -rf /ci-cache/target /ci-cache/cargo-home || true'
      - rustup component add rustfmt clippy
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace

  - name: python-mapper
    image: python:3.11-slim
    commands:
      - pip install -q pytest
      # protocol-mapper's pyproject defaults to --cov= ; override since pytest-cov
      # isn't in the CI image and the other tests need bleak/hardware anyway.
      - cd tools/protocol-mapper && pytest tests/test_gphoto2_labels.py -o addopts="" -q



  # Reaches the registry via WOODPECKER_BACKEND_DOCKER_NETWORK on the agent
  # (per-step network_mode was dropped in Woodpecker 3.x).
  # depends_on: [workspace] keeps it from blocking python-wheel when local
  # registry auth fails — they're independent artifacts.
  - name: image
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    depends_on: [workspace]
    settings:
      registry: ${LOCAL_DOCKER_REGISTRY}
      repo: ${LOCAL_DOCKER_REGISTRY}/ptpsim
      # Registry resolution inside steps rides the traefik network alias on

      # internal-dns serves only the internal zones, so pointing the inner
      # dockerd at it breaks public pulls (docker.io SERVFAILs).
      username:
        from_secret: local_registry_username
      password:
        from_secret: local_registry_password
      tags:
        - latest
        - sha-${CI_COMMIT_SHA:0:8}
      platforms: linux/amd64,linux/arm64
    when:
      branch: main
      event: push

  # Tar packages/camera-config-data/ and attach to the same sha-<8> release
  # as the xcframework + wheel. Decouples manifest-data delivery from the
  # source-tree vendoring client application has been doing, so the FFI version (in
  # the xcframework / wheel) and the data version (in this tarball) ship
  # from the same commit and can't drift. Pre-Apache-data-repo-split per
  # project-manifest-system memory; this co-ship is the bridge until that
  # split lands.
  - name: manifest-data
    image: alpine
    depends_on: [smoke]
    commands:
      - apk add --no-cache github-cli
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - mkdir -p out/dist
      - 'TARBALL="out/dist/camera-config-data-${CI_COMMIT_SHA:0:8}.tar.gz"'
      - 'CHECKSUM="out/dist/camera-config-data-${CI_COMMIT_SHA:0:8}.checksum"'
      # Tarball contains a top-level `camera-config-data/` directory so
      # extraction yields the same path layout as the source tree. Includes
      # fuji/{index,fuji,gfx100ii/{gfx100ii,gfx100ii.consolidated,fw*}.yaml,
      # evidence/*.md} and golden/ (response goldens for backtest oracles).
      - 'tar -czf "$TARBALL" -C packages camera-config-data'
      - 'sha256sum "$TARBALL" | awk ''{print $1}'' > "$CHECKSUM"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --notes "Auto-built artifacts."'
      - 'gh release upload "$TAG" "$TARBALL" --clobber'
      - 'gh release upload "$TAG" "$CHECKSUM" --clobber'
    environment:
      GH_TOKEN:
        from_secret: github_token
    when:
      branch: main
      event: push

  # Build CameraProtocolFFI for Android — three cdylib ABIs + uniffi Kotlin
  # bindings — and attach as a source-distribution tarball alongside the
  # xcframework. Consumers integrate by copying android/jniLibs and android/
  # kotlin into their Android Gradle module; docs/ANDROID_INTEGRATION.md
  # walks the steps. Real .aar wrapping (classes.jar + AndroidManifest) is
  # task #43 — needs kotlinc + android.jar in CI which doubles image size.
  - name: android-libs
    # cimg/android ships Android SDK + NDK; we add Rust on top.
    # Tag scheme is `YYYY.MM[.patch][-variant]` per Docker Hub
    # (`hub.docker.com/r/cimg/android/tags`); -ndk = SDK + NDK variant.
    image: cimg/android:2026.03.1-ndk
    depends_on: [workspace]
    commands:
      # cimg images run as user `circleci`, but the workspace is cloned
      # root-owned. Do NOT chown the whole workspace — parallel root steps
      # (manifest-data, python-wheel) run git in it and would die on
      # "dubious ownership". Instead: writable out/ dirs, a PRIVATE cargo
      # target dir (the shared target/ is root-owned by the workspace
      # step's build; build-android.sh and uniffi-bindgen both honour
      # CARGO_TARGET_DIR), and a safe.directory entry so gh's git calls
      # accept the root-owned repo.
      - 'sudo install -d -o "$(id -u)" -g "$(id -g)" out out/android out/dist'
      - 'export CARGO_TARGET_DIR="$HOME/cargo-target"'
      - 'git config --global --add safe.directory "$CI_WORKSPACE"'
      # Rust toolchain — minimal profile is enough for cargo build / uniffi-bindgen.
      - 'curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable'
      - 'export PATH="$HOME/.cargo/bin:$PATH"'
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      # cargo-ndk wraps cargo build with per-ABI NDK toolchain. Pinned.
      - cargo install --quiet cargo-ndk --version 3.5.4
      # cimg/android puts the NDK at /home/circleci/android-sdk/ndk/<version>;
      # cargo-ndk picks it up via ANDROID_NDK_HOME or auto-discovery.
      - 'export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$(ls -1 $ANDROID_HOME/ndk | sort -V | tail -1)"'
      - ./ci/build-android.sh
      # gh CLI (Debian-style; image is Ubuntu-based).
      - 'curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg'
      - 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null'
      - sudo apt-get update -qq
      - sudo apt-get install -qq -y gh
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --notes "Auto-built artifacts."'
      - 'gh release upload "$TAG" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}-android.tar.gz" --clobber'
      - 'gh release upload "$TAG" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}-android.checksum" --clobber'
    environment:
      GH_TOKEN:
        from_secret: github_token
    when:
      branch: main
      event: push

  # Build a Linux Python wheel of camera-protocol-ffi and attach it to the
  # same sha-<8> release as the xcframework. Primary consumer: client application's
  # test-injection TUI (Python script that constructs Observation values
  # and feeds them through recognize / establishment in-process — no real
  # BLE radio). See packages/camera-protocol-python/README.md.
  - name: python-wheel
    image: rust:1-slim
    depends_on: [workspace]
    volumes:
      - /data/ci-cache/ptpsim/wheel:/ci-cache
    commands:
      - '[ "$(du -sk /ci-cache 2>/dev/null | cut -f1)" -gt 41943040 ] && rm -rf /ci-cache/target /ci-cache/cargo-home || true'
      - apt-get update -qq
      # git: gh release create shells out to git when run inside a repo dir
      # (rust:1-slim doesn't ship it).
      - apt-get install -qq -y python3 python3-pip python3-venv curl ca-certificates git
      # gh CLI (Debian's package is current enough for release upload)
      - 'curl -fsSL https://github.com/cli/cli/releases/latest/download/gh_*_linux_amd64.deb -o /tmp/gh.deb || true'
      - apt-get install -qq -y gh || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list && apt-get update -qq && apt-get install -qq -y gh)
      # Python build deps in a venv (PEP 668 — system Python is externally-managed)
      - python3 -m venv /tmp/wheelvenv
      - /tmp/wheelvenv/bin/pip install -q build setuptools wheel
      - 'PATH="/tmp/wheelvenv/bin:$PATH" ./ci/build-python-wheel.sh'
      # Attach to the same sha-<8> release as the xcframework
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --notes "Auto-built artifacts."'
      - 'gh release upload "$TAG" packages/camera-protocol-python/dist/*.whl --clobber'
    environment:
      CARGO_HOME: /ci-cache/cargo-home
      CARGO_TARGET_DIR: /ci-cache/target
      CARGO_INCREMENTAL: "0"
      GH_TOKEN:
        from_secret: github_token
    when:
      branch: main
      event: push
