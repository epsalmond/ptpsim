# Linux workflow — runs on Docker-backend Linux agents.
# Pure-Rust workspace (no openssl/ring/native deps), so rust:1-slim suffices.
# Release artifact publication is gated on main+push.
#
# Without the platform label this workflow has no agent constraint and can
# land on the macOS local-backend agent, which would fail at `git lfs`
# during clone and at trying to exec `image: rust:1-slim` as a shell.

workspace:
  base: /woodpecker
  path: src/ptpsim

clone:
  - name: git
    image: ${DURABLE_GIT_CLONE_IMAGE}
    settings:
      expected_repository: ${CI_REPO}
      expected_workspace: /woodpecker/src/ptpsim
      lock_file: /ci-locks/workspace.lock

labels:
  backend: docker
  platform: linux/amd64
  repo: ${CI_REPO}
  event: ${CI_PIPELINE_EVENT}
  trust: unprivileged

when:
  - event: [push, pull_request]

steps:
  - name: smoke
    image: alpine
    commands:
      - echo "woodpecker reached ptpsim @ ${CI_COMMIT_SHA:0:8} on ${CI_COMMIT_BRANCH}"

  # Per-step cache paths stay inside the disposable step container. Docker
  # image layers and the durable Git object database provide cross-run reuse
  # without granting this public workflow arbitrary host-volume access.
  - name: workspace
    # The deployment owner's instance environment supplies a prebaked
    # toolchain image (rustfmt/clippy + gh, per ci/images/ci-rust/Dockerfile)
    # via RUST_TOOLCHAIN_IMAGE. The public fallback works anywhere but syncs
    # the rust-toolchain.toml components per run (slow, green).
    image: ${RUST_TOOLCHAIN_IMAGE:-rust:1.97.0-slim}
    # Always re-pull: a rebuilt toolchain :latest must not be shadowed by a
    # stale locally-cached tag (Woodpecker only pulls absent images by default).
    pull: true
    # Path filter: rust sources + the data/fixture packages the tests read.
    # Doc-only changes skip the whole build+test.
    # Must trigger whenever ANY step that `depends_on: [workspace]` triggers
    # (android-libs / kotlin-bindings / python-wheel) — else that step references a
    # filtered-out `workspace` and Woodpecker aborts the whole pipeline with
    # "depends on unknown step 'workspace'". So this path set is the UNION of
    # the dependents' paths plus the test inputs.
    when:
      - path:
          - 'crates/**'
          - 'services/**'
          - 'tools/camera-initiator/**'
          - 'tools/camera-simctl/**'
          - 'tools/uniffi-bindgen/**'
          - 'packages/camera-config-data/**'
          - 'packages/camera-protocol-python/**'
          - 'packages/fixtures/**'
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'rust-toolchain.toml'
          - 'Dockerfile'
          - 'ci/build-android.sh'
          - 'ci/kotlin/**'
          - 'ci/build-python-wheel.sh'
          - '.woodpecker/linux.yml'
    environment:
      CARGO_HOME: /ci-cache/cargo-home
      CARGO_TARGET_DIR: /ci-cache/target
      CARGO_INCREMENTAL: "0"
    commands:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets
      - cargo test --workspace

  # Tar packages/camera-config-data/ and attach to the same sha-<8> release
  # as the xcframework + wheel. Decouples manifest-data delivery from the
  # source-tree vendoring client application has been doing, so the FFI version (in
  # the xcframework / wheel) and the data version (in this tarball) ship
  # from the same commit and can't drift. Pre-Apache-data-repo-split per
  # project-manifest-system memory; this co-ship is the bridge until that
  # split lands.
  - name: manifest-data
    image: alpine
    depends_on: [smoke]
    commands:
      - apk add --no-cache github-cli
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - mkdir -p out/dist
      - 'TARBALL="out/dist/camera-config-data-${CI_COMMIT_SHA:0:8}.tar.gz"'
      - 'CHECKSUM="out/dist/camera-config-data-${CI_COMMIT_SHA:0:8}.checksum"'
      # Tarball contains a top-level `camera-config-data/` directory so
      # extraction yields the same path layout as the source tree. Includes
      # fuji/{index,fuji,gfx100ii/{gfx100ii,gfx100ii.consolidated,fw*}.yaml,
      # evidence/*.md} and golden/ (response goldens for backtest oracles).
      - 'tar -czf "$TARBALL" -C packages camera-config-data'
      - 'sha256sum "$TARBALL" | awk ''{print $1}'' > "$CHECKSUM"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --notes "Auto-built artifacts."'
      - 'gh release upload "$TAG" "$TARBALL" --clobber'
      - 'gh release upload "$TAG" "$CHECKSUM" --clobber'
    environment:
      GH_TOKEN:
        from_secret: github_token
    when:
      branch: main
      event: push
      path:
        - 'packages/camera-config-data/**'
        - '.woodpecker/linux.yml'

  # Compile the generated Kotlin bindings plus a foreign executor seam on PRs.
  # This is the host-only half of build-android.sh: no NDK or AAR work. The
  # deployment image already carries Kotlin/JNA; the public Rust fallback
  # downloads those two compile dependencies into the ephemeral step.
  - name: kotlin-bindings
    image: ${ANDROID_TOOLCHAIN_IMAGE:-rust:1.97.0-slim}
    pull: true
    depends_on: [workspace]
    environment:
      CARGO_HOME: /ci-cache/cargo-home
      CARGO_TARGET_DIR: /ci-cache/target
      CARGO_INCREMENTAL: "0"
    commands:
      - |
        if ! command -v kotlinc >/dev/null 2>&1; then
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends ca-certificates curl default-jre-headless unzip
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp
          export PATH="/tmp/kotlinc/bin:$PATH"
        fi
        if [ -z "${JNA_JAR:-}" ] || [ ! -f "$JNA_JAR" ]; then
          curl -fsSL https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar -o /tmp/jna.jar
          export JNA_JAR=/tmp/jna.jar
        fi
        KOTLIN_BINDINGS_CHECK_ONLY=1 ./ci/build-android.sh
    when:
      event: pull_request
      path:
        - 'crates/camera-protocol-ffi/**'
        - 'tools/uniffi-bindgen/**'
        - 'Cargo.toml'
        - 'Cargo.lock'
        - 'rust-toolchain.toml'
        - 'ci/build-android.sh'
        - 'ci/kotlin/**'
        - '.woodpecker/linux.yml'

  # Build CameraProtocolFFI for Android — three cdylib ABIs + uniffi Kotlin
  # bindings — and attach as a source-distribution tarball alongside the
  # xcframework. Consumers integrate by copying android/jniLibs and android/
  # kotlin into their Android Gradle module; docs/ANDROID_INTEGRATION.md
  # walks the steps. Real .aar wrapping (classes.jar + AndroidManifest) is
  # task #43 — needs kotlinc + android.jar in CI which doubles image size.
  - name: android-libs
    # The instance environment supplies a prebaked Android toolchain image
    # (rust cross-toolchain + cargo-ndk + gh on top of an SDK/NDK base, per
    # ci/images/ci-android/Dockerfile) via ANDROID_TOOLCHAIN_IMAGE. The public
    # SDK/NDK fallback lacks the baked Rust toolchain, so ci/build-android.sh
    # fails closed on it — this step is main+push only and never gates PRs.
    image: ${ANDROID_TOOLCHAIN_IMAGE:-cimg/android:2026.03.1-ndk}
    # Always re-pull: a rebuilt toolchain :latest (e.g. when kotlinc was
    # added) must not be shadowed by a stale locally-cached tag.
    pull: true
    depends_on: [workspace]
    commands:
      - ./ci/build-android.sh
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --notes "Auto-built artifacts."'
      - 'gh release upload "$TAG" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}.aar" --clobber'
      - 'gh release upload "$TAG" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}.checksum" --clobber'
    environment:
      # Registry/build caches in the volume; toolchain binaries stay on the
      # image's PATH (/usr/local/cargo/bin) regardless of CARGO_HOME.
      CARGO_HOME: /ci-cache/cargo-home
      CARGO_TARGET_DIR: /ci-cache/target
      CARGO_INCREMENTAL: "0"
      GH_TOKEN:
        from_secret: github_token
    when:
      branch: main
      event: push
      path:
        - 'crates/**'
        - 'tools/uniffi-bindgen/**'
        - 'Cargo.toml'
        - 'Cargo.lock'
        - 'rust-toolchain.toml'
        - 'ci/build-android.sh'
        - '.woodpecker/linux.yml'

  # Build a Linux Python wheel of camera-protocol-ffi and attach it to the
  # same sha-<8> release as the xcframework. Primary consumer: client application's
  # test-injection TUI (Python script that constructs Observation values
  # and feeds them through recognize / establishment in-process — no real
  # BLE radio). See packages/camera-protocol-python/README.md.
  - name: python-wheel
    # Same instance-supplied toolchain image as workspace; it bakes git/gh
    # and the /opt/wheelvenv build deps. The public fallback lacks wheelvenv,
    # so this main+push-only step fails closed on it (never gates PRs).
    image: ${RUST_TOOLCHAIN_IMAGE:-rust:1.97.0-slim}
    # Always re-pull: don't run on a stale locally-cached toolchain tag.
    pull: true
    depends_on: [workspace]
    commands:
      - 'PATH="/opt/wheelvenv/bin:$PATH" ./ci/build-python-wheel.sh'
      # Attach to the same sha-<8> release as the xcframework
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --notes "Auto-built artifacts."'
      - 'gh release upload "$TAG" packages/camera-protocol-python/dist/*.whl --clobber'
    environment:
      CARGO_HOME: /ci-cache/cargo-home
      CARGO_TARGET_DIR: /ci-cache/target
      CARGO_INCREMENTAL: "0"
      GH_TOKEN:
        from_secret: github_token
    when:
      branch: main
      event: push
      path:
        - 'crates/**'
        - 'Cargo.toml'
        - 'Cargo.lock'
        - 'rust-toolchain.toml'
        - 'packages/camera-protocol-python/**'
        - 'ci/build-python-wheel.sh'
        - '.woodpecker/linux.yml'
