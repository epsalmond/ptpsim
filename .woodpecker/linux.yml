# Linux workflow — runs on Docker-backend Linux agents.
# Pure-Rust workspace (no openssl/ring/native deps), so rust:1-slim suffices.
# Image push and python wheel publish are gated on main+push.
#
# Without the platform label this workflow has no agent constraint and can
# land on the macOS local-backend agent, which would fail at `git lfs`
# during clone and at trying to exec `image: rust:1-slim` as a shell.

labels:
  platform: linux/amd64

when:
  - event: [push, pull_request]

steps:
  - name: smoke
    image: alpine
    commands:
      - echo "woodpecker reached ptpsim @ ${CI_COMMIT_SHA:0:8} on ${CI_COMMIT_BRANCH}"

  - name: workspace
    image: rust:1-slim
    commands:
      - rustup component add rustfmt clippy
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace

  - name: python-mapper
    image: python:3.11-slim
    commands:
      - pip install -q pytest
      # protocol-mapper's pyproject defaults to --cov= ; override since pytest-cov
      # isn't in the CI image and the other tests need bleak/hardware anyway.
      - cd tools/protocol-mapper && pytest tests/test_gphoto2_labels.py -o addopts="" -q



  # Reaches the registry via WOODPECKER_BACKEND_DOCKER_NETWORK on the agent
  # (per-step network_mode was dropped in Woodpecker 3.x).
  # depends_on: [workspace] keeps it from blocking python-wheel when local
  # registry auth fails — they're independent artifacts.
  - name: image
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    depends_on: [workspace]
    settings:
      registry: ${LOCAL_DOCKER_REGISTRY}
      repo: ${LOCAL_DOCKER_REGISTRY}/ptpsim
      username:
        from_secret: local_registry_username
      password:
        from_secret: local_registry_password
      tags:
        - latest
        - sha-${CI_COMMIT_SHA:0:8}
      platforms: linux/amd64,linux/arm64
    when:
      branch: main
      event: push

  # Tar packages/camera-config-data/ and attach to the same sha-<8> release
  # as the xcframework + wheel. Decouples manifest-data delivery from the
  # source-tree vendoring client application has been doing, so the FFI version (in
  # the xcframework / wheel) and the data version (in this tarball) ship
  # from the same commit and can't drift. Pre-Apache-data-repo-split per
  # project-manifest-system memory; this co-ship is the bridge until that
  # split lands.
  - name: manifest-data
    image: alpine
    depends_on: [smoke]
    commands:
      - apk add --no-cache github-cli
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - mkdir -p out/dist
      - 'TARBALL="out/dist/camera-config-data-${CI_COMMIT_SHA:0:8}.tar.gz"'
      - 'CHECKSUM="out/dist/camera-config-data-${CI_COMMIT_SHA:0:8}.checksum"'
      # Tarball contains a top-level `camera-config-data/` directory so
      # extraction yields the same path layout as the source tree. Includes
      # fuji/{index,fuji,gfx100ii/{gfx100ii,gfx100ii.consolidated,fw*}.yaml,
      # evidence/*.md} and golden/ (response goldens for backtest oracles).
      - 'tar -czf "$TARBALL" -C packages camera-config-data'
      - 'sha256sum "$TARBALL" | awk ''{print $1}'' > "$CHECKSUM"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --notes "Auto-built artifacts."'
      - 'gh release upload "$TAG" "$TARBALL" --clobber'
      - 'gh release upload "$TAG" "$CHECKSUM" --clobber'
    environment:
      GH_TOKEN:
        from_secret: github_token
    when:
      branch: main
      event: push

  # Build a Linux Python wheel of camera-protocol-ffi and attach it to the
  # same sha-<8> release as the xcframework. Primary consumer: client application's
  # test-injection TUI (Python script that constructs Observation values
  # and feeds them through recognize / establishment in-process — no real
  # BLE radio). See packages/camera-protocol-python/README.md.
  - name: python-wheel
    image: rust:1-slim
    depends_on: [workspace]
    commands:
      - apt-get update -qq
      - apt-get install -qq -y python3 python3-pip python3-venv curl ca-certificates
      # gh CLI (Debian's package is current enough for release upload)
      - 'curl -fsSL https://github.com/cli/cli/releases/latest/download/gh_*_linux_amd64.deb -o /tmp/gh.deb || true'
      - apt-get install -qq -y gh || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list && apt-get update -qq && apt-get install -qq -y gh)
      # Python build deps in a venv (PEP 668 — system Python is externally-managed)
      - python3 -m venv /tmp/wheelvenv
      - /tmp/wheelvenv/bin/pip install -q build setuptools wheel
      - 'PATH="/tmp/wheelvenv/bin:$PATH" ./ci/build-python-wheel.sh'
      # Attach to the same sha-<8> release as the xcframework
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --notes "Auto-built artifacts."'
      - 'gh release upload "$TAG" packages/camera-protocol-python/dist/*.whl --clobber'
    environment:
      GH_TOKEN:
        from_secret: github_token
    when:
      branch: main
      event: push
