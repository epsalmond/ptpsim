# Linux workflow — runs on Docker-backend Linux agents.
# Pure-Rust workspace (no openssl/ring/native deps), so rust:1-slim suffices.
# Release artifact publication is gated on main+push.
#
# Without the platform label this workflow has no agent constraint and can
# land on the macOS local-backend agent, which would fail at `git lfs`
# during clone and at trying to exec `image: rust:1-slim` as a shell.

labels:
  backend: docker
  host: nas
  platform: linux/amd64
  trust: host-root

when:
  - event: [push, pull_request]

steps:
  - name: smoke
    image: alpine
    commands:
      - echo "woodpecker reached ptpsim @ ${CI_COMMIT_SHA:0:8} on ${CI_COMMIT_BRANCH}"

  # Cargo caches: per-step host volumes (repo is trusted-volumes). Distinct
  # subdirs per step so parallel steps never contend; cross-pipeline sharing
  # serializes on cargo's build-dir flock, which is harmless. Docker creates
  # the host dirs root-owned on first mount; these steps run as root.
  - name: workspace
    # ci-rust (ci/images/ci-rust/Dockerfile) bakes rustfmt/clippy + gh.

    # Always re-pull: a rebuilt ci-rust:latest must not be shadowed by a stale
    # locally-cached tag (Woodpecker only pulls absent images by default).
    pull: true
    # Path filter: rust sources + the data/fixture packages the tests read.
    # Doc-only changes skip the whole build+test.
    # Must trigger whenever ANY step that `depends_on: [workspace]` triggers
    # (image / android-libs / python-wheel) — else that step references a
    # filtered-out `workspace` and Woodpecker aborts the whole pipeline with
    # "depends on unknown step 'workspace'". So this path set is the UNION of
    # the dependents' paths plus the test inputs.
    when:
      - path:
          - 'crates/**'
          - 'services/**'
          - 'tools/camera-simctl/**'
          - 'packages/camera-config-data/**'
          - 'packages/camera-protocol-python/**'
          - 'packages/fixtures/**'
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'rust-toolchain.toml'
          - 'Dockerfile'
          - 'ci/build-android.sh'
          - 'ci/build-python-wheel.sh'
          - '.woodpecker/linux.yml'
    volumes:
      - /data/ci-cache/ptpsim/workspace:/ci-cache
    environment:
      CARGO_HOME: /ci-cache/cargo-home
      CARGO_TARGET_DIR: /ci-cache/target
      CARGO_INCREMENTAL: "0"
    commands:
      # Size guard: wipe past 40 GiB rather than grow unbounded.
      - '[ "$(du -sk /ci-cache 2>/dev/null | cut -f1)" -gt 41943040 ] && rm -rf /ci-cache/target /ci-cache/cargo-home || true'
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets
      - cargo test --workspace

  # Tar packages/camera-config-data/ and attach to the same sha-<8> release
  # as the xcframework + wheel. Decouples manifest-data delivery from the
  # source-tree vendoring client application has been doing, so the FFI version (in
  # the xcframework / wheel) and the data version (in this tarball) ship
  # from the same commit and can't drift. Pre-Apache-data-repo-split per
  # project-manifest-system memory; this co-ship is the bridge until that
  # split lands.
  - name: manifest-data
    image: alpine
    depends_on: [smoke]
    commands:
      - apk add --no-cache github-cli
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - mkdir -p out/dist
      - 'TARBALL="out/dist/camera-config-data-${CI_COMMIT_SHA:0:8}.tar.gz"'
      - 'CHECKSUM="out/dist/camera-config-data-${CI_COMMIT_SHA:0:8}.checksum"'
      # Tarball contains a top-level `camera-config-data/` directory so
      # extraction yields the same path layout as the source tree. Includes
      # fuji/{index,fuji,gfx100ii/{gfx100ii,gfx100ii.consolidated,fw*}.yaml,
      # evidence/*.md} and golden/ (response goldens for backtest oracles).
      - 'tar -czf "$TARBALL" -C packages camera-config-data'
      - 'sha256sum "$TARBALL" | awk ''{print $1}'' > "$CHECKSUM"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --notes "Auto-built artifacts."'
      - 'gh release upload "$TAG" "$TARBALL" --clobber'
      - 'gh release upload "$TAG" "$CHECKSUM" --clobber'
    environment:
      GH_TOKEN:
        from_secret: github_token
    when:
      branch: main
      event: push
      path:
        - 'packages/camera-config-data/**'
        - '.woodpecker/linux.yml'

  # Build CameraProtocolFFI for Android — three cdylib ABIs + uniffi Kotlin
  # bindings — and attach as a source-distribution tarball alongside the
  # xcframework. Consumers integrate by copying android/jniLibs and android/
  # kotlin into their Android Gradle module; docs/ANDROID_INTEGRATION.md
  # walks the steps. Real .aar wrapping (classes.jar + AndroidManifest) is
  # task #43 — needs kotlinc + android.jar in CI which doubles image size.
  - name: android-libs
    # ci-android (ci/images/ci-android/Dockerfile) bakes the rust
    # cross-toolchain + cargo-ndk + gh on top of cimg's SDK/NDK and runs as
    # root — no per-run toolchain installs, no uid-3434 ownership dance.

    # Always re-pull: a rebuilt ci-android:latest (e.g. when kotlinc was added)
    # must not be shadowed by a stale locally-cached tag.
    pull: true
    depends_on: [workspace]
    volumes:
      - /data/ci-cache/ptpsim/android:/ci-cache
    commands:
      - '[ "$(du -sk /ci-cache 2>/dev/null | cut -f1)" -gt 41943040 ] && rm -rf /ci-cache/target /ci-cache/cargo-home || true'
      - ./ci/build-android.sh
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --notes "Auto-built artifacts."'
      - 'gh release upload "$TAG" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}.aar" --clobber'
      - 'gh release upload "$TAG" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}.checksum" --clobber'
    environment:
      # Registry/build caches in the volume; toolchain binaries stay on the
      # image's PATH (/usr/local/cargo/bin) regardless of CARGO_HOME.
      CARGO_HOME: /ci-cache/cargo-home
      CARGO_TARGET_DIR: /ci-cache/target
      CARGO_INCREMENTAL: "0"
      GH_TOKEN:
        from_secret: github_token
    when:
      branch: main
      event: push
      path:
        - 'crates/**'
        - 'Cargo.toml'
        - 'Cargo.lock'
        - 'rust-toolchain.toml'
        - 'ci/build-android.sh'
        - '.woodpecker/linux.yml'

  # Build a Linux Python wheel of camera-protocol-ffi and attach it to the
  # same sha-<8> release as the xcframework. Primary consumer: client application's
  # test-injection TUI (Python script that constructs Observation values
  # and feeds them through recognize / establishment in-process — no real
  # BLE radio). See packages/camera-protocol-python/README.md.
  - name: python-wheel
    # ci-rust bakes git/gh and the /opt/wheelvenv build deps.

    # Always re-pull: don't run on a stale locally-cached ci-rust:latest.
    pull: true
    depends_on: [workspace]
    volumes:
      - /data/ci-cache/ptpsim/wheel:/ci-cache
    commands:
      - '[ "$(du -sk /ci-cache 2>/dev/null | cut -f1)" -gt 41943040 ] && rm -rf /ci-cache/target /ci-cache/cargo-home || true'
      - 'PATH="/opt/wheelvenv/bin:$PATH" ./ci/build-python-wheel.sh'
      # Attach to the same sha-<8> release as the xcframework
      - 'export TAG="sha-${CI_COMMIT_SHA:0:8}"'
      - 'gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$CI_COMMIT_SHA" --title "ptpsim FFI $TAG" --notes "Auto-built artifacts."'
      - 'gh release upload "$TAG" packages/camera-protocol-python/dist/*.whl --clobber'
    environment:
      CARGO_HOME: /ci-cache/cargo-home
      CARGO_TARGET_DIR: /ci-cache/target
      CARGO_INCREMENTAL: "0"
      GH_TOKEN:
        from_secret: github_token
    when:
      branch: main
      event: push
      path:
        - 'crates/**'
        - 'Cargo.toml'
        - 'Cargo.lock'
        - 'rust-toolchain.toml'
        - 'packages/camera-protocol-python/**'
        - 'ci/build-python-wheel.sh'
        - '.woodpecker/linux.yml'
