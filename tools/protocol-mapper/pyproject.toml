[project]
name = "protocol-mapper"
version = "0.1.0"
description = "Initiator-side camera-protocol probe (PCSS/PTP-IP, reference app, http/XLV, USB) — emits JSONL observation bundles. Promoted from fuji-remote."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bleak>=0.22",
  "rich>=13.7",
  "textual>=0.58",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
]
vision = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pillow>=10.0",
  "pytesseract>=0.3.10",
]

[project.scripts]
protocol-mapper = "protocol_mapper.cli:main"
fuji-ble-gps = "rce.tools.fuji_ble_gps.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rce", "protocol_mapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
required_plugins = ["pytest-asyncio>=0.23"]
# Coverage is opt-in so a bare `pytest` runs without the pytest-cov plugin.
# For a coverage run: `pip install pytest-cov` (the `test` extra includes it)
# and re-add the flags, e.g.
#   pytest --cov=rce.tools.fuji_ble_gps --cov-report=term-missing
# addopts = "--cov=rce.tools.fuji_ble_gps --cov-report=term-missing"

[tool.coverage.run]
omit = [
  "rce/tools/fuji_ble_gps/tui.py",
]
