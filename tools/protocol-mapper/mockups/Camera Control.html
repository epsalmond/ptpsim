<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera Control — Frame Remote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #08070A; color: #EDE7DD; font-family: "Inter", system-ui, sans-serif; }
    .canvas-frame {
      width: 100%; height: 100%;
      background: #050507;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="canvas-host">
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="android-frame.jsx"></script>
  <script type="text/babel" src="macos-window.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="camera-app.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "showHistogram": true,
      "showGrid": true,
      "showLevel": true,
      "showShutter": true,
      "connectionState": "live"
    }/*EDITMODE-END*/;

    // -- iOS phone frame wrapper for our app -------------------
    function PhoneIOS({ width = 380, height = 800, state, t }) {
      // The IOSDevice frame includes status bar; we render our app inside.
      return (
        <IOSDevice width={width} height={height} dark={true} hideStatusBar={false} hideHomeIndicator={false}>
          <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column' }}>
            <CameraApp
              variant="mobile"
              compact={true}
              showHistogram={t.showHistogram}
              showGrid={t.showGrid}
              showLevel={t.showLevel}
              showShutter={t.showShutter}
              initialState={state}
            />
          </div>
        </IOSDevice>
      );
    }

    // -- Android phone frame wrapper ---------------------------
    function PhoneAndroid({ width = 380, height = 800, state, t }) {
      return (
        <AndroidDevice width={width} height={height} dark={true}>
          <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column' }}>
            <CameraApp
              variant="mobile"
              compact={true}
              showHistogram={t.showHistogram}
              showGrid={t.showGrid}
              showLevel={t.showLevel}
              showShutter={t.showShutter}
              initialState={state}
            />
          </div>
        </AndroidDevice>
      );
    }

    // -- macOS window wrapper ----------------------------------
    function DesktopMac({ width = 1100, height = 720, state, t, sidebar = true }) {
      const sidebarEl = sidebar ? (
        <>
          <MacSidebarHeader title="Devices" />
          <MacSidebarItem label="X-H2 · 7B41" selected={true} />
          <MacSidebarItem label="GFX 100 · A2C9" />
          <div style={{ height: 14 }} />
          <MacSidebarHeader title="Library" />
          <MacSidebarItem label="Tethered · Today" />
          <MacSidebarItem label="Recent imports" />
          <MacSidebarItem label="Locations" />
          <div style={{ height: 14 }} />
          <MacSidebarHeader title="Workspaces" />
          <MacSidebarItem label="Studio · Tethered" />
          <MacSidebarItem label="Field · Wedding" />
        </>
      ) : null;
      return (
        <MacWindow width={width} height={height} title="Frame Remote — X-H2" sidebar={sidebarEl}>
          <CameraApp
            variant="desktop"
            compact={false}
            showHistogram={t.showHistogram}
            showGrid={t.showGrid}
            showLevel={t.showLevel}
            showShutter={t.showShutter}
            initialState={state}
          />
        </MacWindow>
      );
    }

    // -- Hero macOS shot: bigger, real-feeling -----------------
    function HeroMac({ t }) {
      return <DesktopMac width={1280} height={820} state="live" t={t} />;
    }

    // ─── Root ────────────────────────────────────────────────
    function Root() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      const STATES = [
        { id: 'disconnected', label: 'A · Disconnected' },
        { id: 'scanning', label: 'B · Scanning · BT' },
        { id: 'pairing', label: 'C · Pairing code' },
        { id: 'gps', label: 'D · GPS + clock sync' },
        { id: 'wifi-warning', label: 'E · Wi-Fi warning' },
        { id: 'wifi', label: 'F · Connecting' },
        { id: 'live', label: 'G · Live view' },
      ];

      return (
        <>
          <DesignCanvas>
            <DCSection
              id="hero"
              title="Hero — Live view"
              subtitle="Pro/utilitarian dark · X-H2 over Wi-Fi · ISO + SS + Aperture front-and-center"
            >
              <DCArtboard id="hero-mac" label="macOS · Tethered live view" width={1280} height={820}>
                <div className="canvas-frame" style={{ padding: 0 }}>
                  <HeroMac t={t} />
                </div>
              </DCArtboard>
            </DCSection>

            <DCSection
              id="flow"
              title="Connection flow — three platforms"
              subtitle="Click any setting tile in the live view to open the picker · press-and-hold to scrub · tap the frame to set AF"
            >
              {STATES.map(s => (
                <DCArtboard
                  key={`ios-${s.id}`}
                  id={`ios-${s.id}`}
                  label={`iOS · ${s.label}`}
                  width={420}
                  height={860}
                >
                  <div className="canvas-frame">
                    <PhoneIOS width={380} height={800} state={s.id} t={t} />
                  </div>
                </DCArtboard>
              ))}
            </DCSection>

            <DCSection
              id="flow-android"
              title="Connection flow — Android"
              subtitle="Same flow on Material 3 / dark"
            >
              {STATES.map(s => (
                <DCArtboard
                  key={`and-${s.id}`}
                  id={`and-${s.id}`}
                  label={`Android · ${s.label}`}
                  width={420}
                  height={860}
                >
                  <div className="canvas-frame">
                    <PhoneAndroid width={380} height={800} state={s.id} t={t} />
                  </div>
                </DCArtboard>
              ))}
            </DCSection>

            <DCSection
              id="flow-desktop"
              title="Connection flow — Desktop"
              subtitle="macOS window · sidebar shows paired devices and library"
            >
              {STATES.map(s => (
                <DCArtboard
                  key={`mac-${s.id}`}
                  id={`mac-${s.id}`}
                  label={`macOS · ${s.label}`}
                  width={1100}
                  height={720}
                >
                  <div className="canvas-frame">
                    <DesktopMac width={1040} height={680} state={s.id} t={t} sidebar={s.id === 'live'} />
                  </div>
                </DCArtboard>
              ))}
            </DCSection>

            <DCSection
              id="interactions"
              title="Interactions"
              subtitle="Try them: tap a tile to open the picker · press-and-hold a tile to scrub · tap the live view to move AF"
            >
              <DCArtboard id="int-ios-live" label="iOS · Tap setting → modal" width={420} height={860}>
                <div className="canvas-frame">
                  <PhoneIOS width={380} height={800} state="live" t={t} />
                </div>
              </DCArtboard>
              <DCArtboard id="int-and-live" label="Android · Press-hold to scrub" width={420} height={860}>
                <div className="canvas-frame">
                  <PhoneAndroid width={380} height={800} state="live" t={t} />
                </div>
              </DCArtboard>
              <DCArtboard id="int-mac-live" label="macOS · Click to set AF" width={1100} height={720}>
                <div className="canvas-frame">
                  <DesktopMac width={1040} height={680} state="live" t={t} sidebar={true} />
                </div>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Connection state — sets every artboard">
              <TweakSelect
                label="State"
                value={t.connectionState}
                options={[
                  ['disconnected', 'Disconnected'],
                  ['scanning',     'Scanning · BT'],
                  ['pairing',      'Pairing code'],
                  ['gps',          'GPS + clock sync'],
                  ['wifi-warning', 'Wi-Fi warning'],
                  ['wifi',         'Connecting'],
                  ['live',         'Live view'],
                ].map(([v, l]) => ({ value: v, label: l }))}
                onChange={(v) => setTweak('connectionState', v)}
              />
              <TweakButton label="Reset all to Live" onClick={() => setTweak('connectionState', 'live')} />
            </TweakSection>
            <TweakSection label="Live view extras">
              <TweakToggle label="Histogram" value={t.showHistogram}
                onChange={(v) => setTweak('showHistogram', v)} />
              <TweakToggle label="Rule-of-thirds grid" value={t.showGrid}
                onChange={(v) => setTweak('showGrid', v)} />
              <TweakToggle label="Level / horizon" value={t.showLevel}
                onChange={(v) => setTweak('showLevel', v)} />
              <TweakToggle label="Shutter button row" value={t.showShutter}
                onChange={(v) => setTweak('showShutter', v)} />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
