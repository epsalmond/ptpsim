[project]
name = "fuji-ble-gps"
version = "0.1.0"
description = "Laptop-side Fuji BLE GPS pairing and location sync prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bleak>=0.22",
  "rich>=13.7",
  "textual>=0.58",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
]
vision = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pillow>=10.0",
  "pytesseract>=0.3.10",
]
usb = [
  "libusb1>=3.1",
]

[project.scripts]
fuji-ble-gps = "rce.tools.fuji_ble_gps.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=rce.tools.fuji_ble_gps --cov-report=term-missing"

[tool.coverage.run]
omit = [
  "rce/tools/fuji_ble_gps/tui.py",
]
