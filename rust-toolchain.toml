# Pin the Rust toolchain so an upstream `stable` release no longer silently
# invalidates every CI cargo cache — a rustc version is baked into every
# fingerprint, so an unpinned bump forces a full cold rebuild on every runner

#
# Bump this deliberately: it costs exactly one intended cold rebuild instead of
# a surprise one every ~6 weeks. Keep it in step with the Dockerfile builder
# base image (`rust:1.96.0-slim`) so the image build, the macOS xcframework
# runner, and local dev all resolve to the same compiler.
[toolchain]
channel = "1.96.0"
components = ["clippy", "rustfmt"]
# Cross-compile targets the android-libs (Docker ci-android) and xcframework
# (macOS runner) CI steps need. Pinned here so rustup installs them FOR the
# pinned toolchain on every runner. Without this a runner that baked the targets
# into `stable` still leaves 1.96.0 without them, and build-android.sh /
# build-xcframework.sh fatal ("rustup target '…' not installed"). One change

targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
