schema: camera-config/v1

# X-A7 body manifest — recognition + BLE pairing slice only (ptpsim#306).
# The pairing-mode advert (field capture 2026-07-16: legacy manufacturer data
# 0x02 + 4-byte LE key, advertised service = cameraInformation) is modeled in
# the manufacturer index signature; the registration walk is the family
# `ble-pair` establishment, which is generation-independent (same PAIRING_KEY /
# deviceNameString / protocol-version GATT on both styles — reply §5,
# fuji-remote camera.py registration sequence). Everything beyond pairing
# (Wi-Fi AP handoff, PTP surface) is deliberately absent pending wire evidence
# on a real body.
camera:
  manufacturer: FUJIFILM
  model: X-A7

connections:
  ble:
    kind: ble
    establishment: ble-pair
