# Fujifilm manufacturer index (BLE-MVP P0).
#
# Sources for every UUID and protocol fact below:

#     §3 universal GATT catalog
#     §2 LEGACY-vs-RED detection rules
#     §5 runtime-detection sequence

#     (read first — corrects the brief; behavior observed in the reference app)


#     § "Update 2026-05-26 (D3-wire): camera-side resize is controlled via BLE"
#
# Schema: plan docs/plans/ios-rewrite-p0-p1-ble-mvp.md §2.1 (BLE-only).
# Loader: camera_config::ConfigStore::from_manufacturer_index.

manufacturer: FUJIFILM

families:
  fuji:
    ble:
      # Universal GATT catalog. Every Fuji BLE camera, every firmware.
      # The same UUIDs are used for both LEGACY and RED styles (observed in
      # the reference app; sources above). Which CHARACTERISTICS are
      # actually exposed varies at runtime (camera firmware chooses), so
      # steps that touch a per-style char (deviceIdentificationNumber)
      # must be tolerant of the char being absent (see §11.6 + reply §5).
      gatt:
        # Standard BLE GATT — read triggers the iOS bond prompt.
        protectedSerialString: "00002A25-0000-1000-8000-00805F9B34FB"
        # Standard BLE GATT — post-pair firmware version (e.g. "2.30").
        firmwareRevisionString: "00002A26-0000-1000-8000-00805F9B34FB"
        # CHARACTERISTIC_FF_PAIRING_KEY — same UUID, both styles,
        # different payload bytes (4-byte LE on LEGACY, 5-byte ASCII on RED).
        pairingKey: "ABA356EB-9633-4E60-B73F-F52516DBD671"
        # CHARACTERISTIC_FF_CONNECTED_DEVICE_NAME_STRING — phone display
        # name written by initiator (e.g. "iphone"). UTF-8 bytes.
        deviceNameString: "85B9163E-62D1-49FF-A6F5-054B4630D4A1"
        # CHARACTERISTIC_FF_CONNECTED_DEVICE_IDENTIFICATION_NUMBER —
        # RED-only first-pair read+echo challenge-response. Absent from
        # the discovered characteristic map on LEGACY bodies (reply §5).
        deviceIdentificationNumber: "F557D96B-8284-4667-8793-B971C1DECA2A"
        # Post-pair / AP-handover + first-pair CCCD-finalization chars.
        # The first and second register-notify rounds subscribe to most of
        # these during pair finalization (see the establishment steps below).
        # The reference app filters its static queue lists against the
        # discovered GATT catalog, so a body
        # missing a given characteristic just skips that CCCD enable;
        # the plan reflects that with tolerant: true on each subscribe.
        functionLaunchRequest: "600655E6-3637-42F1-8FB2-44EFC5C63B13"
        imageTransferSetting: "98934B2C-756C-4632-AA2F-DCBA1BFEC824"  # AP-handoff image-transfer arming (#102)
        apState: "A68E3F66-0FCC-4395-8D4C-AA980B5877FA"
        transferState: "BD17BA04-B76B-4892-A545-B73BA1F74DAE"
        dateSyncState: "F9150137-5D40-4801-A8DC-F7FC5B01DA50"
        locationSyncState: "AD06C7B7-F41A-46F4-A29A-712055319122"
        remoteBootSetting: "7170FD5A-56D9-4C19-B043-7A7047D8E1A0"
        cameraSSIDNameString: "BF6DC9CF-3606-4EC9-A4C8-D77576E93EA4"
        loggingSetting: "75823784-FBB7-4B71-ABAE-CD9A34072E3C"
        cameraVitalState: "E6692C5C-B7CD-44F4-95FC-EDA07CE32560"
        locationSyncSetting: "AAB609C4-94DD-4D89-BC60-665D5090B828"
        imageResizeRate: "2A125640-706D-4DD1-B420-C0F4AB93C361"
        imageResizeSetting: "82A9F452-C5CE-4EF5-8203-3FC9A47F8171"
        iptcSetting: "DEEF7187-3F43-4364-9E22-11A8C8A15951"
        locationSyncCycle: "C95D91AE-B247-4D6D-8661-7DD5D6A0F85B"
        cameraWiFiPassphraseString: "E809256A-915C-4967-92E8-53B7D4CAD213"
        # BLE-native control characteristics (#91). The app drives these from the
        # resting BLE link without Wi-Fi — see the `actions:` block below.
        # Source: client application FujiBLERegistration.swift (iosBLEReg).
        # CHARACTERISTIC_FF_SHOOTING_REQUEST — S1/S2/release state writes.
        shootingRequest: "7FCF49C6-4FF0-4777-A03D-1A79166AF7A8"
        # CHARACTERISTIC_FF_UTC_AND_TIMEZONE — 12-byte clock/timezone write.
        utcAndTimezone: "C52EDBCE-1FE2-4ECC-9483-907E6592BE9E"
        # CHARACTERISTIC_FF_LOCATION_AND_SPEED — 23-byte GPS write (payload
        # wire-verified, operators 2026-05-01 reference app run).
        locationAndSpeed: "0F36EC14-29E5-411A-A1B6-64EE8383F090"

        # Settings backup/restore characteristics (#112). The cameraSettings
        # blob is transferred in framed chunks over BLE — see the settings-backup
        # / settings-restore actions below. UUIDs from client application
        # CameraSettingsBackup.swift; wire choreography from operators

        # + APP_SETTINGS_BACKUP_RESTORE_CODE_MAP_2026-05-13.md.
        backupRequest:        "F14E7A88-6F57-4872-A69B-B47EF3295C9B"   # BackUpRequestType u16-le (arm)
        restoreRequest:       "F1897EB9-A9AA-40F0-8CE6-2FA7915BC459"   # RestoreRequestType u16-le (arm)
        fileTransactionState: "2E27ED9F-5506-41CD-BA48-DAC06669AD95"   # progress notifier [opcode u16-le][idx u16-le]
        backupState:          "11438C83-CFB0-4511-841B-759E0D2321C8"   # backup state notifier
        restoreState:         "4B3A413C-230F-42BC-B3ED-B1DB2EADEE82"   # restore state notifier
        fileInformation:      "C922AC69-9480-4348-8F4B-9EE29BC30D1D"   # total size / name metadata
        filePartialSize:      "7F3400FE-17E7-4B80-8A0E-81B0343C1B49"   # negotiated chunk size
        fileTransferIndex:    "051DD980-DF9D-4472-A2E1-35811DD24EE1"   # per-chunk index ack
        filePartialData:      "AC0C799A-FA6C-4DF5-BBC5-BB95CCE7E6EA"   # chunk frames (read on backup, write on restore)
        fileTransferResult:   "68052E8A-FB91-404F-8847-0EB4BE24308C"   # final OK/FAIL the phone writes back
        settingsKeepAlive:    "AD06C7B7-F41A-46F4-A29A-712055319122"   # keep the transfer session warm

      # Advertisement-format constants signatures reference via
      # {ble.advert.…} template refs. Family-wide. Note: RED-style cameras
      # still advertise under the Fujifilm company ID — the constant marks
      # the family, not the protocol style.
      advert:
        # 1240 = Bluetooth SIG company ID for Fujifilm.
        manufacturerCompanyId: 0x04D8
        serviceUuids:
          # SERVICE_FF_FILE_TRANSFER — presence in the advert's service-UUID
          # list classifies the advert as LEGACY style (READ_THIS_FIRST §2).
          fileTransfer: "AF854C2E-B214-458E-97E2-912C4ECF2CB8"

      # Establishment plan. Walks the same path for both styles, with an
      # `if:` for the RED-only identification-number exchange. Style +
      # pairing-key bytes come from recognize()'s runtime_scope — no
      # acquireFirmware here because pairing doesn't depend on fw.
      establishments:
        ble-pair:
          mechanism: ble-pair
          # Identity material the host caches after pairing, to replay on a later
          # ble-reconnect without re-entering pairing mode (#91). pairingKeyBytes
          # is the 4/5-byte key written to PAIRING_KEY; style + cameraSerial key
          # the cached record. Wi-Fi creds are persisted by ble-establish-wifi-ap.
          persist: [pairingKeyBytes, style, cameraSerial]
          steps:
            # Peripheral is already in app scope from recognition; the
            # dispatcher's BLE primitive holds the binding (plan §11.4).
            - bleConnect: {}

            # Trigger the iOS bond prompt by reading the standard protected
            # serial. Observed pattern: up to 20× retries 1s apart; intermediate
            # failures (insufficient-encryption / insufficient-authentication)
            # are normal while the OS bond dialog is up — tolerate them.
            # legacy bodies, but the bond prompt can stall mid-read on first
            # encounter, so keep the budget.
            - bleRead:
                gatt: protectedSerialString
                encoding: bytes
                captureAs: cameraSerial
                tolerant: true
                retries: 20
                retryDelayMs: 1000

            # Write the pairing key. Same characteristic for both styles;
            # the BYTES come from the advert (4 LE on LEGACY, 5 ASCII on RED)
            # — captured by recognize() into runtime_scope under
            # `pairingKeyBytes`.
            - bleWrite:
                gatt: pairingKey
                value: { captured: pairingKeyBytes }

            # Write the phone-side display name. App supplies this at runtime.
            - bleWrite:
                gatt: deviceNameString
                value: { runtime: terminalName, encoding: utf8 }

            # RED first-pair only: read camera-generated identification
            # number, OR it with the fixed identifier constant (0x20000000),
            # echo the result back to the same characteristic
            # READ_THIS_FIRST §6 the echo value is `(camera_id_num |
            # 0x20000000)`. The OR is the FUJI RED-protocol convention (seen
            # on Android too — NOT platform-specific), so it belongs in
            # the schema as a value transform.
            #
            # If style != "red" or the characteristic isn't exposed on this
            # body's catalog, skip. Three tolerant flags cover the cases:
            # the if-block's tolerant treats a missing `style` as not-red
            # (empty else branch); the inner bleRead's tolerant swallows the
            # gatt-not-found on a body without the characteristic; and the
            # echo bleWrite's tolerant skips when that read left `idNumber`
            # unbound (an unresolved captured ref is otherwise a hard step
            # failure per §11.6 — see #38).
            - if:
                condition: { style: { eq: "red" } }
                tolerant: true
                then:
                  - bleRead:
                      gatt: deviceIdentificationNumber
                      encoding: u32
                      captureAs: idNumber
                      tolerant: true
                      retries: 20
                      retryDelayMs: 1000
                  - bleWrite:
                      gatt: deviceIdentificationNumber
                      value:
                        captured: idNumber
                        transform: { bitOr: 0x20000000 }
                      tolerant: true
                # No else branch — LEGACY just continues past this point.

            # First register-notify round. The reference app filters this
            # static list against the discovered GATT catalog before
            # subscribing, so any char missing on a given body is just skipped
            # — tolerant: true reproduces that. Draining this queue (all
            # descriptor-write acks received) is what advances the camera's
            # discovery state to "first round complete".
            #

            - bleSubscribe: { gatt: apState,            timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: transferState,      timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: dateSyncState,      timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: locationSyncState,  timeoutMs: 3000, tolerant: true }

            # Immediately after first-round drain the reference app reads
            # TRANSFER_STATE. Mirroring it here exercises the
            # camera-side path that gates persistence on the post-CCCD
            # handshake completing, not on the writes alone.
            - bleRead:
                gatt: transferState
                encoding: bytes
                captureAs: transferState
                tolerant: true

            # Second register-notify round. Same tolerant-filter semantics as
            # the first round.
            - bleSubscribe: { gatt: remoteBootSetting,     timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: cameraSSIDNameString,  timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: loggingSetting,        timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: cameraVitalState,      timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: locationSyncSetting,   timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: imageResizeRate,       timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: imageResizeSetting,    timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: iptcSetting,           timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: locationSyncCycle,     timeoutMs: 3000, tolerant: true }

        # BLE-initiated Wi-Fi-AP / PTP-IP bring-up (issue #47). Runs after
        # ble-pair: write the function-launch request, await the camera AP
        # reaching a launched state, then read the SSID + passphrase to join.
        # The app binds `launchMode` — 0x0004 RemoteShooting (live-view/control,
        # stills+video) / 0x0003 InCameraViewIng (image-transfer) / 0x0005
        # firmware; avoid 0x0001 (no PTP/IP listener). Walking the plan leaves
        # scope["ssid"] + scope["passphrase"] bound; the camera host/port stay
        # app-side defaults (192.168.0.1:55740).
        ble-establish-wifi-ap:
          mechanism: ble-establish-wifi-ap
          prerequisite: ble-pair
          # User-initiated, not auto-chained after ble-pair (#91): the app rests
          # at a BLE-connected home and launches Wi-Fi only when the user taps a
          # Wi-Fi feature (client application requestRealCameraAPLaunch). prerequisite stays
          # advisory — onDemand tells the consumer NOT to auto-run this.
          onDemand: true
          params: [launchMode]
          # The Wi-Fi creds read below are cached for reconnect (#91), alongside
          # the pairing identity ble-pair persists.
          persist: [ssid, passphrase]
          # A successful PTP/TCP close completes before the camera returns its
          # BLE AP state to the relaunchable baseline. Consumers walk this exact
          # manifest-authored gate after an orderly feature exit; they must not
          # treat every non-launched/transitional value as reusable readiness.
          # 0x8000 NotLaunched is the same curated baseline declared by the
          # camera-initiated-transfer AP-state trigger (wireBleAutoTransfer).
          postExitReadiness:
            - bleConnect: {}
            - bleAwaitUntil:
                source: { notify: { gatt: apState, seedRead: true } }
                capture: { at: 0, length: 2, encoding: u16-le, name: apState }
                captureAs: apStateRaw
                until: { apState: { eq: "32768" } }
                timeoutMs: 20000
          steps:
            # The BLE link from ble-pair is still open; bleConnect is a no-op
            # in that case but keeps the plan self-contained and walkable.
            - bleConnect: {}

            # IMAGE_TRANSFER_SETTING arms the AP handoff: the reference app writes
            # 0x01 here IMMEDIATELY BEFORE function-launch for ALL launch modes.
            # Skipping it brings the AP up but the camera silently drops the
            # InitCommandRequest — the session is never armed (#102, device 2026-06-28).
            # Tolerant: a body without the characteristic just skips it (the
            # reference `…IfPossible` gate).
            - bleWrite:
                gatt: imageTransferSetting
                value: { literal: "01" }
                tolerant: true

            # FUNCTION_LAUNCH_REQUEST: 2-byte LE launch value bound at runtime.
            - bleWrite:
                gatt: functionLaunchRequest
                value: { runtime: launchMode, encoding: u16-le }

            # Subscribe for the terminal AP state, then issue one seed read through
            # the same predicate. The seed recovers an AP that was already launched
            # before subscription (#179); notifications carry the terminal value
            # during a fresh launch without the BLE-contention regression caused by
            # a 250 ms read poll (#202). Device evidence:

            # captureAs keeps the raw bytes for the app's fallback parsing.
            - bleAwaitUntil:
                source: { notify: { gatt: apState, seedRead: true } }
                capture: { at: 0, length: 2, encoding: u16-le, name: apState }
                captureAs: apStateRaw
                # 0x8001 Launched (live-view / RemoteShooting) + 0x8003
                # LaunchedForReservedImageTransfer — the u16-le read of wire
                # bytes [01 80]. Excludes 0x8000 NotLaunched and 0x8002
                # Launching (transitional). Device-verified (#84); the earlier
                # {384, 256} was these values byte-swapped, so it never matched.
                until: { apState: { in: "32769, 32771" } }
                # 20 s matches the camera's FUNCTION_LAUNCH_REQUEST timer: it
                # brings up the AP autonomously and reaches launched within 20 s
                # (operators APP_AP_HANDOVER_HANDSHAKE).
                timeoutMs: 20000

            # AP is up — read the credentials the app joins the network with.
            # Both are fixed-width, NUL-padded GATT string fields: utf8-cstring
            # stops at the first \0 so the join targets the bare SSID, not
            # "FUJIFILM-GFX100II-0C3E\0\0…" which never associates (#87, device
            # 2026-06-22; reference app decodes via Utils.getStringFromByteArray).
            - bleRead: { gatt: cameraSSIDNameString,       encoding: utf8-cstring, captureAs: ssid }
            # Tolerant: an OPEN AP (or legacy fw 2.30) doesn't expose the
            # passphrase characteristic; a non-tolerant read would abort the
            # whole handoff after a clean launch + SSID read. Skipped leaves
            # `passphrase` unbound and the consumer joins an open network (#85,
            # operators APP_AP_HANDOVER_HANDSHAKE_2026-05-13). SSID stays required.
            - bleRead: { gatt: cameraWiFiPassphraseString, encoding: utf8-cstring, captureAs: passphrase, tolerant: true }

        # Warm resume for an ALREADY-paired camera (#91): reconnect without
        # re-entering pairing mode. A bonded camera no longer advertises the
        # pairing key, so the host re-seeds `pairingKeyBytes` from its persisted
        # record (see ble-pair `persist:`) and replays it verbatim — the camera
        # re-recognizes the device over the still-valid OS bond. Differs from
        # ble-pair: no protectedSerialString bond-trigger (already bonded) and no
        # RED id-number echo (the camera caches it). Source:

        # (BTManager.java:1103 overrides the fresh advert key with the cached one).
        ble-reconnect:
          mechanism: ble-reconnect
          persist: [pairingKeyBytes, style, cameraSerial, ssid, passphrase]
          steps:
            - bleConnect: {}

            # Replay the cached pairing key (host re-seeds pairingKeyBytes from
            # persistence; the fresh advert is discarded on a warm resume).
            - bleWrite:
                gatt: pairingKey
                value: { captured: pairingKeyBytes }

            # Re-assert the phone-side display name.
            - bleWrite:
                gatt: deviceNameString
                value: { runtime: terminalName, encoding: utf8 }

            # Re-enable notifications — first round. Same tolerant-filter
            # semantics as ble-pair: a char missing on a body is skipped.
            - bleSubscribe: { gatt: apState,            timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: transferState,      timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: dateSyncState,      timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: locationSyncState,  timeoutMs: 3000, tolerant: true }

            # Confirm the post-CCCD handshake completed (mirrors ble-pair).
            - bleRead:
                gatt: transferState
                encoding: bytes
                captureAs: transferState
                tolerant: true

            # Re-enable notifications — second round.
            - bleSubscribe: { gatt: remoteBootSetting,     timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: cameraSSIDNameString,  timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: loggingSetting,        timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: cameraVitalState,      timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: locationSyncSetting,   timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: imageResizeRate,       timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: imageResizeSetting,    timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: iptcSetting,           timeoutMs: 3000, tolerant: true }
            - bleSubscribe: { gatt: locationSyncCycle,     timeoutMs: 3000, tolerant: true }

      # BLE-native control actions runnable from the resting BLE link without
      # Wi-Fi (#91). Source: client application FujiBLERegistration.swift (iosBLEReg);
      # GPS payload wire-verified (operators 2026-05-01). The cameraSettings
      # backup/restore chunked transfer is settings-backup / settings-restore (#112).
      actions:
        # Auto-transfer JPEG sizing (#239). The reference app exposes exactly
        # Original (resize Off), S, and XS. Both settings are camera-side BLE
        # state; consumers select these semantic plans and never carry UUIDs or
        # value encodings. Source: IMAGE_TRANSFER_FW0230_2026-05-19.md § update
        # 2026-05-26 (ImageResizeSettingValue / ImageResizeRateValue source RE).
        auto-transfer-size-original:
          evidence: [staticAutoTransferResize]
          steps:
            - bleConnect: {}
            - bleWrite: { gatt: imageResizeSetting, value: { literal: "00" } }

        auto-transfer-size-s:
          evidence: [staticAutoTransferResize]
          steps:
            - bleConnect: {}
            - bleWrite: { gatt: imageResizeRate, value: { literal: "0100" } }
            - bleWrite: { gatt: imageResizeSetting, value: { literal: "01" } }

        auto-transfer-size-xs:
          evidence: [staticAutoTransferResize]
          steps:
            - bleConnect: {}
            - bleWrite: { gatt: imageResizeRate, value: { literal: "0000" } }
            - bleWrite: { gatt: imageResizeSetting, value: { literal: "01" } }

        # Remote shutter: an S1→S2→S1→S0 press sequence on SHOOTING_REQUEST.
        # client application paces the writes 100ms/500ms/100ms apart (host-side; the
        # plan declares the byte sequence — see FujiBLERemoteReleaseSequence).
        remote-shutter:
          evidence: [iosBLEReg]
          steps:
            # Runs over the resting BLE link; bleConnect is a no-op when already
            # connected but keeps the action self-contained and walkable.
            - bleConnect: {}
            - bleWrite: { gatt: shootingRequest, value: { literal: "0100" } }   # S1 start
            - bleWrite: { gatt: shootingRequest, value: { literal: "0200" } }   # S2 hold
            - bleWrite: { gatt: shootingRequest, value: { literal: "0100" } }   # S1 return
            - bleWrite: { gatt: shootingRequest, value: { literal: "0000" } }   # S0 release

        # Clock/timezone write. The host packs the 12-byte payload (year u16-le,
        # month, day, hour, min, sec, tz-HHMM i32-le, DST flag) — its own clock —
        # and supplies it; the plan just writes it.
        write-time:
          params: [utcTimezonePayload]
          evidence: [iosBLEReg]
          steps:
            - bleConnect: {}
            # bytes-raw: the host supplies the packed binary payload as a hex
            # string. Without an explicit encoding a consumer defaults to utf8
            # (client application `decode(raw, as: encoding ?? "utf8")`), which can't carry
            # arbitrary bytes — bytes-raw round-trips the hex to the wire (#114).
            - bleWrite: { gatt: utcAndTimezone, value: { runtime: utcTimezonePayload, encoding: bytes-raw } }

        # GPS/location write. The host packs the 23-byte payload (lat/lon i32-le
        # ×1e7, alt i32-le, speed i32-le ×100, year u16-le, month, day, hour,
        # min, sec) and supplies it. Payload layout wire-verified.
        write-gps:
          params: [locationSpeedPayload]
          evidence: [iosBLEReg]
          steps:
            - bleConnect: {}
            # bytes-raw — the packed binary payload as hex; see write-time (#114).
            - bleWrite: { gatt: locationAndSpeed, value: { runtime: locationSpeedPayload, encoding: bytes-raw } }

        # Settings BACKUP (camera → phone): download the compressed settings blob
        # in framed chunks. The camera streams fileTransactionState notifications
        # [opcode u16-le][idx u16-le] — 0x0001/0x0002 announce the next chunk
        # index, 0x0003 idx=0xffff = complete — and the phone reads filePartialData
        # on each announcement. Frame: [idx u16-le][len u32-le][payload] (len ~120);
        # the final data chunk is itself indexed 0xffff. Source: operators

        # Reuses the existing bleAwaitUntil notify-loop — no new grammar.
        settings-backup:
          evidence: [iosBLEReg]
          steps:
            - bleConnect: {}
            # Hold the transfer session warm. The keep-alive cadence is
            # dispatcher-side (timed writes) — the deterministic walker only
            # models the subscription.
            - bleSubscribe: { gatt: settingsKeepAlive, timeoutMs: 3000, mode: notify, tolerant: true }
            # client application writes backupRequest 0x0100 to start (backupRequestPayload).
            # The OTA capture notes "subscribing is the trigger" on Android — model
            # the iOS control write; the Android divergence is a [EVIDENCE-GAP].
            - bleWrite: { gatt: backupRequest, value: { literal: "0100" } }
            - bleAwaitUntil:
                # fileTransactionState arrives as INDICATE on backup ([EVIDENCE-GAP]:
                # the OTA capture flags the indicate/notify split as rig-confirmable).
                source: { notify: { gatt: fileTransactionState, mode: indicate } }
                capture:
                  - { at: 0, length: 2, encoding: u16-le, name: txOpcode }
                  - { at: 2, length: 2, encoding: u16-le, name: chunkIdx }
                until: { txOpcode: { eq: "3" } }          # 0x0003 = stream complete
                onEach:
                  - bleRead: { gatt: filePartialData, encoding: bytes-raw, captureAs: chunkFrame }
                timeoutMs: 30000

        # Settings RESTORE (phone → camera): upload the host's settings blob in
        # framed chunks. Symmetric to backup — the camera announces the next index
        # on fileTransactionState and the phone WRITES the framed window for that
        # index (bleWriteChunk). The host supplies the whole blob once as a
        # bytes-raw hex param. Same [idx u16-le][len u32-le][payload] framing;
        # the final remainder window carries index 0xffff. NOTE restore is RE'd
        # from the Android reference app + one wire capture (iOS stubs it); the arm payload
        # is an [EVIDENCE-GAP], see below. Source: the same OTA doc, Restore phase.
        settings-restore:
          params: [settingsBlob]
          evidence: [iosBLEReg]
          steps:
            - bleConnect: {}
            - bleSubscribe: { gatt: settingsKeepAlive, timeoutMs: 3000, mode: indicate, tolerant: true }
            # [EVIDENCE-GAP] restore arm: CODE_MAP says writeRestoreRequest →
            # restoreRequest (RestoreRequestType u16-le), but the wire capture
            # showed a write to 7fcf49c6 with "exact payload unknown." Modeled as
            # the restoreRequest write; the value 0100 mirrors backup and needs rig
            # confirmation (cf. #91 apState bytes flagged for the rig).
            - bleWrite: { gatt: restoreRequest, value: { literal: "0100" } }
            - bleAwaitUntil:
                # fileTransactionState arrives as NOTIFY on restore ([EVIDENCE-GAP]:
                # the indicate/notify split vs backup is rig-confirmable).
                source: { notify: { gatt: fileTransactionState, mode: notify } }
                capture:
                  - { at: 0, length: 2, encoding: u16-le, name: txOpcode }
                  - { at: 2, length: 2, encoding: u16-le, name: chunkIdx }
                until: { txOpcode: { eq: "3" } }
                onEach:
                  # Frame + write the window of settingsBlob the camera just asked
                  # for. The walker owns the slice + frame; the sentinel index 65535
                  # selects the final remainder window.
                  - bleWriteChunk:
                      source: settingsBlob
                      index: chunkIdx
                      size: 120
                      gatt: filePartialData
                      frame:
                        - { field: index, encoding: u16-le }
                        - { field: length, encoding: u32-le }
                      sentinelIndex: 65535
                timeoutMs: 30000

models:
  - id: gfx100ii
    displayName: "GFX100 II"
    inherits: [fuji]
    manifest: gfx100ii/gfx100ii.yaml

    # Signatures detect the advert's style and capture the pairing-key
    # bytes into runtime_scope. A Fuji advert that matches either
    # signature produces a Candidate; recognize() seeds runtime_scope
    # with `style` and `pairingKeyBytes` (and `shortSerial` on RED) so
    # the establishment plan above can write them without further
    # app-side parsing.
    #
    # File declaration order is the signature precedence (§11.7): the
    # legacy signature is tried first because legacy adverts are
    # uniquely identifiable by the presence of SERVICE_FF_FILE_TRANSFER,
    # while RED adverts are characterised by absence (which the legacy
    # signature would have matched first).
    signatures:
      bleLegacyAdvert:
        kind: bleAdvert
        # Per READ_THIS_FIRST §5 Detection point 1: legacy advert =
        # Fuji company ID in mfg-data + SERVICE_FF_FILE_TRANSFER in the
        # advertised service-UUID list. Mfg-data payload (post-company-id,
        # §11.14): 5 bytes = type byte 0x02 + 4-byte LE pairing key.
        require:
          all:
            - manufacturerData:
                companyId: "{ble.advert.manufacturerCompanyId}"
                minLength: 5
                assertByte: { index: 0, equals: 0x02 }
            - serviceUuids: { contains: "{ble.advert.serviceUuids.fileTransfer}" }
        capture:
          - { source: manufacturerData, at: 1, length: 4, encoding: bytes-le, name: pairingKeyBytes }
        scope:
          style: "legacy"
        suggests: { connection: ble, confidence: high }

      bleRedAdvert:
        kind: bleAdvert
        # Detector: Fuji company ID + 6-byte mfg-data payload with type byte
        # 0x01. Absence of the legacy service UUID is implicit — the legacy
        # signature above is tried first (file-declaration order, §11.7) and
        # would have matched if the service UUID were present.
        require:
          manufacturerData:
            companyId: "{ble.advert.manufacturerCompanyId}"
            length: 6
            assertByte: { index: 0, equals: 0x01 }
        capture:
          # Phone writes these same 5 ASCII bytes back to PAIRING_KEY.
          - { source: manufacturerData, at: 1, length: 5, encoding: ascii, name: pairingKeyBytes }
          # Save under shortSerial too so the iOS persistence layer
          # can key the saved entry by short serial without re-decoding.
          - { source: manufacturerData, at: 1, length: 5, encoding: ascii, name: shortSerial }
        scope:
          style: "red"
        suggests: { connection: ble, confidence: high }
