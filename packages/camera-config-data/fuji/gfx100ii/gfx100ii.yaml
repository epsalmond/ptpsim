schema: camera-config/v1

# GFX100 II body manifest — App/WiFi-AP connection slice. Derived from documentation
# + the shipping client application iOS source (NOT a live wire capture yet); each fact cites
# its source via evidence `kind: ios-source | doc`. This is the backtest oracle: a
# future protocol-mapper run emits `kind: wire-capture` evidence and every mismatch
# is a source misread or a doc that lied.
camera:
  manufacturer: FUJIFILM
  model: GFX100 II
  soc: xprocessor5
  firmware: "2.30"
  identities:
    ptpDeviceName: GFX100 II

evidence:
  iosFujiPTPIP:    { kind: ios-source, path: "client application/.../client applicationCore/FujiPTPIP.swift", date: "2026-05-26" }
  iosFeatureMode:  { kind: ios-source, path: "client application/.../client applicationCore/CameraFeatureMode.swift", date: "2026-05-26" }
  iosStartupSeq:   { kind: ios-source, path: "client application/.../client applicationApp/FujiCameraAPISession.swift", date: "2026-05-26" }
  docImageTransfer: { kind: doc, path: "evidence/IMAGE_TRANSFER_FW0230.md" }
  iosBLEReg:       { kind: ios-source, path: "client application/.../client applicationCore/FujiBLERegistration.swift", date: "2026-05-26" }

  # NOT wire-captured. These USB opcodes are leads pending a golden capture.
  # STRONGEST tier: wire-confirmed over wired-gigabit + Wi-Fi infra PTP-IP tether.
  wireTether:      { kind: wire-capture, path: "tools/protocol-mapper/WIRED_TETHER_CONTROL.md", date: "2026-05-23" }
  docXlv:          { kind: doc, path: "docs/TRANSPORTS.md#xlv" }
  captureXlv:      { kind: wire-capture, path: "tools/protocol-mapper/scripts/xlv_capsweep.py" }   # routes confirmed vs camera

connections:
  app:
    kind: ptpip-app                 # WiFi-AP path (camera hosts the AP; app joins)
    establishment: ble-to-wifi-ap-v1 # BLE pairing brings up the camera AP, app joins + routes, then PTP-IP
    discovery: { mechanism: ble, announces: camera }
    modes: [Shooting/Stills, ImageTransfer]
    # Port roles per the shipping app (FujiPTPIP.swift defaultPort + offsets); working
    # live-view exercises both sockets, so this assignment is authoritative.
    bind:
      command: 55740                 # FujiPTPIP.defaultPort
      event: 55741                   # liveViewEventPortOffset = 1
      liveview: 55742                # liveViewThroughPortOffset = 2 (through-picture stream)
    # 82-byte InitCommandRequest = GUID(16) + uint32(0) + nameField(26) + tail(28).
    # Identity is manufacturer-tier (see fuji.yaml). Exact tail bytes come from the
    # pinned golden (FujiPTPIP.liveViewInitTail), NOT hand-transcribed here.
    init:
      identity: { guid: initiatorGuid, friendlyName: initFriendlyName }
      nameFieldByteCount: 26
      tailEvidence: iosFujiPTPIP     # liveViewInitTail, 28 bytes
    # Mode-graph edges over this connection. Ground truth = FujiCameraAPISession
    # startup sequence (the CameraPTPMode enum is stale/unused — its launch values
    # disagree with what the app actually sends).
    entries:
      - to: Shooting/Stills          # enter live-view from a cold App connection
        steps:
          - { setProp: "0xdf00", value: 6 }      # functionModeMajor
          - { setProp: "0xdf01", value: 0x16 }   # functionMode = 22 (live-view)
          - { readEcho: "0xdf2a" }               # read then write back
          - { sendOp: "0x902b", repeat: 4 }      # FujiVendor_902B startup ×4
          - { sendOp: "0x101c" }                 # InitiateOpenCapture
      - to: ImageTransfer            # cold entry to image-import
        steps:
          - { setProp: "0xdf01", value: 0x14 }   # functionMode = 20 (image-import)
          - { setProp: "0xdf28", value: 3 }      # feature version (uint32)
      - to: ImageTransfer            # from-qualified: switch out of live-view first
        from: Shooting/Stills
        steps:
          - { sendOp: "0x1018" }                 # TerminateOpenCapture (open-capture teardown)
          - { setProp: "0xdf01", value: 0x14 }
        # NOTE: capture suggests a teardown-free switch may exist; needs more wire
        # analysis. Modeled as the conservative (terminate-first) path for now.

  ble:
    kind: ble
    establishment: ble-pairing-v1    # named mechanism; GATT detail below (overlay-able)
    discovery: { mechanism: ble, announces: camera }
    modes: [RemoteTrigger]
    # GATT service + key characteristics (shipping-app facts; candidate for a private
    # establishment overlay). FT-XH adapter advertises its own service — concrete
    # basis for the X-H2S `requiresHardware: ft-xh` model.
    gatt:
      service: "A9D2B304-E8D6-4902-8336-352B772D7597"
      registrationService: "123D8F06-62A1-4935-9322-833C531EE225"
      deviceIdNumber: "F557D96B-8284-4667-8793-B971C1DECA2A"
      pairingKey: "ABA356EB-9633-4E60-B73F-F52516DBD671"
      apState: "A68E3F66-0FCC-4395-8D4C-AA980B5877FA"
      cameraSSIDName: "BF6DC9CF-3606-4EC9-A4C8-D77576E93EA4"
      cameraWiFiPassphrase: "E809256A-915C-4967-92E8-53B7D4CAD213"
      fileTransferXHalfService: "462426E1-D712-4A28-BE62-61A786DAA866"
    # The BLE→WiFi-AP handover: drive apState to bring the AP up, read SSID +
    # passphrase over GATT, app joins the AP → the `app` connection becomes available.
    enables:
      - to: app
        mechanism: ble-to-wifi-ap-v1
    evidence: [iosBLEReg]

  usb:
    kind: usb-ptp                    # PIMA 15740 over USB (desktop, via ImageCaptureCore)
    platforms: [macos, android, linux]   # NOT iOS (no USB-host PTP); hidden on iOS
    discovery: { mechanism: usb, announces: none, vid: 0x04cb }   # Fuji USB vendor id; per-model PID TBD
    modes: [RawConversion, BackupRestore, Webcam]
    # USB sub-mode is chosen by an on-camera menu setting, so these are user-instruction
    # edges (not app-driven). Wording approximate pending confirmation.
    entries:
      - to: RawConversion
        userInstruction: "Set the camera's USB connection mode for RAW conversion / tethering, then connect USB"
      - to: BackupRestore
        userInstruction: "Set the camera's USB connection mode for settings backup/restore, then connect USB"
    evidence: [staticRawStudio]

  wireless-tether:
    kind: ptpip-direct               # standard PTP-IP on 15740 (NOT the 55740 reference app family)
    establishment: pcss-knock-v1     # camera joins LAN (Wi-Fi/Ethernet), then PCSS port-knock
    # Wire-confirmed PCSS handshake: host LISTENs TCP 51560 → UDP knock to cam:51562
    # (PCSS/1.0 DISCOVERY) → cam NOTIFYs back to :51560 with DSCPORT:15740 → host ACKs →
    # PTP-IP on 15740. Init = GUID + hostIP + name + zeros-tail (differs from reference app's 82-byte init).
    knock: { callbackPort: 51560, knockPort: 51562, commandPort: 15740, protocol: "PCSS/1.0" }
    discovery: { mechanism: pcss-knock, announces: none, autoDiscoverable: false }  # app needs the camera's LAN address
    # RemoteTrigger here is the SAME mode node as over BLE — transport-independent (its
    # PTP/IP form can also push images to the camera; per-connection capability TODO).
    modes: [Shooting/Stills, RemoteTrigger]
    evidence: [wireTether]

  xlv:
    kind: http-xlv                   # camera HTTP web service — a SECOND protocol family (routes, not opcodes)
    # fw-divergent transport (belongs in a fw-tier overlay once the merge loader lands):
    #   fw≤2.30 → plain HTTP:80 ; fw≥2.40 → HTTPS:443, client must trust the per-camera self-signed cert.
    transport: { scheme: http, port: 80 }   # fw≤2.30 baseline; fw2.40.yaml overlays HTTPS:443
    discovery: { mechanism: http-probe, announces: none, autoDiscoverable: false }   # needs the camera's LAN address
    # Wire-confirmed routes (sweep vs 192.168.4.169); base64-JSON bodies.
    routes:
      "GET /camera/functions/{code}/get": { handler: property.get }   # → property_code_value_list
      "GET /camera/functions/{code}/cap": { handler: property.cap }   # capability descriptor
    responseEncoding: base64-json
    # ACCESS GATE — sensitive. XLV requires a bearer token in the `XLV_Auth` header. Token
    # ACQUISITION/forging is access-gate-bypass material → stays in a PRIVATE overlay (operator
    # tree), NOT this public file. Only the auth *shape* (that a bearer token is required) is public.
    auth: { scheme: bearer, header: XLV_Auth, tokenSource: private-overlay }
    modes: [Shooting/Stills]         # property read/write surface; shares engine state
    evidence: [docXlv, captureXlv]

modes:
  Shooting:
    capabilities: [exposureControl]
  Shooting/Stills:                   # live-view: app drives the camera, screen taken over
    capabilities: [liveView, remoteControl, screenTakeover]
    detect: { prop: "0xdf01", eq: 0x16 }
  ImageTransfer:
    capabilities: [browse, download]
    detect: { prop: "0xdf01", eq: 0x14 }
  RemoteTrigger:                     # screen STAYS ON (vs Shooting/Stills screenTakeover).
    # Transport-independent: reached over BLE now, and over WirelessTether PTP/IP later
    # (same camera mode, different connection). No `detect`: over BLE the mode is
    # connection-implied (no PTP functionMode read).
    capabilities: [shutterControl, eepromTransfer, gpsPersistence, cameraSettings, screenOn]
  # USB sub-modes (availability set by ops' connections: [usb]; selected by camera menu).
  RawConversion:

  BackupRestore:
    capabilities: [settingsBackup, settingsRestore]   # eeprom up/download over USB
  Webcam:
    capabilities: [webcamStream]     # known to exist; protocol not yet characterized

# Workflows = app tasks (CameraFeatureMode), gated by required connection/transport.
# bluetooth-transport features (remoteShutter/gpsPersistence/cameraSettings) belong
# to the BLE connection slice — added when that connection is modeled.
workflows:
  liveView:      { transport: app, evidence: [iosFeatureMode] }
  imageTransfer: { transport: app, evidence: [iosFeatureMode] }
  remoteShutter:  { transport: ble, evidence: [iosFeatureMode] }   # CameraFeatureMode bluetooth features
  gpsPersistence: { transport: ble, evidence: [iosFeatureMode] }
  cameraSettings: { transport: ble, evidence: [iosFeatureMode] }   # eeprom up/download

operations:
  "0x101c": { name: InitiateOpenCapture,  owner: standard-ptp, modes: [Shooting], evidence: [iosStartupSeq] }
  "0x1018": { name: TerminateOpenCapture, owner: standard-ptp, modes: [Shooting], evidence: [iosStartupSeq] }
  "0x902b": { name: FujiVendor902B,       owner: fuji-vendor,  modes: [Shooting/Stills], evidence: [iosStartupSeq] }
  "0x900c": { name: SendRawFromPcObjectInfo, owner: fuji-vendor, modes: [RawConversion], connections: [usb], evidence: [staticRawStudio] }
  "0x900d": { name: SendRawFromPcObject,     owner: fuji-vendor, modes: [RawConversion], connections: [usb], evidence: [staticRawStudio] }
  "0x100c": { name: SetBackupSettingsInfo,   owner: standard-ptp, modes: [BackupRestore], connections: [usb], evidence: [staticRawStudio] }
  "0x100d": { name: SetBackupSettings,       owner: standard-ptp, modes: [BackupRestore], connections: [usb], evidence: [staticRawStudio] }
  "0x1008": { name: GetBackupSettingsInfo,   owner: standard-ptp, modes: [BackupRestore], connections: [usb], evidence: [staticRawStudio] }
  "0x1009": { name: GetBackupSettings,       owner: standard-ptp, modes: [BackupRestore], connections: [usb], evidence: [staticRawStudio] }
  # WirelessTether live-view = vendor 0x9018 (vs the App connection's 0x101c+GetObject).
  "0x9018": { name: SdkGetLiveViewData,      owner: fuji-vendor,  modes: [Shooting/Stills], connections: [wireless-tether], evidence: [wireTether] }

properties:
  "0xdf00": { name: functionModeMajor, type: u16, access: readWrite, evidence: [iosStartupSeq] }
  "0xdf01": { name: functionMode,      type: u16, access: readWrite, evidence: [iosStartupSeq] }
  "0xdf2a": { name: liveDf2a,          type: u16, access: readWrite, evidence: [iosStartupSeq] }  # read-echo'd on live-view entry
  "0xdf28": { name: featureVersion,    type: u32, access: readWrite, evidence: [iosStartupSeq, docImageTransfer] }
  "0xd185": { name: rawSettings,       type: u8a, access: readWrite, evidence: [staticRawStudio] }  # 0x275-byte RAW-conv buffer (field map TBD)
  # Big-3 over WirelessTether = ABSOLUTE standard PTP props via SetDevicePropValue 0x1016
  # (vs the App connection's vendor relative-step 0x902d). Same logical control, mechanism
  # differs by connection — hence controls keyed by connection id.
  "0x5007": { name: aperture, ptpName: FNumber, type: u16, access: readWrite,
              controls: { wireless-tether: { setMethod: absolute, operation: "0x1016" } }, evidence: [wireTether] }   # uint16 ×100 (f/2.8=280)
  "0x500f": { name: iso, ptpName: ExposureIndex, type: u32, access: readWrite,
              controls: { wireless-tether: { setMethod: absolute, operation: "0x1016" } }, evidence: [wireTether] }   # literal ISO; 0xffffffff/-2 = auto
  "0x500d": { name: shutterSpeed, ptpName: ExposureTime, type: u32, access: readWrite,
              controls: { wireless-tether: { setMethod: absolute, operation: "0x1016" } }, evidence: [wireTether] }   # microseconds
  "0x500e": { name: exposureProgram, ptpName: ExposureProgram, type: u16, access: readWrite, evidence: [wireTether] }   # PASM

quirks:
  - id: pcss-knock-once-per-boot
    appliesTo: [wireless-tether]
    behavior: "The PCSS knock (UDP 51562) is accepted only once per camera boot; after one session the camera ICMP-rejects further knocks until power-cycled."
    evidence: wireTether
