schema: camera-config/v1

# GFX100 II body manifest — App/WiFi-AP connection slice. Derived from documentation
# + the shipping client application iOS source (NOT a live wire capture yet); each fact cites
# its source via evidence `kind: ios-source | doc`. This is the backtest oracle: a
# future protocol-mapper run emits `kind: wire-capture` evidence and every mismatch
# is a source misread or a doc that lied.
camera:
  manufacturer: FUJIFILM
  model: GFX100 II
  soc: xprocessor5
  firmware: "2.30"
  identities:
    ptpDeviceName: GFX100 II
    # Synthetic simulator serial, served as DeviceInfo.serial_number (#152). A
    # real body reports its unit serial here, equal to the BLE full-serial
    # characteristic — deliberately NOT a real unit's serial.
    serialNumber: PTPSIM-GFX100II-0001

evidence:
  iosFujiPTPIP:    { kind: ios-source, path: "client application/.../client applicationCore/FujiPTPIP.swift", date: "2026-05-26" }
  iosFeatureMode:  { kind: ios-source, path: "client application/.../client applicationCore/CameraFeatureMode.swift", date: "2026-05-26" }
  iosStartupSeq:   { kind: ios-source, path: "client application/.../client applicationApp/FujiCameraAPISession.swift", date: "2026-05-26" }
  iosLiveControls: { kind: ios-source, path: "client application/.../client applicationApp/FujiCameraAPISession.swift", date: "2026-05-27" }
  docLiveControls: { kind: doc, path: "evidence/PTP_PROPERTIES_REFERENCE.md" }
  docImageTransfer: { kind: doc, path: "evidence/IMAGE_TRANSFER_FW230.md" }
  iosBLEReg:       { kind: ios-source, path: "client application/.../client applicationCore/FujiBLERegistration.swift", date: "2026-05-26" }

  # NOT wire-captured. These USB opcodes are leads pending a golden capture.
  # STRONGEST tier: wire-confirmed over wired-gigabit + Wi-Fi infra PTP-IP tether.
  wireTether:      { kind: wire-capture, path: "https://github.com/epsalmond/camera-protocol-mapper/blob/1808084c6bf048d89ea5038af4e7d10e07331946/WIRED_TETHER_CONTROL.md", date: "2026-05-23" }
  # Per-(connection,mode) GetDeviceInfo + GetDevicePropDesc snapshots on PCSS/15740.
  # Authoritative for the wireless-tether supported-ops set (2026-05-27 wire capture);
  # stills and video snapshots had the same ops/props/events surface.
  wireTetherCaps20260527: { kind: wire-capture, path: "packages/camera-config-data/fuji/gfx100ii/evidence/probe/2026-05-27-ptp-evidence-wireless-stills.jsonl", date: "2026-05-27" }
  # reference-app Take↔Get session-reopen wire trace (full byte trace + identity decode).
  # Source for the `reopenSession` step in the image-transfer → shooting/stills entry.

  # Wire-decoded 0xD212 tight-format live-status snapshot stream (u16 count +
  # 6-byte <propCode u16><value u32> records) + the v6/v8/v9 member catalogs.

  # 14.9-min Hyper-Utility shoot-while-download capture on PCSS/15740. Wire-confirms
  # the 3-beat D039+0x100E shutter verb, the 0x1007/8/A/9/B transfer triad,
  # 0x500F ISO encoding (signed -1/-2 sentinels), and event-less command socket.

  docXlv:          { kind: doc, path: "docs/TRANSPORTS.md#xlv" }
  captureXlv:      { kind: wire-capture, path: "https://github.com/epsalmond/camera-protocol-mapper/blob/1808084c6bf048d89ea5038af4e7d10e07331946/scripts/xlv_capsweep.py" }   # routes confirmed vs camera
  # Wire-derived PTP/IP property + opcode reference, combining live B1 enum + reference-app instrumentation
  # wire-decode work. Authoritative for the new gallery-filter triplet
  # (0x9051/0x9052/0x9060), the post-shutter event codes (0xC001/0xC004/0x400D),
  # and the firmware-update event (0x80F8). Labels disagreeing with curated
  # wire+protocol-mapper sources (e.g. 0x9050 "FujiImageImportBegin"
  # curated wire-derived names hold per the precedence rule.




sentinels:
  # PTP/IP length-8 frame with body 0xffffffff. Sent before the final FIN when
  # reopening image-transfer so the camera holds its Wi-Fi AP up (#82).
  keepApSentinel: { bytes: "08000000ffffffff", evidence: [docImageTransfer] }

sequenceGates:
  # Real fw02.30 does not answer D620/D621 until the image-import vendor/bootstrap
  # ritual has completed. The app sequence includes D212/D22B before 0x9053 and
  # a final D212 after it; D22B's value remains semantically opaque (#181).
  imageImportBootstrap:
    evidence: [docFujiPtpPropReference, docImageTransfer]

# Connection-name convention:
#   `app`             = reference-app PTP/IP on :55740 (BLE -> camera Wi-Fi AP -> 82B WMB-tail init).
#   `wireless-tether` = PCSS/infrastructure-mode PTP/IP on :15740 (camera joins LAN,
#                       then the host reaches it through the PCSS knock/notify path).
# These ride Wi-Fi but are different PTP/IP personas with different supported-op sets,
# different InitCmdReq tails, and different live-view paths (`0x101C`+stream vs
# `0x9018` polled).
connections:
  app:
    kind: ptpip-app                 # WiFi-AP path (camera hosts the AP; app joins)
    establishment: ble-establish-wifi-ap # BLE pairing brings up the camera AP, app joins + routes, then PTP-IP
    # Per-connection traits (#81): the app selects behavior from these, not by
    # branching on the connection id.
    initShape: app82                    # the 82-byte reference app InitCommandRequest (#82)
    liveViewDelivery: { kind: stream }   # reference app delivers frames as a continuous stream
    shutterRecipe: appPostview           # 0x100E + 0x9022 postview take-cycle
    # Wire framing per channel (#133) so the app picks the codec from data, not by
    # mapping the connection kind in Swift. Command = the byte-exact fw0230 compressed
    # channel; the event socket carries PIMA type-4 containers (Swift parsePTPEvent).
    commandFraming: compressed
    eventFraming: usb
    # The keep-AP sentinel holds the Wi-Fi AP up. A reconnect from active
    # live-view is refused because that transport-close tears down the :55740
    # command-port listener, so Take→Get stays in-session (#103, device
    # 2026-06-28). Get→Take reopens after image-import because no open-capture
    # stream owns the listener on that edge.
    commandListenerVolatile: true
    discovery: { mechanism: ble, announces: camera }
    modes: [shooting/stills, shooting/video, image-transfer]
    # Port roles per the shipping app (FujiPTPIP.swift defaultPort + offsets); working
    # live-view exercises both sockets, so this assignment is authoritative. Resolved
    # ports (not offsets) so a consumer binds by role and deletes the Fuji +1/+2 math.
    bindings:
      command: 55740                 # FujiPTPIP.defaultPort
      event: 55741                   # command + 1 (live-view event socket)
      liveView: 55742                # command + 2 (through-picture stream)
    # Before reopening an image-transfer session the app sends the 8-byte keep-AP
    # sentinel (0xffffffff framed) instead of a TCP FIN, holding the Wi-Fi AP up (#82).
    transportClose: { sentinel: keepApSentinel, when: before-image-transfer-reopen }
    # 82-byte InitCommandRequest = GUID(16) + uint32(0) + nameField(26) + tail(28).
    # Identity is manufacturer-tier (see fuji.yaml). Exact tail bytes come from the
    # pinned golden (FujiPTPIP.liveViewInitTail), NOT hand-transcribed here.
    init:
      identity: { guid: initiatorGuid, friendlyName: initFriendlyName }
      nameFieldByteCount: 26
      # The 28-byte fw-2.30 vendor trailer (cc004f00 + "WMB" UTF-16LE + zeros), so
      # the app replays bytes from data instead of Swift literals (#82). Byte-perfect
      # per INIT_COMMAND_REQUEST_FW0230_CORRECTION; matches fuji_init's tested TAIL.
      tail: "cc004f000000000000000000000057004d0042000000000000000000"
      tailEvidence: iosFujiPTPIP     # liveViewInitTail, 28 bytes
    # Mode-graph edges over this connection. Ground truth = FujiCameraAPISession
    # startup sequence (the CameraPTPMode enum is stale/unused — its launch values
    # disagree with what the app actually sends).
    entries:
      - to: shooting/stills          # enter live-view from a cold App connection
        steps:
          # tolerant: the GFX100 II rejects this advisory write with 0x201d
          # on hardware — mode entry must continue past it. Device-validated
          # in client application (their #4; previously a local vendor patch there).
          - { setProp: "0xdf00", value: 6, tolerant: true }   # functionModeMajor
          - { setProp: "0xdf01", value: 0x16 }   # functionMode = 22 (live-view)
          - { readEcho: "0xdf2a" }               # read then write back
          - { sendOp: "0x902b", repeat: 4 }      # FujiVendor_902B startup ×4
          - { sendOp: "0x101c" }                 # InitiateOpenCapture
      - to: shooting/stills          # from image-import back to live-view
        from: image-transfer
        # Ground truth: MODE_CHANGES.md §5b. Get→Take reopens the PTP/IP
        # session while the Wi-Fi AP stays up, then selects FunctionMode=Take
        # and starts live-view. Unlike the #103 Take→Get regression, no live
        # open-capture stream is active on this edge.
        steps:
          - { reopenSession: {} }
          - { setProp: "0xdf00", value: 6, tolerant: true }  # functionModeMajor
          - { setProp: "0xdf01", value: 0x16 }               # functionMode = 22 (live-view)
          - { setProp: "0xdf2a", value: 2 }                  # Fpcsh_VersionRemoteEx
          - { sendOp: "0x902b", repeat: 4 }                  # FujiVendor_902B startup ×4
          - { sendOp: "0x101c" }                             # InitiateOpenCapture
      - to: shooting/video          # in-live-view stills→video selector
        from: shooting/stills
        steps:
          - { setProp: "0xd246", value: 1 }                  # 1 = video
      - to: shooting/stills         # in-live-view video→stills selector
        from: shooting/video
        steps:
          - { setProp: "0xd246", value: 0 }                  # 0 = stills
      - to: image-transfer            # cold entry to image-import (no live-view active)
        # Ground truth: FujiCameraAPISession.enterImageImportModeUnlocked + IMAGE_TRANSFER_FW230.
        steps:
          - { getProp: "0xd212", tolerant: true, startsGate: imageImportBootstrap } # live-status preamble (best-effort)
          - { setProp: "0xdf01", value: 0x14 }               # functionMode = 20 (image-import)
          - { getProp: "0xdf28", tolerant: true }            # read-before-write (advisory negotiator)
          - { setProp: "0xdf28", value: 3, tolerant: true }   # feature version; uint32 width from the property type
          - { setProp: "0xd226", value: 0, tolerant: true }   # image-import filter
          - { setProp: "0xd227", value: 0, tolerant: true }   # image-import sort
          - { getProp: "0xd244", tolerant: true }             # image-import preamble
          # Vendor-prime block required before GetObjectHandles (0xd620/0xd621). Advisory:
          # a body/responder may reject these (vcam returns DeviceProp_Not_Supported) — tolerate.
          - { sendOp: "0x9054", params: [0x10000001], tolerant: true }
          - { sendOp: "0x9055", params: [0x10000001], tolerant: true }
          - { sendOp: "0x9050", tolerant: true }
          - { getProp: "0xd212", tolerant: true }
          - { getProp: "0xd22b", tolerant: true }
          - { sendOp: "0x9053", params: [0, 0x7530], tolerant: true }
          - { getProp: "0xd212", tolerant: true, completesGate: imageImportBootstrap }
      - to: image-transfer            # from live-view: terminate the open-capture first, then enter
        from: shooting/stills
        steps:
          # 0x1018 needs the live-view InitiateOpenCapture transaction id — RUNTIME state the
          # app binds into the named slot (it owns transaction ids; sans-io).
          - { sendOp: "0x1018", params: [{ runtime: openCaptureTxId }] }
          # Switch functionMode IN-SESSION over the existing :55740 socket — main's working,
          # reopen-free flow. The earlier `reopenSession` here was a misdiagnosis of the
          # "image transfer downloads 0 files" bug: the real GFX100 II REFUSES the reconnect
          # (the command-port listener is gone after the transport-close — see the `app`
          # connection's commandListenerVolatile trait), so the reopen self-destructs.
          # 0x9054 is accepted in-session and files download (device-confirmed 2026-06-28, #103).
          - { getProp: "0xd212", tolerant: true, startsGate: imageImportBootstrap }
          - { setProp: "0xdf01", value: 0x14 }
          - { getProp: "0xdf28", tolerant: true }
          - { setProp: "0xdf28", value: 3, tolerant: true }
          - { setProp: "0xd226", value: 0, tolerant: true }
          - { setProp: "0xd227", value: 0, tolerant: true }
          - { getProp: "0xd244", tolerant: true }
          - { sendOp: "0x9054", params: [0x10000001], tolerant: true }
          - { sendOp: "0x9055", params: [0x10000001], tolerant: true }
          - { sendOp: "0x9050", tolerant: true }
          - { getProp: "0xd212", tolerant: true }
          - { getProp: "0xd22b", tolerant: true }
          - { sendOp: "0x9053", params: [0, 0x7530], tolerant: true }
          - { getProp: "0xd212", tolerant: true, completesGate: imageImportBootstrap }
    actions:
      # reference-app shutter cycle. Wire-confirmed by MODE_CHANGES.md §3 (the 0x100E
      # trace) + §6b (the 0x9022 pairing): every 0x100E InitiateCapture in v6
      # is followed within ~458-746ms by an empty-params 0x9022 cleanup,
      # paired 1:1 with the shutter. Between the two, reference-app polls 0xD212
      # (event state) several times waiting for the camera-side
      # "JPEG-saved" flag to clear; the poll loop is the client's
      # responsibility (no scripting hook in the Step grammar). triggers
      # postviewEvent declares the post-shutter state-change the client
      # polls for / awaits.
      shutter:
        mode: shooting/stills
        steps:
          - { sendOp: "0x100e", params: [0, 0] }
          # Wait for the camera's PostviewComplete event (JPEG saved to card,
          # fires ~400-750ms after 0x100E) before reading the postview — the
          # event IS the readiness signal, the 0x9022 below is the data read.
          # Makes the take cycle manifest-scripted, not client responsibility
          # (#29). Evidence: operators FUJI_PTP_PROP_REFERENCE §6 + MODE_CHANGES §6b.
          - awaitUntil:
              source: { event: { code: "0xc001" } }
              until: { all: [] }          # event arrival alone satisfies (no value to check)
              timeoutMs: 8000
          - { sendOp: "0x9022" }
        triggers:
          - postviewEvent: {}
        evidence: [wireReopenTrace, iosLiveControls, docLiveControls]
      # Tap-to-AF (#35, §5.5): lock S1 on a packed focus-area, await the AF
      # completion event (0xC005), then read the lock result. The packed area
      # u32 is an app-supplied runtime slot — the app owns cursor→cell packing
      # (StepParam carries no arithmetic), so ptpsim grows no packing vocabulary.
      autofocusLock:
        mode: shooting/stills
        params: [afArea]
        steps:
          - { sendOp: "0x9026", params: [{ runtime: afArea }] }
          - awaitUntil:
              source: { event: { code: "0xc005", thenPoll: "0xd209" } }
              until:
                any:
                  - { prop: "0xd209", eq: 1 }   # 0xD209 S1LockColor: 1 = locked
                  - { prop: "0xd209", eq: 2 }   # 2 = AF failed, still a terminal focus result
              timeoutMs: 5000
              # 0xC005 acknowledges the AF cycle, it does NOT carry the result:
              # fw02.30 fires it ~100ms after 0x9026 while 0xD209 still reads
              # pre-settle, so the post-event read re-polls at this cadence
              # within timeoutMs (client application#157, #185).
              intervalMs: 100
        evidence: [iosLiveControls, docLiveControls]
      autofocusRelease:
        mode: shooting/stills
        steps:
          - { sendOp: "0x9027" }
        evidence: [iosLiveControls, docLiveControls]
      # reference-app enumeration. Wire-confirmed by IMAGE_TRANSFER_FW230.md
      # §"Confirmed enumeration": reference-app **never** calls 0x1007
      # GetObjectHandles — camera rejects with 0x2005 Operation_Not_Supported
      # on fw2.30. Instead it reads count + handle list as PTP properties
      # AFTER the mode-entry vendor-prime block (0x9054/55/50/53) in the
      # `to: image-transfer` entry has run. 0xD620 returns u32 count;
      # 0xD621 returns a count-prefixed u32[] handle list, **descending /
      # newest-first** (v6: 0x83, 0x82, …, 0x01). Pre-reading 0xD620 sizes
      # the buffer for 0xD621.
      enumerateObjects:
        mode: image-transfer
        steps:
          - { getProp: "0xd620" }
          - { getProp: "0xd621" }
        evidence: [docImageTransfer]
      # Per-handle metadata + thumbnail — same wire shape as PCSS, different
      # surface (reference-app goes through the image-transfer mode-entry first).
      # UI MUST publish the handle list immediately and fetch GetObjectInfo
      # lazily per selected object — per the on-device note 2026-05-22 in
      # IMAGE_TRANSFER_FW230.md, an eager full GetObjectInfo sweep got the
      # command socket closed mid-stream on a real GFX100 II.
      getObjectInfo:
        mode: image-transfer
        params: [handle]
        steps:
          - { sendOp: "0x1008", params: [{ runtime: handle }] }
        evidence: [docImageTransfer]
      getThumb:
        mode: image-transfer
        params: [handle]
        steps:
          - { sendOp: "0x100a", params: [{ runtime: handle }] }
        evidence: [docImageTransfer]
      # Chunked download. The action params are the logical caller inputs:
      # handle plus a 64-bit offset and length. The wire step derives
      # GetPartialObject(handle, offset_low, length, offset_high) from that
      # single offset slot; offset_high is not a separate caller input. For
      # oversized MOV objects, ObjectInfo reports 0xffffffff and the true
      # transfer size comes from 0x9803(handle, 0xdc04).
      getObject:
        mode: image-transfer
        params: [handle, offset, length]
        steps:
          - sendOp: "0x101b"
            params:
              - { runtime: handle }
              - { runtime: offset, mask: 0xffffffff }
              - { runtime: length }
              - { runtime: offset, shift: 32 }
        evidence: [docImageTransfer, docLargeMovObjectInfo]
      # #46: the FULL image-transfer choreography as ONE manifest-owned loop, so
      # the reference executor walks arm → enumerate → for-each handle
      # { getObjectInfo (sizes the object) → chunk-download until exhausted } end
      # to end — identical on sim and device. Closed loop primitives only: the
      # executor owns the chunk offset cursor; the author declares total + window.
      #
      # The eager per-handle sweep here is the executable REFERENCE of the transfer
      # SHAPE. A production dispatcher still publishes the handle list immediately
      # and fetches lazily per selected object (the on-device socket-close note in
      # IMAGE_TRANSFER_FW230.md) — getThumb stays a standalone lazy action above,
      # NOT in this loop. Wire shape: IMAGE_TRANSFER_FW230.md (0x101B, 12 MiB chunks).
      importObjects:
        mode: image-transfer
        steps:
          # --- arm (mirrors the to:image-transfer mode-entry; idempotent, tolerant) ---
          - { getProp: "0xd212", tolerant: true, startsGate: imageImportBootstrap }
          - { setProp: "0xdf01", value: 0x14 }
          - { getProp: "0xdf28", tolerant: true }
          - { setProp: "0xdf28", value: 3, tolerant: true }
          - { setProp: "0xd226", value: 0, tolerant: true }
          - { setProp: "0xd227", value: 0, tolerant: true }
          - { getProp: "0xd244", tolerant: true }
          - { sendOp: "0x9054", params: [0x10000001], tolerant: true }
          - { sendOp: "0x9055", params: [0x10000001], tolerant: true }
          - { sendOp: "0x9050", tolerant: true }
          - { getProp: "0xd212", tolerant: true }
          - { getProp: "0xd22b", tolerant: true }
          - { sendOp: "0x9053", params: [0, 0x7530], tolerant: true }
          - { getProp: "0xd212", tolerant: true, completesGate: imageImportBootstrap }
          # --- enumerate (count sizes the 0xd621 handle list) ---
          - { getProp: "0xd620" }
          # --- per-handle: learn reported/true size, then chunk-download until exhausted ---
          - loop:
              forEach:
                in: "0xd621"          # descending handle list (array property)
                bind: handle
                body:
                  - sendOp: "0x1008"
                    params: [{ runtime: handle }]
                    captures:
                      - { bind: objectReportedSize, as: objectInfoCompressedSize }
                      - { bind: objectTransferSize, as: objectInfoCompressedSize }
                  - if:
                      slot: objectReportedSize
                      equals: 0xffffffff
                      then:
                        - sendOp: "0x9803"
                          params: [{ runtime: handle }, 0xdc04]
                          captures:
                            - { bind: objectTransferSize, as: u64Le }
                  - getProp: "0xd235"
                    captures:
                      - { bind: chunkSize, as: propValue }
                  - loop:
                      chunk:
                        total: objectTransferSize
                        size: { runtime: chunkSize }
                        offsetBind: offset
                        lengthBind: length
                        body:
                          - sendOp: "0x101b"  # GetPartialObject(handle, offset_low, length, offset_high)
                            params:
                              - { runtime: handle }
                              - { runtime: offset, mask: 0xffffffff }
                              - { runtime: length }
                              - { runtime: offset, shift: 32 }
        triggers: []
        evidence: [docImageTransfer, docLargeMovObjectInfo]

  ble:
    kind: ble
    establishment: ble-pair    # named mechanism; GATT detail below (overlay-able)
    discovery: { mechanism: ble, announces: camera }
    modes: [remote-trigger]
    # GATT service + key characteristics (shipping-app facts; candidate for a private
    # establishment overlay). FT-XH adapter advertises its own service — concrete
    # basis for the X-H2S `requiresHardware: ft-xh` model.
    gatt:
      service: "A9D2B304-E8D6-4902-8336-352B772D7597"
      registrationService: "123D8F06-62A1-4935-9322-833C531EE225"
      deviceIdNumber: "F557D96B-8284-4667-8793-B971C1DECA2A"
      pairingKey: "ABA356EB-9633-4E60-B73F-F52516DBD671"
      apState: "A68E3F66-0FCC-4395-8D4C-AA980B5877FA"
      cameraSSIDName: "BF6DC9CF-3606-4EC9-A4C8-D77576E93EA4"
      cameraWiFiPassphrase: "E809256A-915C-4967-92E8-53B7D4CAD213"
      fileTransferXHalfService: "462426E1-D712-4A28-BE62-61A786DAA866"
    # The BLE→WiFi-AP handover: drive apState to bring the AP up, read SSID +
    # passphrase over GATT, app joins the AP → the `app` connection becomes available.
    enables:
      - to: app
        mechanism: ble-establish-wifi-ap
    evidence: [iosBLEReg]

  usb:
    kind: usb-ptp                    # PIMA 15740 over USB (desktop, via ImageCaptureCore)
    platforms: [macos, android, linux]   # NOT iOS (no USB-host PTP); hidden on iOS
    discovery: { mechanism: usb, announces: none, vid: 0x04cb }   # Fuji USB vendor id; per-model PID TBD
    modes: [raw-conv-backup-restore, webcam]
    # USB sub-mode is chosen by an on-camera menu setting, so this is a user-instruction
    # edge (not app-driven). raw-conv-backup-restore is ONE on-camera mode enabling two
    # workflows (raw conversion + settings backup-restore).
    entries:
      - to: raw-conv-backup-restore
        userInstruction: "Set the camera's USB connection mode for RAW conversion / settings backup-restore, then connect USB"
    evidence: [staticRawStudio]

  wireless-tether:
    kind: ptpip-direct               # standard PTP-IP on 15740 (NOT the 55740 reference-app family)
    establishment: pcss-knock     # camera joins LAN (Wi-Fi/Ethernet), then PCSS port-knock
    # Per-connection traits (#81): a different init family, poll-based live view,
    # and the 3-beat virtual shutter — all data-driven, not app id-branches.
    initShape: pcssKnock                                  # PCSS init (not the 82-byte reference app)
    liveViewDelivery: { kind: poll, pollOp: "0x9018" }    # app polls 0x9018 for frames
    shutterRecipe: wirelessTether3Beat                    # 3-beat 0xD039 + 0x100E virtual shutter
    # Command socket = the PCSS knock's DSPORT (default 15740; runtime confirms it). No
    # event/live-view socket — delivery is the 0x9018 poll (capture: events ct=4 = 0).
    bindings: { command: 15740 }
    # The command/data channel is Fuji-compressed (data-phase types 9/10/12), same as the
    # app path; only the InitCommandRequest is standard-framed (#133, PR feedback 2026-07-01).
    commandFraming: compressed
    # Wire-confirmed PCSS handshake: host LISTENs TCP 51560 → UDP knock to cam:51562
    # (PCSS/1.0 DISCOVERY) → cam NOTIFYs back to :51560 with DSCPORT:15740 → host ACKs →
    # PTP-IP on 15740. Init = GUID + hostIP + name + zeros-tail (differs from reference-app's 82-byte init).
    knock: { callbackPort: 51560, knockPort: 51562, commandPort: 15740, protocol: "PCSS/1.0" }
    # InitCmdReq retry tolerance: PCSS may emit 0-3 InitFail packets before
    # InitCmdAck. Hyper-Utility waits ~250ms between retries; the engine should
    # accept up to 3 retries before treating the handshake as failed
    # (wirePCSSShootDownload20260523).
    initRetries: { max: 3, backoffMs: 250 }
    discovery: { mechanism: pcss-knock, announces: none, autoDiscoverable: false }  # app needs the camera's LAN address
    # remote-trigger here is the SAME mode node as over BLE — transport-independent (its
    # PTP/IP form can also push images to the camera; per-connection capability TODO).
    modes: [shooting/stills, remote-trigger]
    # Wire-confirmed NOT-supported on this connection (per the 05-27 capability snapshot
    # `wireTetherCaps20260527` + wire-capture 2026-06-02 replies). Don't author entries that
    # rely on these — the camera will reject them:
    #   - 0x9022 (post-shutter cleanup):  reference-app-only; do NOT pair with 0x100E here.
    #   - 0x101b (GetPartialObject):      not advertised — whole-object only via 0x1009.
    #   - 0xDF01 (FunctionMode):          PCSS enters transfer-mode implicitly; no flip.
    #   - 0x9050/0x9053/0x9054/0x9055:    reference-app mode-20 vendor block; not used on PCSS.
    #   - Event socket (command socket only): 0 events delivered across 184s/34k
    #     frames of active shooting — confirms PCSS is event-less mid-shoot.
    # Wire-confirmed SUPPORTED (wirePCSSShootDownload20260523) — recipes in `actions:`
    # below per docs/plans/action-verbs.md. Still open: 0xD037 stills↔video flip
    # transition capture (Q3) — the 05-27 video evidence is a capability snapshot
    # only, not proof of PCSS movie recording or MOV transfer. Keep PCSS MOV /
    # >4 GiB MOV transfer unmodeled until a real PCSS MOV transfer capture lands.
    actions:
      # Session-scoped identity read (#173): the actual body's unit serial (the
      # saved-camera merge key) + supported ops, via parse_device_info on the
      # data phase. Empty mode = not mode-gated. The 05-27 probe snapshots are
      # per-(connection,mode) GetDeviceInfo captures on this connection. NOT
      # authored on `app`: the reference app never sends 0x1001 on the reference app
      # channel (v6 wire-level run has zero 0x1001 frames) — deferred pending
      # a capture.
      readDeviceInfo:
        mode: ""
        steps:
          - { sendOp: "0x1001", params: [] }
        evidence: [wireTetherCaps20260527]
      # One caller-scheduled PCSS session keepalive iteration. Captures show
      # variable bursts/periodic intervals, so cadence is deliberately not
      # modeled here; clients loop this recipe while the PCSS session is alive.
      keepalive:
        mode: ""
        steps:
          - { setProp: "0xd21c", value: 0 }
          - { setProp: "0xd207", value: 1 }
        evidence: [wirePCSSShootDownload20260523]
      # 3-beat virtual-shutter sequence. Each beat is `setProp 0xD039 = <phase>` +
      # `0x100E InitiateCapture(0,0)`. Phase byte layout is `[lo0, lo1, hi0, hi1]`
      # — beats 1/2 set the high word (request: phase 1/2); beat 3 sets the low
      # word (acknowledge: commit). Total wall ~108ms (beat 1 includes the
      # exposure). `objectsAvailable` declares the bounded transfer queue growth
      # the client should poll after invoking the action.
      shutter:
        mode: shooting/stills
        steps:
          - { setProp: "0xd039", value: 0x00010000 }
          - { sendOp:  "0x100e", params: [0, 0] }
          - { setProp: "0xd039", value: 0x00020000 }
          - { sendOp:  "0x100e", params: [0, 0] }
          - { setProp: "0xd039", value: 0x00000001 }
          - { sendOp:  "0x100e", params: [0, 0] }
        # User's format selection (JPEG / HEIF / RAW) determines how many
        # objects become available per press — 1 to 3. The app already knows
        # its own selection state and can predict the exact count; the manifest
        # declares the bounded range so a generic queue poller can budget
        # timeouts + progress UI without app-side knowledge of which formats
        # are selected.
        triggers:
          - objectsAvailable: { min: 1, max: 3 }
        evidence: [wirePCSSShootDownload20260523]
      # Standard PTP enumeration. Returns a u32 count + u32 handle list. Client
      # iterates the result and calls getObjectInfo / getThumb / getObject /
      # deleteObject per handle.
      enumerateObjects:
        mode: image-transfer
        steps:
          - { sendOp: "0x1007", params: [0xffffffff, 0] }
        evidence: [wirePCSSShootDownload20260523]
      getObjectInfo:
        mode: image-transfer
        params: [handle]
        steps:
          - { sendOp: "0x1008", params: [{ runtime: handle }] }
        evidence: [wirePCSSShootDownload20260523]
      getThumb:
        mode: image-transfer
        params: [handle]
        steps:
          - { sendOp: "0x100a", params: [{ runtime: handle }] }
        evidence: [wirePCSSShootDownload20260523]
      # Whole-object download — 0x101B chunking is NOT supported on PCSS.
      getObject:
        mode: image-transfer
        params: [handle]
        steps:
          - { sendOp: "0x1009", params: [{ runtime: handle }] }
        evidence: [wirePCSSShootDownload20260523]
      deleteObject:
        mode: image-transfer
        params: [handle]
        steps:
          - { sendOp: "0x100b", params: [{ runtime: handle }] }
        evidence: [wirePCSSShootDownload20260523]
    evidence: [wireTether]

  xlv:
    kind: http-xlv                   # camera HTTP web service — a SECOND protocol family (routes, not opcodes)
    # fw-divergent transport (belongs in a fw-tier overlay once the merge loader lands):
    #   fw≤2.30 → plain HTTP:80 ; fw≥2.40 → HTTPS:443, client must trust the per-camera self-signed cert.
    transport: { scheme: http, port: 80 }   # fw≤2.30 baseline; fw2.40.yaml overlays HTTPS:443
    discovery: { mechanism: http-probe, announces: none, autoDiscoverable: false }   # needs the camera's LAN address
    # Wire-confirmed routes (sweep vs 192.168.4.169); base64-JSON bodies.
    routes:
      "GET /camera/functions/{code}/get": { handler: property.get }   # → property_code_value_list
      "GET /camera/functions/{code}/cap": { handler: property.cap }   # capability descriptor
    responseEncoding: base64-json
    # ACCESS GATE — sensitive. XLV requires a bearer token in the `XLV_Auth` header. Token
    # ACQUISITION/forging is access-gate-bypass material → stays in a PRIVATE overlay (operator
    # tree), NOT this public file. Only the auth *shape* (that a bearer token is required) is public.
    auth: { scheme: bearer, header: XLV_Auth, tokenSource: private-overlay }
    modes: [shooting/stills]         # property read/write surface; shares engine state
    evidence: [docXlv, captureXlv]

modes:
  shooting:
    capabilities: [exposureControl]
  shooting/stills:                   # live-view: app drives the camera, screen taken over
    capabilities: [liveView, remoteControl, screenTakeover]
    detect: { prop: "0xdf01", eq: 0x16 }
  image-transfer:
    capabilities: [browse, download]
    detect: { prop: "0xdf01", eq: 0x14 }
  remote-trigger:                     # screen STAYS ON (vs shooting/stills screenTakeover).
    # Transport-independent: reached over BLE now, and over WirelessTether PTP/IP later
    # (same camera mode, different connection). No `detect`: over BLE the mode is
    # connection-implied (no PTP functionMode read).
    capabilities: [shutterControl, eepromTransfer, gpsPersistence, cameraSettings, screenOn]
  # One on-camera USB mode enabling two workflows. NOTE: settings backup-restore is
  # available in ~every mode, so its ops gate to ALL modes (see operations); only the
  # raw-conversion ops are specific to this mode.
  raw-conv-backup-restore:
    capabilities: [rawDevelop, settingsBackup, settingsRestore]
  webcam:
    capabilities: [webcamStream]     # known to exist; protocol not yet characterized

# Workflows = app tasks (CameraFeatureMode), gated by required connection/transport.
# bluetooth-transport features (remoteShutter/gpsPersistence/cameraSettings) belong
# to the BLE connection slice — added when that connection is modeled.
workflows:
  liveView:      { transport: app, evidence: [iosFeatureMode] }
  imageTransfer: { transport: app, evidence: [iosFeatureMode] }
  remoteShutter:  { transport: ble, evidence: [iosFeatureMode] }   # CameraFeatureMode bluetooth features
  gpsPersistence: { transport: ble, evidence: [iosFeatureMode] }
  cameraSettings: { transport: ble, evidence: [iosFeatureMode] }   # eeprom up/download

operations:
  "0x1002": { name: OpenSession,          owner: standard-ptp, connections: [app, wireless-tether], evidence: [iosStartupSeq, wirePCSSShootDownload20260523] }
  "0x1003": { name: CloseSession,         owner: standard-ptp, connections: [app, wireless-tether], evidence: [iosStartupSeq, wirePCSSShootDownload20260523] }
  # PCSS image-transfer triad (wireless-tether). Hyper-Utility's actual download path,
  # wire-confirmed: 0x1007(0xFFFFFFFF, 0) → 0x1008(handle) → 0x100A(handle, optional)
  # → 0x1009(handle) → 0x100B(handle, optional delete). No 0x101B chunking; whole
  # objects only on this connection. Evidence: wirePCSSShootDownload20260523.
  "0x1007": { name: GetObjectHandles,     owner: standard-ptp, modes: [image-transfer], connections: [wireless-tether], evidence: [wirePCSSShootDownload20260523] }
  "0x1008": { name: GetObjectInfo,        owner: standard-ptp, modes: [image-transfer, raw-conv-backup-restore], connections: [app, usb, wireless-tether], evidence: [docImageTransfer, staticRawStudio, wirePCSSShootDownload20260523] }
  "0x100a": { name: GetThumb,             owner: standard-ptp, modes: [image-transfer], connections: [app, wireless-tether], evidence: [docImageTransfer, wirePCSSShootDownload20260523] }
  "0x100b": { name: DeleteObject,         owner: standard-ptp, modes: [image-transfer], connections: [wireless-tether], evidence: [wirePCSSShootDownload20260523] }
  # 0x100e is advertised by wireless-tether (PCSS/15740) too — see the 05-27 capability
  # snapshot. The actual shutter cycle on that connection (params, completion signal,
  # whether 0x9022 fires) is not yet wire-captured; authorizing the op here unblocks
  # the app-side shutter call. wireless-tether entries: filled in once the wire
  # capture lands (see 2026-06-02 consult).
  "0x100e": { name: InitiateCapture,      owner: standard-ptp, modes: [shooting/stills], connections: [app, wireless-tether], emits: ["0xc001"], evidence: [iosLiveControls, docLiveControls, wireTetherCaps20260527] }   # 0xC001 PostviewComplete (delivered on the app event socket; wireless-tether has no event channel)
  "0x1014": { name: GetDevicePropDesc,    owner: standard-ptp, modes: [shooting], connections: [app], evidence: [iosLiveControls] }
  "0x1015": { name: GetDevicePropValue,   owner: standard-ptp, modes: [shooting, image-transfer], connections: [app, wireless-tether], evidence: [iosStartupSeq, iosLiveControls, docImageTransfer, wireTetherCaps20260527, wirePCSSShootDownload20260523] }
  "0x1016": { name: SetDevicePropValue,   owner: standard-ptp, modes: [shooting, image-transfer], connections: [app, wireless-tether], evidence: [iosStartupSeq, iosLiveControls, docImageTransfer, wireTether] }
  "0x101b": { name: GetPartialObject,     owner: standard-ptp, modes: [image-transfer], connections: [app], evidence: [docImageTransfer] }
  "0x101c": { name: InitiateOpenCapture,  owner: standard-ptp, modes: [shooting], connections: [app], evidence: [iosStartupSeq] }
  "0x1018": { name: TerminateOpenCapture, owner: standard-ptp, modes: [shooting], connections: [app], evidence: [iosStartupSeq] }
  "0x9022": { name: FujiVendor9022,       owner: fuji-vendor,  modes: [shooting/stills], connections: [app], evidence: [iosLiveControls, docLiveControls] }
  # Tap-to-AF (S1 lock). PTP_PROPERTIES_REFERENCE.md §5.1/§5.2: param is a 4-byte
  # LE u32 packing the AF area, built by the reference app as the hex
  # string "WWHHIIJJ". As wire bytes (LE) it unpacks: byte15=W=asp_w (aspect-ratio
  # width numerator), byte14=H=asp_h (aspect-ratio height numerator), byte13=I=col,
  # byte12=J=row — col/row are the 1-indexed AF-grid cell (GFX100 II 4:3: observed
  # up to col=9,row=6). Camera moves the AF area, focuses, then fires 0xC005 and
  # flips 0xD209 (read success/fail from the property, not the event). owner =
  # fuji-vendor, matching the sibling 0x90xx ops in this file.
  "0x9026":
    name: LockS1Lock
    owner: fuji-vendor
    modes: [shooting/stills]
    connections: [app]
    # AF tap (§5.5): settle 0xD209 S1_LOCK_COLOR to locked, then emit the 0xC005
    # AFCAPTUER completion event. settleAfterPolls: 2 models the measured fw02.30
    # latency — 0xC005 fires before 0xD209 settles, so the first post-event read
    # sees the old value and the event-source await re-polls (#185; the former
    # "settle ≤1 event-coupling invariant" assumed a single post-event read and
    # is retired, client application#157). 0xD17C S1LockAreaState mirrors the packed
    # AF-area (§5.5: high bytes aspect, low bytes tap col/row) straight from the
    # 0x9026 request param — fromParam identity copy, immediate (#96).
    emits: ["0xc005"]
    effects:
      - { setProp: "0xd209", value: 1, settleAfterPolls: 2 }
      - { setProp: "0xd17c", fromParam: { index: 0 } }
    evidence: [iosLiveControls, docLiveControls]
  # AF unlock/release companion to 0x9026 (PTP_PROPERTIES_REFERENCE.md §5.1: clears
  # the AF lock, resets 0xD209 S1_LOCK_COLOR to 0). PRELIMINARY: §5.1 marks the
  # opcode→UnlockS1Lock mapping itself "likely", and a label reconcile is pending
  # operators-side — do not treat the name as wire-final. (The issue-35 brief cited a
  # FUJI_PTP_PROP_REFERENCE "LiveStateSnapshotShort" conflict; the current operators
  # doc does NOT carry that label — it agrees on UnlockS1Lock and explicitly says
  # "not a live-state snapshot" — so no name conflict is asserted here; see report.)
  "0x9027":
    name: UnlockS1Lock
    owner: fuji-vendor
    modes: [shooting/stills]
    connections: [app]
    effects:
      - { setProp: "0xd209", value: 0 }
    evidence: [iosLiveControls, docLiveControls]
  "0x902b": { name: FujiVendor902B,       owner: fuji-vendor,  modes: [shooting/stills, shooting/video], connections: [app], evidence: [iosStartupSeq] }
  "0x902c": { name: StepShutterspeed,     owner: fuji-vendor,  modes: [shooting/stills], connections: [app], handler: property.step, property: "0xd240", evidence: [iosLiveControls, docLiveControls] }
  "0x902d": { name: StepFnumber,          owner: fuji-vendor,  modes: [shooting/stills], connections: [app], handler: property.step, property: "0x5007", evidence: [iosLiveControls, docLiveControls] }
  "0x902e": { name: StepExposureBias,     owner: fuji-vendor,  modes: [shooting/stills], connections: [app], handler: property.step, property: "0x5010", evidence: [iosLiveControls, docLiveControls] }
  "0x9054": { name: FujiImageImportCurrentObjectInfo,  owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docImageTransfer] }
  "0x9055": { name: FujiImageImportCurrentObjectThumb, owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docImageTransfer] }
  "0x9050": { name: FujiImageImportBegin,              owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docImageTransfer] }
  "0x9053": { name: FujiImageImportPage,               owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docImageTransfer] }
  "0x9803":
    name: FujiExtensionObjectSize
    owner: fuji-vendor
    modes: [image-transfer]
    connections: [app]
    handler: object.size
    objectSize:
      handleParam: 0
      encoding: u64Le
      requiredParams:
        - { index: 1, equals: 0xdc04 }
    evidence: [docLargeMovObjectInfo]
  # Gallery-filter triplet (image-transfer mode, reference-app `app` path). The 0x9051
  # data-out payload AND-combines per-axis constraints keyed by 0xD6xx codes:
  #   0xD600 GalleryCaptureDateAxis     (read-back only, returned by 0x9053)
  #   0xD601 GalleryDateRange           string, type-tag 0x12, UTF-16LE "YYYYMMDD-YYYYMMDD" (`*` = unset endpoint)
  #   0xD602 GalleryFilenamePattern     string, type-tag 0x07, UTF-16LE with `*` wildcard
  #   0xD603 GalleryRatingBitfield      u16: 0x01=no-rating, 0x02=1★ … 0x20=5★
  #   0xD604 GalleryFileTypeBitfield    u16: 0x01=JPEG, 0x02=HEIF, 0x04=RAF, 0x08=MP4, 0x10=MOV
  #   0xD605 GallerySubjectsBitfield    u32: 0x01=PERSON … 0x40=TRAIN (wire-canonical; Firebase analytics swaps 0x20↔0x40)
  # The axes are protocol-payload codes — they are NOT advertised in DeviceInfo
  # and are not queryable via 0x1015, so they don't appear under `properties:`.
  # Sources: GALLERY_FILTER_PROTOCOL_FW0230_2026-05-25.md + FUJI_PTP_PROP_REFERENCE
  # §Get-mode gallery filter + MODE_CHANGES §gallery enumeration.
  "0x9051": { name: FujiGalleryFilterSet,      owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docFujiPtpPropReference] }
  # Returns u32 count + 6 entries (D600..D605). Sent once when the filter UI opens.
  "0x9052": { name: FujiGalleryFilterAxes,     owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docFujiPtpPropReference] }
  # Fires once at Get-phase end (vendor finalize). Pairs with the import flow.
  "0x9060": { name: FujiImportFinalize,        owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docFujiPtpPropReference, docImageTransfer] }
  # HYPOTHESIS — single-source from FUJI_PTP_PROP_REFERENCE; not yet wire-confirmed
  # to differentiate from 0x101C. Fires after `D246=1`; clears 0xD229/0xD22A/0x500E.
  # Same `(0, 0)` param shape as 0x101C. Pending wire-capture confirmation.
  "0x9020": { name: FujiVideoPreviewOpenHypothesis,   owner: fuji-vendor, modes: [shooting/stills], connections: [app], evidence: [docFujiPtpPropReference] }
  # HYPOTHESIS — handle param = txid of matching 0x9020. Same caveat.
  "0x9021": { name: FujiVideoPreviewCloseHypothesis,  owner: fuji-vendor, modes: [shooting/stills], connections: [app], evidence: [docFujiPtpPropReference] }
  # HYPOTHESIS — reference-app→camera, 875B data-out blob carrying a settings-backup `.DAT`
  # filename. Seen 9× in May 1 sdcard_import flows; may be the wireless equivalent
  # of 0x100C SendObjectInfo for settings-checkpoint files. Source: single doc.
  "0x9040": { name: FujiSendObjectInfoDatHypothesis,  owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docFujiPtpPropReference] }
  # raw-conv ops are mode-specific; backup ops are available in ~every mode (no modes key).
  "0x900c": { name: SendRawFromPcObjectInfo, owner: fuji-vendor, modes: [raw-conv-backup-restore], connections: [usb], evidence: [staticRawStudio] }
  "0x900d": { name: SendRawFromPcObject,     owner: fuji-vendor, modes: [raw-conv-backup-restore], connections: [usb], evidence: [staticRawStudio] }
  "0x100c": { name: SetBackupSettingsInfo,   owner: standard-ptp, connections: [usb], evidence: [staticRawStudio] }   # backup: all modes
  "0x100d": { name: SetBackupSettings,       owner: standard-ptp, connections: [usb], evidence: [staticRawStudio] }
  # 0x1009 is standard PTP GetObject. On USB in raw-conv-backup-restore mode the same

  # wireless-tether in image-transfer it returns the whole image. Same op, mode-
  # dependent payload semantics.
  "0x1009": { name: GetObject,               owner: standard-ptp, modes: [image-transfer, raw-conv-backup-restore], connections: [usb, wireless-tether], evidence: [staticRawStudio, wirePCSSShootDownload20260523] }
  # PCSS live-view = vendor 0x9018 poll (vs the App connection's 0x101c+GetObject).
  "0x9018": { name: PcssPollLiveViewData,    owner: fuji-vendor,  modes: [shooting/stills], connections: [wireless-tether], evidence: [wireTether] }

properties:
  "0xdf00": { name: functionModeMajor, type: u16, access: readWrite, evidence: [iosStartupSeq] }
  "0xdf01": { name: functionMode,      type: u16, access: readWrite, evidence: [iosStartupSeq] }
  "0xdf2a": { name: liveDf2a,          type: u32, access: readWrite, evidence: [iosStartupSeq] }  # read-echo'd on live-view entry; Get→Take writes value 2
  "0xdf28": { name: featureVersion,    type: u32, access: readWrite, evidence: [iosStartupSeq, docImageTransfer] }
  # Live-status snapshot (app connection). A self-describing record stream:
  # u16 count, then 6-byte records <propCode u16 LE><value u32 LE>. Members are
  # the prop codes observed across the v6/v8/v9 catalogs; each value is read at
  # its own property width from the low bytes. (wireless-tether uses D21C/D207
  # keepalives, not this format — see docD212TightFormat.)
  "0xd212":
    name: liveStatus
    type: u8a
    access: readOnly
    payload:
      form: recordStream
      countWidth: 2
      record: { codeWidth: 2, valueWidth: 4 }
      members: ["0x5005", "0x5007", "0x500a", "0x500c", "0x500e", "0x5012",
                "0xd001", "0xd018", "0xd028", "0xd02a", "0xd02b", "0xd17c",
                "0xd209", "0xd21b", "0xd220", "0xd222", "0xd229", "0xd22a",
                "0xd240", "0xd241", "0xd242", "0xd246", "0xd400", "0xd401",
                "0xd52f", "0xdf00"]
    evidence: [docImageTransfer, docD212TightFormat]
  # AF area state, carried as a sub-property in the 0xd212 poll bundle. Per
  # PTP_PROPERTIES_REFERENCE.md §5.1/§3.4 the u32 also encodes aspect ratio: high
  # bytes (3,2) = (aspect_w, aspect_h), low bytes (1,0) = (col, row) of the last AF
  # tap. (asp_w, asp_h) feed the 0x9026 LockS1Lock packed-param high bytes.
  "0xd17c": { name: s1Lock,            type: u32, access: readOnly,  evidence: [iosLiveControls, docLiveControls] }  # sub-property carried in 0xd212
  # AF box color, carried in the 0xd212 poll bundle. PTP_PROPERTIES_REFERENCE.md
  # §5.3 (setForcusColor mapping): 0 = white/none (no AF active), 1 = green/locked
  # (AF succeeded), 2 = red/failed. Flips 0→1/2 ~one poll after the 0xC005 event.
  "0xd209": { name: s1LockColor,       type: u16, access: readOnly,  evidence: [iosLiveControls, docLiveControls] }  # sub-property carried in 0xd212
  "0xd226": { name: imageImportFilter, type: u16, access: readWrite, evidence: [docImageTransfer] }
  "0xd227": { name: imageImportSort,   type: u16, access: readWrite, evidence: [docImageTransfer] }
  "0xd244": { name: imageImportD244,   type: u8a, access: readOnly,  evidence: [docImageTransfer] }
  "0xd620": { name: imageImportObjectCount,   type: u32, access: readOnly,
              requiresGate: { name: imageImportBootstrap, failure: noResponse },
              evidence: [docImageTransfer] }
  "0xd621": { name: imageImportObjectHandles, type: u8a, access: readOnly,
              requiresGate: { name: imageImportBootstrap, failure: noResponse },
              evidence: [docImageTransfer] }
  "0xd235": { name: imageImportChunkSize, type: u32, access: readOnly, initialValue: 0x00bfffe0, evidence: [docLargeMovObjectInfo] }
  "0xd185": { name: rawSettings,       type: u8a, access: readWrite, evidence: [staticRawStudio] }  # 0x275-byte RAW-conv buffer (field map TBD)
  # Current App/AP controls. ISO/direct-list controls use SetDevicePropValue; ring/body controls
  # remain step-only or body-driven. WirelessTether exposes absolute big-three variants on the
  # 15740 PCSS connection, so controls are keyed by connection id.
  "0x5005": { name: whiteBalance, ptpName: WhiteBalance, type: u16, access: readWrite,
              controls: { app: { setMethod: absolute, operation: "0x1016" } }, evidence: [iosLiveControls] }
  "0x5007": { name: aperture, ptpName: FNumber, type: u16, access: readWrite,
              controls: { app: { setMethod: vendorStep, operation: "0x902d", readback: "0xd212" }, wireless-tether: { setMethod: absolute, operation: "0x1016" } }, evidence: [iosLiveControls, docLiveControls, wireTether] }   # uint16 ×100 (f/2.8=280)
  "0x500a": { name: focusMode, ptpName: FocusMode, type: u16, access: readWrite, evidence: [iosLiveControls] }
  "0x500c": { name: flashMode, ptpName: FlashMode, type: u16, access: readWrite,
              controls: { app: { setMethod: absolute, operation: "0x1016" } }, evidence: [iosLiveControls] }
  # Exposure bias is SIGNED: probe GetDevicePropDesc declares i16, descriptor enum
  # runs -5000..5000 milliEV (negative EV writes two's-complement, e.g. -0.3 → 0xFEB3) (#88).
  "0x5010": { name: exposureBias, ptpName: ExposureBiasCompensation, type: i16, access: readWrite,
              controls: { app: { setMethod: vendorStep, operation: "0x902e", readback: "0xd212" } }, evidence: [iosLiveControls, docLiveControls] }
  "0x5012": { name: selfTimer, ptpName: SelfTimer, type: u16, access: readWrite,
              controls: { app: { setMethod: absolute, operation: "0x1016" } }, evidence: [iosLiveControls] }
  "0xd001": { name: filmSimulation, type: u16, access: readWrite,
              controls: { app: { setMethod: absolute, operation: "0x1016" } }, evidence: [iosLiveControls] }
  # 0xD212 live-status member; wire-decoded label DepthOfField, probe type u16 (#50).
  "0xd028": { name: depthOfField, type: u16, access: readWrite, evidence: [docD212TightFormat] }
  # Live-view still ISO is u32, NOT the u16 GetDevicePropDesc returns — fw2.30
  # hands back a degenerate single-value stub descriptor (probe enum = {0x8001}).
  # Real live-control encoding: native manual literal (6400 = 0x1900),
  # 0x80000000|ceiling for AUTO ceiling, or 0x40000000|iso for expanded sensitivity.
  # This path is separate from PCSS still ISO 0x500F and movie-mode ISO 0xD242.
  # Writes apply only after InitiateOpenCapture(0x101C); D212 readback is source of truth.
  # Width override is documented in the #53 property-width-audit OVERRIDES table.
  "0xd02a": { name: stillIso, ptpName: ISO, type: u32, access: readWrite,
              controls: { app: { setMethod: absolute, operation: "0x1016", readback: "0xd212" } },
              # Representative authored rows for the generic value codec. Bulk
              # ISO labels still come from evidence/labels via the generator.
              valueRows: [{ label: "6400", raw: 6400 }, { label: "12800", raw: 12800 },
                          { label: "25600", raw: 1073767424 }, { label: "102400", raw: 1073844224 }],
              valueEncoding: { sentinel: { mask: 2147483648, meaning: autoCeiling, labelPrefix: AUTO },
                               masks: [{ mask: 1073741824, meaning: extendedSensitivity, labelPrefix: EXT }] },
              evidence: [iosLiveControls, docLiveControls, docIsoModel20260707] }
  "0xd02b": { name: movieIso, ptpName: MovieISO, type: u32, access: readWrite,
              controls: { app: { setMethod: absolute, operation: "0x1016" } }, evidence: [iosLiveControls] }
  # Shutter readback is u32, NOT the u16 stub the degenerate descriptor reports.
  # Encoding: 0x80000000|(denom*1000) for fractions (1/60 = 0x8000EA60), or
  # seconds*1000 for slow speeds — confirmed by client application's UINT32 DevicePropDesc
  # parser + the [live] 0xD212 readback. Set via the 0x902c step (not a value
  # write). Width override documented in the #53 property-width-audit OVERRIDES.
  "0xd240": { name: shutterSpeedEx, ptpName: ShutterSpeedEx, type: u32, access: readWrite,
              controls: { app: { setMethod: vendorStep, operation: "0x902c", readback: "0xd212" } }, evidence: [iosLiveControls, docLiveControls] }
  # PCSS ISO is the standard PTP ExposureIndex, NOT the reference-app 0xD02A path. Encoding is
  # SIGNED: positive = literal ISO; `-1` (0xffffffff) = auto; `-2` (0xfffffffe) = auto
  # with one modifier (Hyper-Utility wire trace shows both — semantics TBD). Probe
  # GetDevicePropDesc declares i32; the codec now models the signed datatype (#88).
  "0x500f": { name: iso, ptpName: ExposureIndex, type: i32, access: readWrite,
              controls: { wireless-tether: { setMethod: absolute, operation: "0x1016" } }, evidence: [wireTether, wirePCSSShootDownload20260523] }
  # Movie-mode sensitivity is a separate INT32 property. Do not reuse 0x500F
  # PCSS still metadata or 0xD02B live-view movie metadata for this path.
  "0xd242": { name: movieSensitivity, ptpName: MovieISO, type: i32, access: readWrite,
              evidence: [docIsoModel20260707] }
  "0x500d": { name: shutterSpeed, ptpName: ExposureTime, type: u32, access: readWrite,
              controls: { wireless-tether: { setMethod: absolute, operation: "0x1016" } }, evidence: [wireTether] }   # microseconds
  "0x500e": { name: exposureProgram, ptpName: ExposureProgram, type: u16, access: readWrite, evidence: [iosLiveControls, wireTether] }   # PASM / body dial

  # ------------------------------------------------------------------------------
  # PROTOCOL SCAFFOLDING — these props look like settings (RW, accept arbitrary
  # writes) but their semantics are wire-protocol mechanics, NOT user-facing
  # values. Do NOT surface them in app settings UI; do NOT let a generic
  # set-prop-by-name path reach them. They live in the manifest only so the
  # capture-verb / keepalive sequences can reference their codes by name.
  # Evidence: wirePCSSShootDownload20260523 (wire capture 06-02 follow-up).
  # ------------------------------------------------------------------------------
  "0xd039": { name: pcssVirtualShutter, type: u32, access: readWrite, kind: scaffold,
              evidence: [wirePCSSShootDownload20260523] }   # 3-beat state machine paired with 0x100E on wireless-tether
  "0xd21c": { name: pcssKeepalive21c,   type: u16, access: readWrite, kind: scaffold,
              evidence: [wirePCSSShootDownload20260523] }   # tethered-mode keepalive; write 0 every ~30-200ms
  "0xd207": { name: pcssKeepalive207,   type: u16, access: readWrite, kind: scaffold,
              evidence: [wirePCSSShootDownload20260523] }   # tethered-mode keepalive; write 1, paired with D21C

  # Label-only curations for probe-discovered props that the wire docs identify.
  # Probe enrichment fills `type`/`access`/`descriptor` (see generate.rs::enrich);
  # the name + evidence here win.
  #
  # 0xD037 — ptpsim Q3 OPEN ITEM (see connections.wireless-tether comment above).
  # FUJI_PTP_PROP_REFERENCE labels this as the PCSS-path stills/video toggle
  # (`0x0001`=stills, `0x0101`=video), but the flip-transition is UNTESTED on
  # wire and the values come from a 05-27 wireless-stills vs wireless-video
  # capability-snapshot diff. The video snapshot does not prove PCSS movie
  # recording or MOV transfer behavior. Label as a hypothesis until a real flip
  # is captured. Scaffold-classified so a generic settings-by-name path doesn't
  # reach it.
  "0xd037": { name: pcssStillsVideoToggleHypothesis, kind: scaffold,
              evidence: [docFujiPtpPropReference] }
  # 0xD246 — reference-app Take in-screen toggle (`0`=stills, `1`=video). PCSS equivalent
  # is 0xD037 above. DevicePropDesc enum reports `[0x00, 0x00]` (Fuji bool quirk).
  "0xd246": { name: appInShooterStillsVideo, type: u8, access: readWrite, initialValue: 0,
              descriptor: { form: enum, values: [0, 1] },
              labels: { "0": stills, "1": video },
              evidence: [docFujiPtpPropReference] }
  # 0xD22B — read during Get-mode bootstrap, between 0x9050 and 0x9053
  # (see image-transfer entry sequence). Purpose unknown; treat as part of the
  # bootstrap ritual until a wire trace shows the value used.
  "0xd22b": { name: imageImportBootstrapD22b,
              evidence: [docFujiPtpPropReference, docImageTransfer] }

# PTP-IP event codes arriving on the camera's separate `event` socket (port 55741
# on the `app` connection). On the `wireless-tether` PCSS path the event socket is
# absent (0 events delivered over 184s of active shooting per
# wirePCSSShootDownload20260523) — clients there must poll 0xD212/keepalives instead.
# Names mirror the wire docs; codes are the ones observed in the v6/v8 captures
# (FUJI_PTP_PROP_REFERENCE §PTP event codes + MODE_CHANGES §3 trace).
events:
  # Fires after every 0x100E InitiateCapture (paired with the 0x9022 cleanup); the
  # payload includes the new object's size. Referenced from the curated shutter
  # action's `triggers.postviewEvent` — landing the wire code here grounds the
  # declared trigger so consumers know which event to await.
  "0xc001": { name: PostviewComplete,         destination: app, evidence: [docFujiPtpPropReference, wireReopenTrace] }
  # Fires when the shutter is pressed but the image isn't yet saved.
  "0xc004": { name: CapturePending,           destination: app, evidence: [docFujiPtpPropReference, wireReopenTrace] }
  # Fires when AF (0x9026 LockS1Lock) finishes; params are job counters, not AF
  # coordinates. The app's AF await keys on this then reads 0xD209 (§5.5).
  "0xc005": { name: AFCAPTUER,                destination: app, evidence: [docFujiPtpPropReference] }
  # Standard PTP "image saved" event. Closes the capture cycle on the wire.
  "0x400d": { name: CaptureComplete,          destination: app, evidence: [docFujiPtpPropReference, wireReopenTrace] }
  # HYPOTHESIS — single-source. Appears during the firmware-update flow per the
  # wire-doc cross-ref; not yet wire-confirmed in the shoot/download captures
  # we have. Park until a fw-update capture lands.
  "0x80f8": { name: FirmwareUpdateTrigger,    destination: app, evidence: [docFujiPtpPropReference] }

quirks:
  - id: pcss-knock-once-per-boot
    appliesTo: [wireless-tether]
    behavior: "The PCSS knock (UDP 51562) is accepted only once per camera boot; after one session the camera ICMP-rejects further knocks until power-cycled."
    evidence: wireTether

# Object-format table (#36): the app classifies enumerated objects from data,
# not per-vendor literals. Codes wire-confirmed in IMAGE_TRANSFER_FW230.md.
# The per-vendor RAW preview-extraction descriptor (RAF FUJIFILMCCD-RAW header
# offsets) is deferred — it needs a live RAF-download capture; the blind
# JPEG-scan preview path works meanwhile.
media:
  # >4 GiB objects can report ObjectCompressedSize 0xffffffff while remaining
  # transferable; reference app reads the true size through 0x9803(handle, 0xdc04).
  objectInfoSizeSentinel: 0xffffffff
  # isPhotosCompatible (#136): full stills + movies may go to the OS photo library;
  # non-image PTP objects (associations/scripts) must not. All formats listed here
  # are full assets, so all are photos-compatible.
  formats:
    "0x3801": { name: exifJpeg, vendor: standard, isPhotosCompatible: true }
    # embeddedJpeg: RAF header layout per exiftool FujiFilm::ProcessRAF + dcraw
    # parse_fuji — magic FUJIFILMCCD-RAW @0, JPEG offset u32-BE @0x54, length @0x58.
    # The app reads these to GetPartialObject the embedded JPG; the sim just serves
    # bytes (#101).
    "0xb103": { name: raf,      vendor: fuji,     isRaw: true, isPhotosCompatible: true, embeddedJpeg: { magic: FUJIFILMCCD-RAW, offsetAt: 0x54, lengthAt: 0x58, endian: big } }
    "0xb105": { name: heif,     vendor: fuji,     isPhotosCompatible: true }
    "0x300d": { name: mov,      vendor: standard, isMovie: true, isPhotosCompatible: true }

# Tap-to-focus AF grid (#135): the app maps a live-view tap to a 1-indexed cell
# of this grid and packs it for 0x9026 via the pack_af_area FFI — no grid dims in
# Swift. 9×6 wire-confirmed for GFX100 II stills (0xD17C cells up to col=9,row=6;
# FUJI_PTP_PROP_REFERENCE.md §5).
focusGrid:
  columns: 9
  rows: 6
