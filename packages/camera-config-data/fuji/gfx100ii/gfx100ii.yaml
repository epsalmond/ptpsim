  # Live-status snapshot (app connection). A self-describing record stream with
  # a u16 count and u16 member codes. Numeric members default to u32; D22F is a
  # payload-local PTP string and does not define that code's global datatype.
  # (wireless-tether uses D21C/D207 keepalives, not this format.)
  "0xd212":
    name: liveStatus
    type: u8a
    access: readOnly
    payload:
      form: recordStream
      countWidth: 2
      record: { codeWidth: 2, valueWidth: 4 }
      members: [{ code: "0x5005", encoding: { kind: fixed, width: 4 } }, "0x5007",
                { code: "0x500a", encoding: { kind: fixed, width: 4 } },
                { code: "0x500c", encoding: { kind: fixed, width: 4 } }, "0x500e",
                { code: "0x5010", encoding: { kind: signed, width: 4 } },
                { code: "0x5012", encoding: { kind: fixed, width: 4 } },
                { code: "0xd001", encoding: { kind: fixed, width: 4 } },
                { code: "0xd018", encoding: { kind: fixed, width: 4 } },
                "0xd028", "0xd02a",
                { code: "0xd02b", encoding: { kind: fixed, width: 4 } }, "0xd17c",
                "0xd209",
                { code: "0xd21b", encoding: { kind: fixed, width: 4 } },
                { code: "0xd220", encoding: { kind: fixed, width: 4 } },
                { code: "0xd222", encoding: { kind: fixed, width: 4 } },
                { code: "0xd229", encoding: { kind: fixed, width: 4 } },
                { code: "0xd22a", encoding: { kind: fixed, width: 4 } },
                "0xd240",
                { code: "0xd241", encoding: { kind: fixed, width: 4 } },
                "0xd242", "0xd246",
                { code: "0xd400", encoding: { kind: fixed, width: 4 } },
                { code: "0xd401", encoding: { kind: fixed, width: 4 } },
                { code: "0xd52f", encoding: { kind: fixed, width: 4 } },
                # Direct 0xdf00 values are u16; this status record zero-extends
                # the value into its fixed four-byte member slot.
                { code: "0xdf00", encoding: { kind: fixed, width: 4 } },
                { code: "0xd22f", encoding: { kind: ptpString }, simulatorValue: "" },
                "0xdf41"]
    evidence: [docImageTransfer, docD212TightFormat, wireD212Heterogeneous20260719]
  # AF area state, carried as a sub-property in the 0xd212 poll bundle. Per
  # PTP_PROPERTIES_REFERENCE.md §5.1/§3.4 the u32 also encodes aspect ratio: high
  # bytes (3,2) = (aspect_w, aspect_h), low bytes (1,0) = (col, row) of the last AF
  # tap. (asp_w, asp_h) feed the 0x9026 LockS1Lock packed-param high bytes.
  "0xd17c": { name: s1Lock,            type: u32, access: readOnly,  evidence: [docLiveControls] }  # sub-property carried in 0xd212
  # Keep the global display-color name for other connections. The PCSS profile
  # uses SDK result labels; only operating=1 and failure=3 were wire-captured in
  # the five autofocus attempts.
  "0xd209":
    name: s1LockColor
    type: u16
    access: readOnly
    valueProfiles:
      - connection: wireless-tether
        mode: shooting/stills
        rows:
          - { label: operating, raw: 1 }
          - { label: success, raw: 2 }
          - { label: failure, raw: 3 }
          - { label: noOperation, raw: 4 }
