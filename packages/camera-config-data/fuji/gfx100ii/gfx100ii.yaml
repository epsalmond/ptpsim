  # Live-view still ISO is u32, NOT the u16 GetDevicePropDesc returns — fw2.30
  # hands back a degenerate single-value stub descriptor (probe enum = {0x8001}).
  # Real live-control encoding: native manual literal (6400 = 0x1900),
  # 0x80000000|ceiling for AUTO ceiling, or 0x40000000|iso for expanded sensitivity.
  # This path is separate from PCSS still ISO 0x500F and movie-mode ISO 0xD242.
  # Writes apply only after InitiateOpenCapture(0x101C); D212 readback is source of truth.
  # Width override is documented in the #53 property-width-audit OVERRIDES table.
