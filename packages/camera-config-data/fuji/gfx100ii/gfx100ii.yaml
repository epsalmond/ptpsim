schema: camera-config/v1

# GFX100 II firmware 2.30 manifest. Claims cite retained wire captures,
# public-safe reductions, or protocol documents.
camera:
  manufacturer: FUJIFILM
  model: GFX100 II
  soc: xprocessor5
  firmware: "2.30"
  identities:
    ptpDeviceName: GFX100 II
    # Synthetic simulator serial, served as DeviceInfo.serial_number (#152). A
    # real body reports its unit serial here, equal to the BLE full-serial
    # characteristic — deliberately NOT a real unit's serial.
    serialNumber: PTPSIM-GFX100II-0001

evidence:
  docLiveControls: { kind: doc, path: "evidence/PTP_PROPERTIES_REFERENCE.md" }
  docImageTransfer: { kind: doc, path: "evidence/IMAGE_TRANSFER_FW230.md" }
  docD212TightFormat: { kind: doc, path: "evidence/PTP_PROPERTIES_REFERENCE.md" }
  docFujiPtpPropReference: { kind: doc, path: "evidence/PTP_PROPERTIES_REFERENCE.md" }
  docIsoModel20260707: { kind: doc, path: "evidence/PTP_PROPERTIES_REFERENCE.md" }
  docLargeMovObjectInfo: { kind: doc, path: "evidence/IMAGE_TRANSFER_FW230.md" }
  wireReopenTrace: { kind: wire-capture, path: "evidence/APP_PTPIP_OBSERVATIONS.md", date: "2026-07-31" }
  # Restored from prior manifest work. The linked uncertainty section marks
  # these startup steps pending hardware confirmation.
  restoredStartupPendingHardware: { kind: doc, path: "evidence/APP_PTPIP_OBSERVATIONS.md" }
  wireAutoImageTransfer: { kind: wire-capture, path: "evidence/AUTO_TRANSFER_OBSERVATIONS.md" }
  wireAutoImageTransferQueued: { kind: wire-capture, path: "evidence/AUTO_TRANSFER_OBSERVATIONS.md" }
  wireBleAutoTransfer: { kind: wire-capture, path: "evidence/AUTO_TRANSFER_OBSERVATIONS.md" }
  wireUsbDeviceInfo: { kind: wire-capture, path: "evidence/probe/2026-05-27-ptp-evidence-usb-tether-auto.jsonl", date: "2026-05-27" }
  wireTether: { kind: wire-capture, path: "evidence/PCSS_SHOOT_DOWNLOAD_OBSERVATIONS.md", date: "2026-05-23" }
  wirePCSSShootDownload20260523: { kind: wire-capture, path: "evidence/PCSS_SHOOT_DOWNLOAD_OBSERVATIONS.md", date: "2026-05-23" }
  wireTetherCaps20260527: { kind: wire-capture, path: "evidence/probe/2026-05-27-ptp-evidence-wireless-stills.jsonl", date: "2026-05-27" }
  wirePcssParity20260714: { kind: wire-capture, path: "evidence/PCSS_PARITY_20260714.md", date: "2026-07-14" }
  sdkPcssParity20260714: { kind: vendor-sdk, path: "evidence/PCSS_PARITY_20260714.md", date: "2026-07-14" }
  wirePcssAutofocus20260718: { kind: wire-capture, path: "evidence/PCSS_PARITY_20260714.md", date: "2026-07-18" }
  sdkPcssAutofocus20260718: { kind: vendor-sdk, path: "evidence/PCSS_PARITY_20260714.md", date: "2026-07-18" }
  wireD212Heterogeneous20260719: { kind: wire-capture, path: "evidence/D212_HETEROGENEOUS_RECORDS_20260719.md", date: "2026-07-19" }
  docXlv: { kind: doc, path: "docs/TRANSPORTS.md#xlv" }
  captureXlv: { kind: wire-capture, path: "docs/TRANSPORTS.md#xlv" }

sentinels:
  # PTP/IP length-8 frame with body 0xffffffff. Sent and flushed before the
  # command socket's clean shutdown/FIN during orderly teardown (#82/#244).
  ptpipCloseSentinel: { bytes: "08000000ffffffff", evidence: [docImageTransfer] }

sequenceGates:
  # Real fw02.30 does not answer D620/D621 until the image-import vendor/bootstrap
  # ritual has completed. The app sequence includes D212/D22B before 0x9053 and
  # a final D212 after it; D22B's value remains semantically opaque (#181).
  imageImportBootstrap:
    evidence: [docFujiPtpPropReference, docImageTransfer]

cameraInitiatedTransfer:
  trigger:
    match: all
    states:
      - { gatt: apState, triggerValues: ["0380"], baselineValues: ["0080"] }
      - { gatt: transferState, triggerValues: ["0180"], baselineValues: ["0080"] }
  handoff:
    connection: app
    socketRole: command
    cachedCredentialsAllowed: true
    functionLaunch: { gatt: functionLaunchRequest, value: "0300", required: false }
  # A monitor never redials a cached peripheral after its PTP/IP link drops.
  # It returns to the indexed saved-camera advert route and its scan policy.
  monitorRecovery: savedCameraReconnect
  receive:
    mode: reserved-photo-receive
    # Pre-mode 0xd212 tight records reported 0xdf41=8 in the queued comparison
    # capture and 0xdf41=1 in the successful one-object capture.
    count: { property: "0xd212", member: "0xdf41" }
    headIndex: 1
    metadata: { operation: "0x1008", phases: [afterCountBeforeModeEntry, afterModeEntry] }
    data: { operation: "0x101b", chunkLimitProperty: "0xd235" }
    completion: readToEof
  # One-object drain is wire-confirmed.
  evidence: [wireAutoImageTransfer, wireAutoImageTransferQueued, wireBleAutoTransfer]

# Connection-name convention:
#   `app`             = reference-app PTP/IP on :55740 (BLE -> camera Wi-Fi AP -> 82B WMB-tail init).
#   `wireless-tether` = PCSS/infrastructure-mode PTP/IP on :15740 (camera joins LAN,
#                       then the host reaches it through the PCSS knock/notify path).
# These ride Wi-Fi but are different PTP/IP personas with different supported-op sets,
# different InitCmdReq tails, and different live-view paths (`0x101C`+stream vs
# `0x9018` polled).
connections:
  app:
    kind: ptpip-app                 # WiFi-AP path (camera hosts the AP; app joins)
    establishment: ble-establish-wifi-ap # BLE pairing brings up the camera AP, app joins + routes, then PTP-IP
    activities:
      - id: camera.network.join-confirmation
        version: 1
        displayRole: joiningNetwork
        defaultExpectedDurationMs: 15000
        interactionRequired: true
        hostCheckpoint: { name: networkJoinConfirmation }
      - id: camera.network.associate
        version: 2
        displayRole: joiningNetwork
        defaultExpectedDurationMs: 12000
        interactionRequired: false
        hostEstablishment:
          networkIdentityExact: { expectedScope: ssid }
      - id: camera.session.open.ap
        version: 2
        displayRole: openingSession
        defaultExpectedDurationMs: 10000
        interactionRequired: false
        hostEstablishment:
          retainedSessionOpen: { socketRole: command }
    # Per-connection traits (#81): the app selects behavior from these, not by
    # branching on the connection id.
    initShape: app82                    # the 82-byte reference app InitCommandRequest (#82)
    liveViewDelivery: { kind: stream }   # reference app delivers frames as a continuous stream
    shutterRecipe: appPostview           # 0x100E + 0x9022 postview take-cycle
    # Wire framing per channel (#133) so the app picks the codec from data, not by
    # mapping the connection kind in Swift. Command = the byte-exact fw0230 compressed
    # channel; the event socket carries PIMA type-4 containers (Swift parsePTPEvent).
    commandFraming: compressed
    eventFraming: usb
    # Closing the active PTP/IP transport can remove the :55740 listener. A
    # direct redial is therefore not generic recovery; Take→Get performs the
    # manifest-authored outer BLE/AP re-establishment below (#244). Get→Take
    # stays in-session: fw 2.30 independently refuses the manifest executor's
    # reopen on that edge (device-validated 2026-07-31), a separate refusal
    # from the listener volatility above.
    commandListenerVolatile: true
    discovery: { mechanism: ble, announces: camera }
    modes: [shooting/stills, shooting/video, image-transfer, reserved-photo-receive]
    objectTransfer:
      strategy: chunked
      resumePolicy: byteOffset
      readAction: getObject
      formats: { "0x3801": confirmed, "0xb103": confirmed, "0xb105": confirmed, "0x300d": confirmed }
    # Port roles observed during live-view sessions. Firmware 2.30 does not listen
    # on either auxiliary port until InitiateOpenCapture succeeds
    # (device-validated 2026-07-31).
    bindings:
      host: 192.168.0.1
      command: 55740
      event:
        port: 55741
        availableAfter: { operation: "0x101c" }
      liveView:
        port: 55742
        availableAfter: { operation: "0x101c" }
    # During image-transfer re-establishment the app sends this 8-byte orderly
    # close frame, flushes it, and then closes the command socket with a clean FIN.
    # It does not guarantee that the AP or listener remains immediately reusable.
    transportClose: { sentinel: ptpipCloseSentinel, when: before-image-transfer-reestablishment }
    # 82-byte InitCommandRequest = GUID(16) + uint32(0) + nameField(54).
    # Identity is manufacturer-tier (see fuji.yaml); the fixed field owns its NUL
    # terminator and deterministic zero-fill.
    init:
      identity: { guid: initiatorGuid, friendlyName: initFriendlyName }
      nameFieldByteCount: 54
      evidence: [docLiveControls]
    # Mode-graph edges for GFX100 II fw02.30 with reference app Android 2.7.3.
    entries:
      - to: shooting/stills          # enter live-view from a cold App connection
        steps:
          # The advisory write is tolerant because rejection must not stop mode
          # entry.
          - { setProp: "0xdf00", value: 6, tolerant: true }
          - { setProp: "0xdf01", value: 0x16 }   # functionMode = 22 (live-view)
          - { readEcho: "0xdf2a" }
          - { sendOp: "0x902b", repeat: 4 }
          # fw 2.30 accepts the event/live-view TCP connections only after
          # InitiateOpenCapture succeeds (device-validated 2026-07-31).
          - { sendOp: "0x101c", captures: [{ bind: openCaptureTxId, as: transactionId }] } # InitiateOpenCapture; waits for success and binds its transaction ID
          - { openChannel: event }
          - { openChannel: liveView }
      - to: shooting/stills          # from image-import back to live-view
        from: image-transfer
        # The reference-app trace shows a reopen, but GFX100 II fw 2.30 refuses
        # the manifest executor's reconnect on this edge. The canonical entry
        # switches FunctionMode in-session (device-validated 2026-07-31).
        steps:
          - { setProp: "0xdf00", value: 6, tolerant: true }
          - { setProp: "0xdf01", value: 0x16 }               # functionMode = 22 (live-view)
          - { setProp: "0xdf2a", value: 2 }
          - { sendOp: "0x902b", repeat: 4 }
          # The same fw 2.30 aux-port gate requires successful open capture first.
          - { sendOp: "0x101c", captures: [{ bind: openCaptureTxId, as: transactionId }] } # InitiateOpenCapture; waits for success and binds its transaction ID
          - { openChannel: event }
          - { openChannel: liveView }
      - to: shooting/video          # in-live-view stills→video selector
        from: shooting/stills
        steps:
          - { setProp: "0xd246", value: 1 }                  # 1 = video
      - to: shooting/stills         # in-live-view video→stills selector
        from: shooting/video
        steps:
          - { setProp: "0xd246", value: 0 }                  # 0 = stills
      - to: reserved-photo-receive  # auto-transfer private queue, not card image import
        steps:
          - { setProp: "0xdf01", value: 21 }
          - { getProp: "0xdf29" }
          - { setProp: "0xdf29", value: 3 }
      - to: image-transfer            # cold entry to image-import (no live-view active)
        # Ground truth: FujiCameraAPISession.enterImageImportModeUnlocked + IMAGE_TRANSFER_FW230.
        steps:
          - { getProp: "0xd212", tolerant: true }                 # live-status preamble (best-effort)
          - { setProp: "0xdf01", value: 0x14 }               # functionMode = 20 (image-import)
          - { getProp: "0xdf28", tolerant: true }            # read-before-write (advisory negotiator)
          - { setProp: "0xdf28", value: 3, tolerant: true }   # feature version; uint32 width from the property type
          - { setProp: "0xd226", value: 0, tolerant: true }   # image-import filter
          - { setProp: "0xd227", value: 0, tolerant: true }   # image-import sort
          - { getProp: "0xd244", tolerant: true }             # image-import preamble
          # First-image initialization remains part of connection completion.
          # Public enumeration priming (0x9050/0x9053) belongs to the action below.
          - { sendOp: "0x9054", params: [0x10000001], tolerant: true }
          - { sendOp: "0x9055", params: [0x10000001], tolerant: true }
      - to: image-transfer            # from live-view: exit, re-arm the AP through BLE, then enter cold
        from: shooting/stills
        reestablishConnection:
          params: { launchMode: "3" } # InCameraViewIng; resolved by ble-establish-wifi-ap
          exitSteps:
          # 0x1018 needs the live-view InitiateOpenCapture transaction id — runtime state the
          # executor captured from the successful 0x101c into this named slot.
            - { sendOp: "0x1018", params: [{ runtime: openCaptureTxId }] }
            # Consume CloseSession, close 55741/55742 normally, send+flush the
            # declared close frame on 55740, then cleanly close the command socket.
            - { closeSession: { transportClose: true } }
    actions:
      # reference-app shutter cycle. Wire-confirmed by MODE_CHANGES.md §3 (the 0x100E
      # trace) + §6b (the 0x9022 pairing): every 0x100E InitiateCapture in v6
      # is followed within ~458-746ms by an empty-params 0x9022 cleanup,
      # paired 1:1 with the shutter. Between the two, reference-app polls 0xD212
      # (event state) several times waiting for the camera-side
      # "JPEG-saved" flag to clear; the poll loop is the client's
      # responsibility (no scripting hook in the Step grammar). triggers
      # postviewEvent declares the post-shutter state-change the client
      # polls for / awaits.
      shutter:
        mode: shooting/stills
        initiator:
          steps:
            - { sendOp: "0x100e", params: [0, 0] }
            # Wait for the camera's PostviewComplete event (JPEG saved to card,
            # fires ~400-750ms after 0x100E) before reading the postview — the
            # event IS the readiness signal, the 0x9022 below is the data read.
            # Makes the take cycle manifest-scripted, not client responsibility
            # (#29). Evidence: operators FUJI_PTP_PROP_REFERENCE §6 + MODE_CHANGES §6b.
            - awaitUntil:
                source: { event: { code: "0xc001" } }
                until: { all: [] }          # event arrival alone satisfies (no value to check)
                timeoutMs: 8000
            - { sendOp: "0x9022" }
        triggers:
          - postviewEvent: {}
        evidence: [wireReopenTrace, docLiveControls]
      # Tap-to-AF (#35, §5.5): lock S1 on a packed focus-area, await the AF
      # completion event (0xC005), then read the lock result. The packed area
      # u32 is an app-supplied runtime slot — the app owns cursor→cell packing
      # (StepParam carries no arithmetic), so ptpsim grows no packing vocabulary.
      autofocusLock:
        mode: shooting/stills
        initiator:
          params: [afArea]
          steps:
            - { sendOp: "0x9026", params: [{ runtime: afArea }] }
            - awaitUntil:
                source: { event: { code: "0xc005", thenPoll: "0xd209" } }
                until:
                  any:
                    - { prop: "0xd209", eq: 1 }   # 0xD209 S1LockColor: 1 = locked
                    - { prop: "0xd209", eq: 2 }   # 2 = AF failed, still a terminal focus result
                timeoutMs: 5000
                # 0xC005 acknowledges the AF cycle, it does NOT carry the result:
                # fw02.30 fires it ~100ms after 0x9026 while 0xD209 still reads
                # pre-settle, so the post-event read re-polls at this cadence
                # within timeoutMs (client application#157, #185).
                intervalMs: 100
        evidence: [docLiveControls]
      autofocusRelease:
        mode: shooting/stills
        initiator:
          steps:
            - { sendOp: "0x9027" }
        evidence: [docLiveControls]
      # reference-app enumeration. Wire-confirmed by IMAGE_TRANSFER_FW230.md
      # §"Confirmed enumeration": reference-app **never** calls 0x1007
      # GetObjectHandles — camera rejects with 0x2005 Operation_Not_Supported
      # on fw2.30. Instead it reads count + handle list as PTP properties
      # AFTER the enumeration-prime block below. 0xD620 returns u32 count;
      # 0xD621 returns a count-prefixed u32[] handle list, **descending /
      # newest-first** (v6: 0x83, 0x82, …, 0x01). Pre-reading 0xD620 sizes
      # the buffer for 0xD621.
      enumerateObjects:
        mode: image-transfer
        initiator:
          steps:
            # The camera may still be settling after mode entry. Replay the whole
            # page-selection operation for the observed busy/store responses.
            - retry: &imageImportPrimeRetry
                whenResponseCodes: ["0x2013", "0x2019"]
                whenFailureClasses: ["decode"]
                maxAttempts: 5
                retryDelayMs: 100
                steps:
                  - { sendOp: "0x9050", startsGate: imageImportBootstrap }
                  - { getProp: "0xd212", tolerant: true }
                  - { getProp: "0xd22b", tolerant: true }
                  - { sendOp: "0x9053", params: [0, 0x7530] }
                  - { getProp: "0xd212", tolerant: true, completesGate: imageImportBootstrap }
            # Field evidence shows 0x2002 can be transient here even though the
            # reference client treats it as terminal. Prefer bounded recovery.
            - retry: &imageImportCountRetry
                whenResponseCodes: ["0x2002", "0x2013", "0x2019"]
                whenFailureClasses: ["decode"]
                maxAttempts: 3
                retryDelayMs: 1000
                steps:
                  - { getProp: "0xd620" }
            - retry: &imageImportHandlesRetry
                whenResponseCodes: ["0x2002", "0x2013", "0x2019"]
                whenFailureClasses: ["decode"]
                maxAttempts: 3
                retryDelayMs: 1000
                steps:
                  - getProp: "0xd621"
                    captures: [{ bind: objectHandles, as: ptpU32Array }]
        evidence: [docImageTransfer]
      # Per-handle metadata + thumbnail — same wire shape as PCSS, different
      # surface (reference-app goes through the image-transfer mode-entry first).
      # UI MUST publish the handle list immediately and fetch GetObjectInfo
      # lazily per selected object — per the on-device note 2026-05-22 in
      # IMAGE_TRANSFER_FW230.md, an eager full GetObjectInfo sweep got the
      # command socket closed mid-stream on a real GFX100 II.
      getObjectInfo:
        mode: image-transfer
        initiator:
          params: [handle]
          steps:
            - { sendOp: "0x1008", params: [{ runtime: handle }] }
        evidence: [docImageTransfer]
      getThumb:
        mode: image-transfer
        initiator:
          params: [handle]
          steps:
            - { sendOp: "0x100a", params: [{ runtime: handle }] }
        evidence: [docImageTransfer]
      # Chunked download. The action params are the logical caller inputs:
      # handle plus a 64-bit offset and length. The wire step derives
      # GetPartialObject(handle, offset_low, length, offset_high) from that
      # single offset slot; offset_high is not a separate caller input. For
      # oversized MOV objects, ObjectInfo reports 0xffffffff and the true
      # transfer size comes from 0x9803(handle, 0xdc04).
      getObject:
        mode: image-transfer
        initiator:
          params: [handle, offset, length]
          steps:
            - sendOp: "0x101b"
              params:
                - { runtime: handle }
                - { runtime: offset, mask: 0xffffffff }
                - { runtime: length }
                - { runtime: offset, shift: 32 }
        evidence: [docImageTransfer, docLargeMovObjectInfo]
      # #46: the FULL image-transfer choreography as ONE manifest-owned loop, so
      # the reference executor walks arm → enumerate → for-each handle
      # { getObjectInfo (sizes the object) → chunk-download until exhausted } end
      # to end — identical on sim and device. Closed loop primitives only: the
      # executor owns the chunk offset cursor; the author declares total + window.
      #
      # The eager per-handle sweep here is the executable REFERENCE of the transfer
      # SHAPE. A production dispatcher still publishes the handle list immediately
      # and fetches lazily per selected object (the on-device socket-close note in
      # IMAGE_TRANSFER_FW230.md) — getThumb stays a standalone lazy action above,
      # NOT in this loop. Wire shape: IMAGE_TRANSFER_FW230.md (0x101B, 12 MiB chunks).
      importObjects:
        mode: image-transfer
        initiator:
          steps:
            # --- arm (mirrors the to:image-transfer mode-entry; idempotent, tolerant) ---
            - { getProp: "0xd212", tolerant: true }
            - { setProp: "0xdf01", value: 0x14 }
            - { getProp: "0xdf28", tolerant: true }
            - { setProp: "0xdf28", value: 3, tolerant: true }
            - { setProp: "0xd226", value: 0, tolerant: true }
            - { setProp: "0xd227", value: 0, tolerant: true }
            - { getProp: "0xd244", tolerant: true }
            - { sendOp: "0x9054", params: [0x10000001], tolerant: true }
            - { sendOp: "0x9055", params: [0x10000001], tolerant: true }
            # --- enumerate (shared recovery with enumerateObjects) ---
            - retry: *imageImportPrimeRetry
            - retry: *imageImportCountRetry
            - retry: *imageImportHandlesRetry
            # --- per-handle: learn reported/true size, then chunk-download until exhausted ---
            - loop:
                forEach:
                  in: objectHandles      # captured descending handle list
                  bind: handle
                  body:
                    - sendOp: "0x1008"
                      params: [{ runtime: handle }]
                      captures:
                        - { bind: objectReportedSize, as: objectInfoCompressedSize }
                        - { bind: objectTransferSize, as: objectInfoCompressedSize }
                    - if:
                        slot: objectReportedSize
                        equals: 0xffffffff
                        then:
                          - sendOp: "0x9803"
                            params: [{ runtime: handle }, 0xdc04]
                            captures:
                              - { bind: objectTransferSize, as: u64Le }
                    - getProp: "0xd235"
                      captures:
                        - { bind: chunkSize, as: propValue }
                    - loop:
                        chunk:
                          total: objectTransferSize
                          size: { runtime: chunkSize }
                          offsetBind: offset
                          lengthBind: length
                          body:
                            - sendOp: "0x101b"  # GetPartialObject(handle, offset_low, length, offset_high)
                              params:
                                - { runtime: handle }
                                - { runtime: offset, mask: 0xffffffff }
                                - { runtime: length }
                                - { runtime: offset, shift: 32 }
        triggers: []
        evidence: [docImageTransfer, docLargeMovObjectInfo]

  ble:
    kind: ble
    establishment: ble-pair    # named mechanism; GATT detail below (overlay-able)
    discovery: { mechanism: ble, announces: camera }
    gatt:
      service: "A9D2B304-E8D6-4902-8336-352B772D7597"
      registrationService: "123D8F06-62A1-4935-9322-833C531EE225"
      deviceIdNumber: "F557D96B-8284-4667-8793-B971C1DECA2A"
      pairingKey: "ABA356EB-9633-4E60-B73F-F52516DBD671"
      apState: "A68E3F66-0FCC-4395-8D4C-AA980B5877FA"
      cameraSSIDName: "BF6DC9CF-3606-4EC9-A4C8-D77576E93EA4"
      cameraWiFiPassphrase: "E809256A-915C-4967-92E8-53B7D4CAD213"
      fileTransferXHalfService: "462426E1-D712-4A28-BE62-61A786DAA866"
    # The BLE→WiFi-AP handover: drive apState to bring the AP up, read SSID +
    # passphrase over GATT, app joins the AP → the `app` connection becomes available.
    enables:
      - to: app
        mechanism: ble-establish-wifi-ap
    evidence: [wireBleAutoTransfer]

  # Raw USB remains available to explicit host adapters on desktop and Android.
  # Automatic macOS attachment recognition uses the daemon-owned row below.
  usb:
    kind: usb
    platforms: [macos, android, linux]
    establishment: usb-claim-open
    commandFraming: usb
    session: { ownership: initiatorOwned }
    events: { delivery: reliable }
    discovery:
      mechanism: usb
      announces: attachment
      platforms: [android, linux]
      vid: 0x04cb
    actions:
      readDeviceInfo:
        mode: ""
        initiator:
          steps:
            - { sendOp: "0x1001", params: [] }
        evidence: [wireUsbDeviceInfo]

  # ImageCapture owns the device, framing, session, and transaction IDs. This
  # connection attaches to that session and sends no claim or OpenSession.
  usb-passthrough:
    kind: usb-passthrough
    platforms: [ios, macos]
    session: { ownership: daemonAttached }
    events: { delivery: bestEffort }
    modes: [image-transfer]
    objectTransfer:
      strategy: chunked
      resumePolicy: byteOffset
      readAction: getObject
      completion: { action: completeObjectTransfer, after: localCommit }
      formats: { "0x3801": confirmed, "0xb103": confirmed, "0xb105": confirmed, "0x300d": confirmed }
    discovery:
      mechanism: usb
      announces: attachment
      platforms: [ios, macos]
      vid: 0x04cb
    entries:
      - to: image-transfer
        steps: []
    actions:
      readDeviceInfo:
        mode: ""
        initiator:
          steps:
            - { sendOp: "0x1001", params: [] }
        evidence: [wireUsbDeviceInfo]
      enumerateObjects:
        mode: image-transfer
        initiator:
          steps:
            - sendOp: "0x1007"
              params: [0xffffffff, 0]
              captures: [{ bind: objectHandles, as: ptpU32Array }]
        evidence: [docImageTransfer, wireUsbDeviceInfo]
      getObjectInfo:
        mode: image-transfer
        initiator:
          params: [handle]
          steps:
            - { sendOp: "0x1008", params: [{ runtime: handle }] }
        evidence: [docImageTransfer, wireUsbDeviceInfo]
      getThumb:
        mode: image-transfer
        initiator:
          params: [handle]
          steps:
            - { sendOp: "0x100a", params: [{ runtime: handle }] }
        evidence: [docImageTransfer, wireUsbDeviceInfo]
      getObject:
        mode: image-transfer
        initiator:
          params: [handle, offset, length]
          steps:
            - sendOp: "0x101b"
              params:
                - { runtime: handle }
                - { runtime: offset, mask: 0xffffffff }
                - { runtime: length }
                - { runtime: offset, shift: 32 }
        evidence: [docImageTransfer, docLargeMovObjectInfo, wireUsbDeviceInfo]
      completeObjectTransfer:
        mode: image-transfer
        initiator:
          params: [handle]
          steps:
            - { setProp: "0xd226", value: 0, tolerant: true }
        evidence: [docImageTransfer, wireUsbDeviceInfo]
      importObjects:
        mode: image-transfer
        initiator:
          steps:
            - sendOp: "0x1007"
              params: [0xffffffff, 0]
              captures: [{ bind: objectHandles, as: ptpU32Array }]
            - loop:
                forEach:
                  in: objectHandles
                  bind: handle
                  body:
                    - { setProp: "0xd226", value: 1, tolerant: true }
                    - sendOp: "0x1008"
                      params: [{ runtime: handle }]
                      captures:
                        - { bind: objectReportedSize, as: objectInfoCompressedSize }
                        - { bind: objectTransferSize, as: objectInfoCompressedSize }
                    - if:
                        slot: objectReportedSize
                        equals: 0xffffffff
                        then:
                          - sendOp: "0x9803"
                            params: [{ runtime: handle }, 0xdc04]
                            captures:
                              - { bind: objectTransferSize, as: u64Le }
                    - getProp: "0xd235"
                      captures:
                        - bind: chunkSize
                          as: propValue
                          fallback:
                            value: 0x00200000
                            whenResponseCodes: ["0x200a"]
                    - loop:
                        chunk:
                          total: objectTransferSize
                          size: { runtime: chunkSize }
                          offsetBind: offset
                          lengthBind: length
                          body:
                            - sendOp: "0x101b"
                              params:
                                - { runtime: handle }
                                - { runtime: offset, mask: 0xffffffff }
                                - { runtime: length }
                                - { runtime: offset, shift: 32 }
                    - { setProp: "0xd226", value: 0, tolerant: true }
        triggers: []
        evidence: [docImageTransfer, docLargeMovObjectInfo, wireUsbDeviceInfo]

  wireless-tether:
    kind: ptpip-direct               # standard PTP-IP on 15740 (NOT the 55740 reference-app family)
    establishment: pcss-knock     # camera joins LAN (Wi-Fi/Ethernet), then PCSS port-knock
    activities:
      - id: camera.session.open.direct
        version: 2
        displayRole: openingSession
        defaultExpectedDurationMs: 5000
        interactionRequired: false
        hostEstablishment:
          retainedSessionOpen: { socketRole: command }
    # Per-connection traits (#81): a different init family, poll-based live view,
    # and the 3-beat virtual shutter — all data-driven, not app id-branches.
    initShape: pcssKnock                                  # PCSS init (not the 82-byte reference app)
    init:
      identity: { guid: initiatorGuid, friendlyName: initFriendlyName }
    liveViewDelivery: { kind: poll, pollOp: "0x9018" }    # app polls 0x9018 for frames
    shutterRecipe: wirelessTether3Beat                    # 3-beat 0xD039 + 0x100E virtual shutter
    # `bindings.command` is the simulator/default bind. A real initiator always uses
    # the callback's runtime-advertised DSCPORT. There is no event/live-view socket —
    # delivery is the 0x9018 poll (capture: events ct=4 = 0).
    bindings: { command: 15740 }
    # The command/data channel is Fuji-compressed (data-phase types 9/10/12), same as the
    # app path; only the InitCommandRequest is standard-framed (#133, PR feedback 2026-07-01).
    commandFraming: compressed
    # Wire-confirmed PCSS handshake: host LISTENs TCP 51560 → UDP discovery on :51562
    # → camera NOTIFYs back to :51560 with DSC + DSCPORT → host ACKs → PTP-IP
    # on the advertised endpoint. Normal discovery uses the selected interface's
    # IPv4 subnet-directed broadcast; explicit unicast sends the byte-identical
    # payload to a known camera address. Init = GUID + hostIP + name + zeros-tail.
    knock:
      callbackPort: 51560
      knockPort: 51562
      protocol: "PCSS/1.0"
      cameraName: "GFX100 II"
      discoveryTargets:
        default: subnetBroadcast
        supported: [subnetBroadcast, explicitUnicast]
        retryDiscoveredUnicast: true
      retryIntervalMs: 1000
      maxAttempts: 15
      connectTimeoutMs: 5000
    # InitCmdReq retry tolerance: PCSS may emit 0-3 InitFail packets before
    # InitCmdAck. Hyper-Utility waits ~250ms between retries; the engine should
    # accept up to 3 retries before treating the handshake as failed
    # (wirePCSSShootDownload20260523).
    initRetries: { max: 3, backoffMs: 500, whenReasons: ["0x2019"] }
    discovery: { mechanism: pcss-knock, announces: callback, autoDiscoverable: true }
    # remote-trigger here is the SAME mode node as over BLE — transport-independent (its
    # PTP/IP form can also push images to the camera; per-connection capability TODO).
    modes: [shooting/stills, image-transfer, remote-trigger]
    objectTransfer:
      strategy: wholeObject
      resumePolicy: restartFromZero
      readAction: getObject
      completion: { action: deleteObject, after: localCommit }
      formats: { "0x3801": experimental, "0xb103": experimental, "0xb105": confirmed, "0x300d": experimental }
    controlSurfaces:
      shooting/stills:
        iso:          { property: "0x500f", readSource: directProperty, evidenceBasis: writeProbe,     observedEffect: confirmed, effectiveOwner: client }
        shutterSpeed: { property: "0x500d", readSource: directProperty, evidenceBasis: writeProbe,     observedEffect: confirmed, effectiveOwner: client }
        aperture:     { property: "0x5007", readSource: directProperty, evidenceBasis: writeProbe,     observedEffect: confirmed, effectiveOwner: client }
        exposureBias: { property: "0x5010", readSource: directProperty, evidenceBasis: descriptorOnly, observedEffect: unknown,   effectiveOwner: client }
        focusArea:    { property: "0xd395", readSource: directProperty, evidenceBasis: writeProbe,     observedEffect: confirmed, effectiveOwner: client }
    # Wire-confirmed NOT-supported on this connection (per the 05-27 capability snapshot
    # `wireTetherCaps20260527` + wire-capture 2026-06-02 replies). Don't author entries that
    # rely on these — the camera will reject them:
    #   - 0x9022 (post-shutter cleanup):  reference-app-only; do NOT pair with 0x100E here.
    #   - 0x101b (GetPartialObject):      not advertised — whole-object only via 0x1009.
    #   - 0xDF01 (FunctionMode):          PCSS enters transfer-mode implicitly; no flip.
    #   - 0x9050/0x9053/0x9054/0x9055:    reference-app mode-20 vendor block; not used on PCSS.
    #   - Event socket (command socket only): 0 events delivered across 184s/34k
    #     frames of active shooting — confirms PCSS is event-less mid-shoot.
    # Wire-confirmed SUPPORTED (wirePCSSShootDownload20260523) — recipes in `actions:`
    # below per docs/plans/action-verbs.md. Still open: 0xD037 stills↔video flip
    # transition capture (Q3) — the 05-27 video evidence is a capability snapshot
    # only, not proof of PCSS movie recording or MOV transfer. Keep PCSS MOV /
    # >4 GiB MOV transfer unmodeled until a real PCSS MOV transfer capture lands;
    # the simulator's PCSS object queue therefore excludes movie-formatted objects.
    actions:
      # Session-scoped identity read (#173): the actual body's unit serial (the
      # saved-camera merge key) + supported ops, via parse_device_info on the
      # data phase. Empty mode = not mode-gated. The 05-27 probe snapshots are
      # per-(connection,mode) GetDeviceInfo captures on this connection. NOT
      # authored on `app`: the reference app never sends 0x1001 on the reference app
      # channel (v6 wire-level run has zero 0x1001 frames) — deferred pending
      # a capture.
      readDeviceInfo:
        mode: ""
        initiator:
          steps:
            - { sendOp: "0x1001", params: [] }
        evidence: [wireTetherCaps20260527]
      # The full-session PCSS capture contains 13 TerminateOpenCapture requests
      # versus 11 InitiateOpenCapture requests. Every terminate carries literal
      # 1, while every initiate carries (0, 0).
      startLiveView:
        mode: shooting/stills
        initiator:
          steps:
            # Field-observed fw 2.30 (2026-07-18): delivery cleanup keeps the
            # defensive terminate busy past 1s (session 3161725A exhausted
            # 5x200ms); exhaustion remains tolerated.
            - tolerant: true
              retry:
                whenResponseCodes: ["0x2019"]
                maxAttempts: 10
                retryDelayMs: 300
                steps:
                  - { sendOp: "0x1018", params: [1] }
            - { setProp: "0xd1bc", value: 2 }
            - { sendOp: "0x101c", params: [0, 0] }
        evidence: [wirePCSSShootDownload20260523]
      # Exactly one polled PCSS live-view payload. Callers own repetition and
      # may follow this with another action on the same open session. General
      # Error is transient while the camera arms the stream; no other response
      # selects replay for this opcode.
      pollLiveView:
        mode: shooting/stills
        initiator:
          steps:
            - retry:
                whenResponseCodes: ["0x2002"]
                maxAttempts: 10
                retryDelayMs: 100
                steps:
                  - { sendOp: "0x9018", params: [] }
        evidence: [wireTether, wirePCSSShootDownload20260523]
      # Every PCSS TerminateOpenCapture request in the full-session capture
      # carries literal 1 even though the request transaction ids vary.
      stopLiveView:
        mode: shooting/stills
        initiator:
          steps:
            - { sendOp: "0x1018", params: [1] }
        evidence: [wirePCSSShootDownload20260523]
      # One caller-scheduled PCSS session keepalive iteration. D21C=0 is the
      # high-cadence write; cadence remains caller-owned because the capture
      # shows variable bursts/periodic intervals. D207 is the SDK priority-mode
      # selector, written separately and rarely. The tolerated 0xA002 cleanup
      # response belongs to D230, not D207.
      keepalive:
        mode: ""
        initiator:
          steps:
            - { setProp: "0xd21c", value: 0 }
        evidence: [wirePCSSShootDownload20260523]
      # 3-beat virtual-shutter sequence. Each beat is `setProp 0xD039 = <phase>` +
      # `0x100E InitiateCapture(0,0)`. Phase byte layout is `[lo0, lo1, hi0, hi1]`
      # — beats 1/2 set the high word (request: phase 1/2); beat 3 sets the low
      # word (acknowledge: commit). Total wall ~108ms (beat 1 includes the
      # exposure). `objectsAvailable` declares the bounded transfer queue growth
      # the client should poll after invoking the action.
      # Field-observed GFX100 II fw 2.30 (2026-07-18): subsequent beats answer
      # 0x2019 while the capture is in flight, so replay only each 0x100E.
      shutter:
        mode: shooting/stills
        initiator:
          steps:
            - { setProp: "0xd039", value: 0x00010000 }
            - retry:
                whenResponseCodes: ["0x2019"]
                maxAttempts: 10
                retryDelayMs: 100
                steps:
                  - { sendOp: "0x100e", params: [0, 0] }
            - { setProp: "0xd039", value: 0x00020000 }
            - retry:
                whenResponseCodes: ["0x2019"]
                maxAttempts: 10
                retryDelayMs: 100
                steps:
                  - { sendOp: "0x100e", params: [0, 0] }
            - { setProp: "0xd039", value: 0x00000001 }
            - retry:
                whenResponseCodes: ["0x2019"]
                maxAttempts: 10
                retryDelayMs: 100
                steps:
                  - { sendOp: "0x100e", params: [0, 0] }
          # User's format selection (JPEG / HEIF / RAW) determines how many
          # objects become available per press — 1 to 3. The app already knows
          # its own selection state and can predict the exact count; the manifest
          # declares the bounded range so a generic queue poller can budget
          # timeouts + progress UI without app-side knowledge of which formats
          # are selected.
        responder:
          params:
            - { name: objectCount, kind: u32, default: 1, min: 1, max: 3 }
          mutation: { kind: enqueueObjects, countParam: objectCount }
        triggers:
          - objectsAvailable: { min: 1, max: 3 }
        evidence: [wirePCSSShootDownload20260523]
      # PCSS focus placement is an optional exact PTP string write. The lock
      # result is captured from the satisfying poll so consumers do not read
      # D209 again. Only success/failure are terminal; D209=4 is not.
      autofocusLock:
        mode: shooting/stills
        initiator:
          params:
            - { name: focusArea, kind: string, required: false }
          steps:
            - setProp: "0xd395"
              value: { runtime: focusArea, ifMissing: skip }
            - { setProp: "0xd230", value: 1 }
            - { setProp: "0xd208", value: 0xa000 }
            - { sendOp: "0x100e", params: [0, 0] }
            - awaitUntil:
                source: { poll: "0xd209" }
                until:
                  any:
                    - { prop: "0xd209", eq: 2 }
                    - { prop: "0xd209", eq: 3 }
                intervalMs: 25
                timeoutMs: 3000
              captures:
                - { bind: autofocusResult, as: propValue }
        responder:
          params:
            - { name: result, kind: u32, default: 3, min: 2, max: 3 }
          mutation:
            kind: propertyTransition
            target: "0xd209"
            initial: 1
            terminal: { kind: parameter, parameter: result }
            settleAfterPolls: 2
        evidence: [wirePcssAutofocus20260718, sdkPcssAutofocus20260718]
      # Always invoke this cleanup in a finally-style path after either lock
      # outcome. D21C remains opaque cleanup/keepalive, not an AF-release label.
      autofocusRelease:
        mode: shooting/stills
        initiator:
          steps:
            - { setProp: "0xd230", value: 1, tolerant: true }
            - { setProp: "0xd21c", value: 0 }
            - { setProp: "0xd208", value: 0x0006 }
            - { sendOp: "0x100e", params: [0, 0] }
        responder:
          params: []
          mutation:
            kind: propertyTransition
            target: "0xd209"
            terminal: { kind: fixed, value: 4 }
            settleAfterPolls: 0
        evidence: [wirePcssAutofocus20260718, sdkPcssAutofocus20260718]
      # Standard PTP enumeration. Returns a u32 count + u32 handle list. Client
      # iterates the result and calls getObjectInfo / getThumb / getObject /
      # deleteObject per handle. Mode-neutral because the live PCSS acceptance
      # sequence enumerates while shooting/stills live view remains open.
      enumerateObjects:
        mode: ""
        initiator:
          steps:
            - sendOp: "0x1007"
              params: [0xffffffff, 0]
              captures:
                - { bind: objectHandles, as: ptpU32Array }
        evidence: [wirePCSSShootDownload20260523]
      getObjectInfo:
        mode: ""
        initiator:
          params: [handle]
          steps:
            - { sendOp: "0x1008", params: [{ runtime: handle }] }
        evidence: [wirePCSSShootDownload20260523]
      getThumb:
        mode: ""
        initiator:
          params: [handle]
          steps:
            - { sendOp: "0x100a", params: [{ runtime: handle }] }
        evidence: [wirePCSSShootDownload20260523]
      # Whole-object download — 0x101B chunking is NOT supported on PCSS.
      getObject:
        mode: ""
        initiator:
          params: [handle]
          steps:
            - { sendOp: "0x1009", params: [{ runtime: handle }] }
        evidence: [wirePCSSShootDownload20260523]
      deleteObject:
        mode: ""
        initiator:
          params: [handle]
          steps:
            - { sendOp: "0x100b", params: [{ runtime: handle }] }
        evidence: [wirePCSSShootDownload20260523]
    evidence: [wireTether]

  xlv:
    kind: http-xlv                   # camera HTTP web service — a SECOND protocol family (routes, not opcodes)
    # fw-divergent transport (belongs in a fw-tier overlay once the merge loader lands):
    #   fw≤2.30 → plain HTTP:80 ; fw≥2.40 → HTTPS:443, client must trust the per-camera self-signed cert.
    transport: { scheme: http, port: 80 }   # fw≤2.30 baseline; fw2.40.yaml overlays HTTPS:443
    discovery: { mechanism: http-probe, announces: none, autoDiscoverable: false }   # needs the camera's LAN address
    # Wire-confirmed routes (sweep vs 192.168.4.169); base64-JSON bodies.
    routes:
      "GET /camera/functions/{code}/get": { handler: property.get }   # → property_code_value_list
      "GET /camera/functions/{code}/cap": { handler: property.cap }   # capability descriptor
    responseEncoding: base64-json
    # ACCESS GATE — sensitive. XLV requires a bearer token in the `XLV_Auth` header. Token
    # ACQUISITION/forging is access-gate-bypass material → stays in a PRIVATE overlay (operator
    # tree), NOT this public file. Only the auth *shape* (that a bearer token is required) is public.
    auth: { scheme: bearer, header: XLV_Auth, tokenSource: private-overlay }
    modes: [shooting/stills]         # property read/write surface; shares engine state
    evidence: [docXlv, captureXlv]

modes:
  shooting:
    capabilities: [exposureControl]
  shooting/stills:                   # live-view: app drives the camera, screen taken over
    capabilities: [liveView, remoteControl, screenTakeover]
    detect: { prop: "0xdf01", eq: 0x16 }
    phase: liveView
  image-transfer:
    capabilities: [browse, download]
    detect: { prop: "0xdf01", eq: 0x14 }
    phase: imageImport
  reserved-photo-receive:
    capabilities: [download]
    detect: { prop: "0xdf01", eq: 21 }
  remote-trigger:
    capabilities: [shutterControl]

operations:
  "0x1002": { name: OpenSession,          owner: standard-ptp, connections: [app, wireless-tether], evidence: [wirePCSSShootDownload20260523] }
  "0x1003": { name: CloseSession,         owner: standard-ptp, connections: [app, wireless-tether], evidence: [wirePCSSShootDownload20260523] }
  # PCSS image-transfer triad (wireless-tether). Hyper-Utility's actual download path,
  # wire-confirmed: 0x1007(0xFFFFFFFF, 0) → 0x1008(handle) → 0x100A(handle, optional)
  # → 0x1009(handle) → 0x100B(handle, optional delete). No 0x101B chunking; whole
  # objects only on this connection. Evidence: wirePCSSShootDownload20260523.
  "0x1007": { name: GetObjectHandles,     owner: standard-ptp, modes: [shooting/stills, image-transfer], connections: [wireless-tether], evidence: [wirePCSSShootDownload20260523] }
  "0x1008": { name: GetObjectInfo,        owner: standard-ptp, modes: [image-transfer, reserved-photo-receive], connections: [app, wireless-tether], evidence: [docImageTransfer, wireAutoImageTransfer, wirePCSSShootDownload20260523] }
  "0x100a": { name: GetThumb,             owner: standard-ptp, modes: [image-transfer], connections: [app, wireless-tether], evidence: [docImageTransfer, wirePCSSShootDownload20260523] }
  "0x100b": { name: DeleteObject,         owner: standard-ptp, modes: [image-transfer], connections: [wireless-tether], evidence: [wirePCSSShootDownload20260523] }
  # 0x100e is advertised by wireless-tether (PCSS/15740) too — see the 05-27 capability
  # snapshot. The actual shutter cycle on that connection (params, completion signal,
  # whether 0x9022 fires) is not yet wire-captured; authorizing the op here unblocks
  # the app-side shutter call. wireless-tether entries: filled in once the wire
  # capture lands (see 2026-06-02 consult).
  "0x100e": { name: InitiateCapture,      owner: standard-ptp, modes: [shooting/stills], connections: [app, wireless-tether], emits: ["0xc001"], evidence: [docLiveControls, wireTetherCaps20260527] }   # 0xC001 PostviewComplete (delivered on the app event socket; wireless-tether has no event channel)
  "0x1014": { name: GetDevicePropDesc,    owner: standard-ptp, modes: [shooting], connections: [app, wireless-tether], evidence: [wireTetherCaps20260527] }
  "0x1015": { name: GetDevicePropValue,   owner: standard-ptp, modes: [shooting, image-transfer, reserved-photo-receive], connections: [app, wireless-tether], evidence: [docImageTransfer, wireAutoImageTransfer, wireTetherCaps20260527, wirePCSSShootDownload20260523] }
  "0x1016": { name: SetDevicePropValue,   owner: standard-ptp, modes: [shooting, image-transfer, reserved-photo-receive], connections: [app, wireless-tether], evidence: [docImageTransfer, wireAutoImageTransfer, wireTether] }
  "0x101b": { name: GetPartialObject,     owner: standard-ptp, modes: [image-transfer, reserved-photo-receive], connections: [app], evidence: [docImageTransfer, wireAutoImageTransfer] }
  "0x101c": { name: InitiateOpenCapture,  owner: standard-ptp, modes: [shooting], connections: [app, wireless-tether], evidence: [wirePCSSShootDownload20260523] }
  "0x1018": { name: TerminateOpenCapture, owner: standard-ptp, modes: [shooting], connections: [app, wireless-tether], evidence: [wirePCSSShootDownload20260523] }
  "0x9022": { name: FujiVendor9022,       owner: fuji-vendor,  modes: [shooting/stills], connections: [app], evidence: [docLiveControls] }
  # Tap-to-AF (S1 lock). PTP_PROPERTIES_REFERENCE.md §5.1/§5.2: param is a 4-byte
  # LE u32 packing the AF area, built by the reference app as the hex
  # string "WWHHIIJJ". As wire bytes (LE) it unpacks: byte15=W=asp_w (aspect-ratio
  # width numerator), byte14=H=asp_h (aspect-ratio height numerator), byte13=I=col,
  # byte12=J=row — col/row are the 1-indexed AF-grid cell (GFX100 II 4:3: observed
  # up to col=9,row=6). Camera moves the AF area, focuses, then fires 0xC005 and
  # flips 0xD209 (read success/fail from the property, not the event). owner =
  # fuji-vendor, matching the sibling 0x90xx ops in this file.
  "0x9026":
    name: LockS1Lock
    owner: fuji-vendor
    modes: [shooting/stills]
    connections: [app]
    # AF tap (§5.5): settle 0xD209 S1_LOCK_COLOR to locked, then emit the 0xC005
    # AFCAPTUER completion event. settleAfterPolls: 2 models the measured fw02.30
    # latency — 0xC005 fires before 0xD209 settles, so the first post-event read
    # sees the old value and the event-source await re-polls (#185; the former
    # "settle ≤1 event-coupling invariant" assumed a single post-event read and
    # is retired, client application#157). 0xD17C S1LockAreaState mirrors the packed
    # AF-area (§5.5: high bytes aspect, low bytes tap col/row) straight from the
    # 0x9026 request param — fromParam identity copy, immediate (#96).
    emits: ["0xc005"]
    effects:
      - { setProp: "0xd209", value: 1, settleAfterPolls: 2 }
      - { setProp: "0xd17c", fromParam: { index: 0 } }
    evidence: [docLiveControls]
  # AF unlock/release companion to 0x9026 (PTP_PROPERTIES_REFERENCE.md §5.1: clears
  # the AF lock, resets 0xD209 S1_LOCK_COLOR to 0). PRELIMINARY: §5.1 marks the
  # opcode→UnlockS1Lock mapping itself "likely", and a label reconcile is pending
  # operators-side — do not treat the name as wire-final. (The issue-35 brief cited a
  # FUJI_PTP_PROP_REFERENCE "LiveStateSnapshotShort" conflict; the current operators
  # doc does NOT carry that label — it agrees on UnlockS1Lock and explicitly says
  # "not a live-state snapshot" — so no name conflict is asserted here; see report.)
  "0x9027":
    name: UnlockS1Lock
    owner: fuji-vendor
    modes: [shooting/stills]
    connections: [app]
    effects:
      - { setProp: "0xd209", value: 0 }
    evidence: [docLiveControls]
  "0x902b": { name: FujiVendor902B,       owner: fuji-vendor,  modes: [shooting/stills, shooting/video], connections: [app], evidence: [restoredStartupPendingHardware] }
  "0x902c": { name: StepShutterspeed,     owner: fuji-vendor,  modes: [shooting/stills], connections: [app], handler: property.step, property: "0xd240", evidence: [docLiveControls] }
  "0x902d": { name: StepFnumber,          owner: fuji-vendor,  modes: [shooting/stills], connections: [app], handler: property.step, property: "0x5007", evidence: [docLiveControls] }
  "0x902e": { name: StepExposureBias,     owner: fuji-vendor,  modes: [shooting/stills], connections: [app], handler: property.step, property: "0x5010", evidence: [docLiveControls] }
  "0x9054": { name: FujiImageImportCurrentObjectInfo,  owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docImageTransfer] }
  "0x9055": { name: FujiImageImportCurrentObjectThumb, owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docImageTransfer] }
  "0x9050": { name: FujiImageImportBegin,              owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docImageTransfer] }
  "0x9053": { name: FujiImageImportPage,               owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docImageTransfer] }
  "0x9803":
    name: FujiExtensionObjectSize
    owner: fuji-vendor
    modes: [image-transfer]
    connections: [app]
    handler: object.size
    objectSize:
      handleParam: 0
      encoding: u64Le
      requiredParams:
        - { index: 1, equals: 0xdc04 }
    evidence: [docLargeMovObjectInfo]
  # Gallery-filter triplet (image-transfer mode, reference-app `app` path). The 0x9051
  # data-out payload AND-combines per-axis constraints keyed by 0xD6xx codes:
  #   0xD600 GalleryCaptureDateAxis     (read-back only, returned by 0x9053)
  #   0xD601 GalleryDateRange           string, type-tag 0x12, UTF-16LE "YYYYMMDD-YYYYMMDD" (`*` = unset endpoint)
  #   0xD602 GalleryFilenamePattern     string, type-tag 0x07, UTF-16LE with `*` wildcard
  #   0xD603 GalleryRatingBitfield      u16: 0x01=no-rating, 0x02=1★ … 0x20=5★
  #   0xD604 GalleryFileTypeBitfield    u16: 0x01=JPEG, 0x02=HEIF, 0x04=RAF, 0x08=MP4, 0x10=MOV
  #   0xD605 GallerySubjectsBitfield    u32: 0x01=PERSON … 0x40=TRAIN (wire-canonical; Firebase analytics swaps 0x20↔0x40)
  # The axes are protocol-payload codes — they are NOT advertised in DeviceInfo
  # and are not queryable via 0x1015, so they don't appear under `properties:`.
  # Sources: GALLERY_FILTER_PROTOCOL_FW0230_2026-05-25.md + FUJI_PTP_PROP_REFERENCE
  # §Get-mode gallery filter + MODE_CHANGES §gallery enumeration.
  "0x9051": { name: FujiGalleryFilterSet,      owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docFujiPtpPropReference] }
  # Returns u32 count + 6 entries (D600..D605). Sent once when the filter UI opens.
  "0x9052": { name: FujiGalleryFilterAxes,     owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docFujiPtpPropReference] }
  # Fires once at Get-phase end (vendor finalize). Pairs with the import flow.
  "0x9060": { name: FujiImportFinalize,        owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docFujiPtpPropReference, docImageTransfer] }
  # HYPOTHESIS — single-source from FUJI_PTP_PROP_REFERENCE; not yet wire-confirmed
  # to differentiate from 0x101C. Fires after `D246=1`; clears 0xD229/0xD22A/0x500E.
  # Same `(0, 0)` param shape as 0x101C. Pending wire-capture confirmation.
  "0x9020": { name: FujiVideoPreviewOpenHypothesis,   owner: fuji-vendor, modes: [shooting/stills], connections: [app], evidence: [docFujiPtpPropReference] }
  # HYPOTHESIS — handle param = txid of matching 0x9020. Same caveat.
  "0x9021": { name: FujiVideoPreviewCloseHypothesis,  owner: fuji-vendor, modes: [shooting/stills], connections: [app], evidence: [docFujiPtpPropReference] }
  # HYPOTHESIS — reference-app→camera, 875B data-out blob carrying a settings-backup `.DAT`
  # filename. Seen 9× in May 1 sdcard_import flows; may be the wireless equivalent
  # of 0x100C SendObjectInfo for settings-checkpoint files. Source: single doc.
  "0x9040": { name: FujiSendObjectInfoDatHypothesis,  owner: fuji-vendor, modes: [image-transfer], connections: [app], evidence: [docFujiPtpPropReference] }
  "0x1009": { name: GetObject,               owner: standard-ptp, modes: [image-transfer], connections: [wireless-tether], evidence: [wirePCSSShootDownload20260523] }
