  - { code: "0x1003", name: CloseSession, classification: alreadyModeled, basis: advertised-and-captured }
  - { code: "0x1004", name: GetStorageIDs, classification: modelOrFirmwareDependent, basis: advertised-only }
  - { code: "0x1005", name: GetStorageInfo, classification: modelOrFirmwareDependent, basis: advertised-only }
  - { code: "0x1006", name: GetNumObjects, classification: modelOrFirmwareDependent, basis: advertised-only }
  - { code: "0x1007", name: GetObjectHandles, classification: alreadyModeled, basis: advertised-and-captured }
  - { code: "0x1008", name: GetObjectInfo, classification: alreadyModeled, basis: advertised-and-captured }
  - { code: "0x1009", name: GetObject, classification: alreadyModeled, basis: advertised-and-captured }
  - { code: "0x100a", name: GetThumb, classification: alreadyModeled, basis: advertised-and-captured }
  - { code: "0x100b", name: DeleteObject, classification: alreadyModeled, basis: advertised-and-captured }
  - { code: "0x100c", name: SendObjectInfo, classification: modelOrFirmwareDependent, basis: advertised-only }
  - { code: "0x100d", name: SendObject, classification: modelOrFirmwareDependent, basis: advertised-only }
  - { code: "0x100e", name: InitiateCapture, classification: alreadyModeled, basis: advertised-and-captured }
  - { code: "0x1014", name: GetDevicePropDesc, classification: alreadyModeled, basis: advertised-and-captured }
  - { code: "0x1015", name: GetDevicePropValue, classification: alreadyModeled, basis: advertised-and-captured }
  - { code: "0x1016", name: SetDevicePropValue, classification: alreadyModeled, basis: advertised-and-captured }
  - { code: "0x1017", name: ResetDevicePropValue, classification: modelOrFirmwareDependent, basis: advertised-only }
  - { code: "0x1018", name: TerminateOpenCapture, classification: modelOrFirmwareDependent, basis: advertised-only }
  - { code: "0x101c", name: InitiateOpenCapture, classification: modelOrFirmwareDependent, basis: advertised-only }
  - { code: "0x900c", name: Vendor900c, classification: modelOrFirmwareDependent, basis: advertised-only }
  - { code: "0x900d", name: Vendor900d, classification: modelOrFirmwareDependent, basis: advertised-only }
