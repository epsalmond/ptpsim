schema: camera-config-parity/v1
scope: { manufacturer: FUJIFILM, model: "GFX100 II", firmware: "2.30", connection: wireless-tether, mode: shooting/stills }
sources:
  capture: probe/2026-05-27-ptp-evidence-wireless-stills.jsonl
  libgphoto2:
    repository: https://github.com/gphoto/libgphoto2
    revision: 57e2a06e35c6e413180b62371360fdbb077b6e74
classifications: [alreadyModeled, safeToAdd, modelOrFirmwareDependent, conflictsWithCapture, requiresFocusedCapture]

# The capture inventory is authoritative. Tests require exact operation-row
# coverage and require every captured property to exist in the generated
# manifest. Explicit candidates below record semantic comparisons; remaining
# properties are wire-catalog coverage, not claims that every value is known.
inventory:
  operations: { expectedCount: 24, coverage: explicitRows }
  properties: { expectedCount: 287, coverage: generatedManifest, defaultClassification: alreadyModeled, level: wireCatalog }

operations:
