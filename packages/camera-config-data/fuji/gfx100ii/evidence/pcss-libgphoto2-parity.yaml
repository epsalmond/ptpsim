  - { code: known-address-unicast, classification: alreadyModeled, basis: captured-pcss-knock-and-callback }
  - { code: same-socket-init-retry, classification: alreadyModeled, basis: captured-initfail-sequence }
  - { code: object-transfer, classification: alreadyModeled, basis: captured-whole-object-sequence }
  - { code: live-view-poll, classification: alreadyModeled, basis: captured-0x9018-sequence }
  - { code: host-format-selection, classification: conflictsWithCapture, basis: no-camera-property-write-observed }
  - { code: other-live-view-click-modes, classification: requiresFocusedCapture, basis: no-successful-capture }

transport:
