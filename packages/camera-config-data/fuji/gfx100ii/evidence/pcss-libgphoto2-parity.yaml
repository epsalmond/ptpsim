  - { code: "0x901d", name: Vendor901d, classification: modelOrFirmwareDependent, basis: advertised-only }

properties:
  - code: "0xd20c"
    name: SimultaneousCardRecording
    wireType: u16
    classification: safeToAdd
    basis: capture-plus-libgphoto2-symbols
    reference: "camlibs/ptp2/ptp.h:3004; camlibs/ptp2/ptp.c:7340"
    rows:
      - { raw: 1, label: rawAndProcessed, provenance: wirePcssParity20260714 }
      - { raw: 2, label: rawOnly, provenance: wirePcssParity20260714 }
      - { raw: 3, label: processedOnly, provenance: sdkPcssParity20260714 }
      - { raw: 4, label: noCardRecording, provenance: sdkPcssParity20260714 }
  - { code: "0xd395", name: FocusArea, wireType: str, shape: "signedInteger,signedInteger,signedInteger", classification: safeToAdd, basis: capture-plus-libgphoto2-type, reference: "camlibs/ptp2/ptp.h:3080; camlibs/ptp2/config.c:3283" }

workflows:
