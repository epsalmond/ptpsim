# Canon manufacturer index — PRELIMINARY, recognition only.
#
# app (jp.co.canon.ic.cameraconnect 3.5.30.22), NOT a real camera
# advertisement or wire capture. Validate against a real Canon body before
# trusting anything beyond "this advert is probably a Canon camera".
#
# Evidence (operators tree, referenced by path per AGENTS.md):

# Plan: docs/plans/manifest-schema-multivendor-risk-pass-2026-06-10.md (Phase 1)
#
# No establishment plan: the app's GATT layer maps several custom services
# (00020000/00030000/00040000/00080000 under the Canon base UUID) with
# notify- AND indicate-mode CCCDs, and may require OS bonding
# (BluetoothDevice.createBond() — epsalmond/ptpsim#30). Establishment is
# deferred until a real camera capture shows which services matter for the
# target workflow. Characteristic UUIDs beyond the advertised service are
# known only as 32-bit prefixes in the app — full UUIDs deliberately NOT
# guessed here.

manufacturer: CANON

families:
  canon:
    ble:
      gatt: {}
      advert:
        # 425 = Bluetooth SIG company ID for Canon.
        manufacturerCompanyId: 0x01A9
        serviceUuids:
          # Scan filter UUID from C0240f.i() — present in camera adverts.
          canonCamera: "00010000-0000-1000-0000-D8492FFFA821"
      establishments:
        recognition-only-preliminary:
          mechanism: recognition-only-preliminary
          steps: []

models:
  - id: canon-camera
    displayName: "Canon camera (preliminary)"
    inherits: [canon]
    manifest: canon-camera/canon-camera.yaml
    # The app parses two manufacturer-data payload shapes (post-company-id,
    # via Android getManufacturerSpecificData(425) — already stripped):
    # 19-byte (full 16-byte body UUID) and 6-byte (short id + flags).
    # File order: the length asserts make these mutually exclusive.
    signatures:
      canonBleAdvertLong:
        kind: bleAdvert
        # payload[0] type byte must be 1; payload[1..2] byte-reversed USB/
        # product id; payload[3..18] 16-byte UUID, reversed before UUID
        # construction (C0232d.onScanResult()).
        require:
          all:
            - serviceUuids: { contains: "{ble.advert.serviceUuids.canonCamera}" }
            - manufacturerData:
                companyId: "{ble.advert.manufacturerCompanyId}"
                length: 19
                assertByte: { index: 0, equals: 0x01 }
        capture:
          - { source: manufacturerData, at: 1, length: 2, transform: { reverseBytes: {} }, encoding: u16-be, name: canonUsbProductId }
          - source: manufacturerData
            at: 3
            length: 16
            transform:
              - reverseBytes: {}
              - uuidFromBytes: {}
            encoding: ascii
            name: canonBodyUuid
        scope:
          vendor: "canon"
          advertForm: "long"
          preliminary: "true"
        suggests: { connection: ble, confidence: medium }

      canonBleAdvertShort:
        kind: bleAdvert
        # 6-byte form: payload[3..4] byte-reversed short id (packed into a
        # UUID tail by the app); payload[5] is a bitfield the app splits
        # into two state fields (bit 0, bits 1..2) — semantics unknown,
        # captured under neutral names for validation.
        require:
          all:
            - serviceUuids: { contains: "{ble.advert.serviceUuids.canonCamera}" }
            - manufacturerData:
                companyId: "{ble.advert.manufacturerCompanyId}"
                length: 6
                assertByte: { index: 0, equals: 0x01 }
        capture:
          - { source: manufacturerData, at: 1, length: 2, transform: { reverseBytes: {} }, encoding: u16-be, name: canonUsbProductId }
          - { source: manufacturerData, at: 3, length: 2, transform: { reverseBytes: {} }, encoding: u16-be, name: canonShortId }
          - { source: manufacturerData, at: 5, length: 1, transform: { bits: { mask: 0x01, shift: 0 } }, encoding: u8, name: canonAdvertFlagBit0 }
          - { source: manufacturerData, at: 5, length: 1, transform: { bits: { mask: 0x06, shift: 1 } }, encoding: u8, name: canonAdvertFlagBits12 }
        scope:
          vendor: "canon"
          advertForm: "short"
          preliminary: "true"
        suggests: { connection: ble, confidence: medium }
