# Sony manufacturer index — PRELIMINARY, recognition only.
#
# Android app (com.sony.playmemories.mobile 7.8.5), NOT a real camera
# advertisement or wire capture. The APK pass proves app behavior, not
# camera variance. Validate against a real Sony body before trusting
# anything here beyond "this advert is probably a Sony camera".
#
# Evidence (operators tree, referenced by path per AGENTS.md):

# Plan: docs/plans/manifest-schema-multivendor-risk-pass-2026-06-10.md (Phase 1)
#
# No establishment plan yet: basic pairing (bleRequestMtu 158 →
# bleDiscoverServices → write `06 08 01 00 00 00 00` to the 0000EE01-prefix
# characteristic of service 8000EE00-EE00-FFFF-FFFF-FFFFFFFFFFFF) is
# modellable with the current grammar, but stays out of the data until a
# real camera capture confirms it (epsalmond/ptpsim#33, #32 for Wi-Fi
# handoff). Characteristic UUIDs are known only by prefix in the app —
# full UUIDs deliberately NOT guessed here.

manufacturer: SONY

families:
  sony:
    ble:
      gatt: {}
      advert:
        # 301 = Bluetooth SIG company ID for Sony.
        manufacturerCompanyId: 0x012D
      establishment:
        # Recognition-only: no establishment steps until validated against
        # a real camera (see header). An empty plan is intentional.
        mechanism: recognition-only-preliminary
        steps: []

models:
  - id: sony-camera
    displayName: "Sony camera (preliminary)"
    inherits: [sony]
    manifest: sony-camera/sony-camera.yaml
    signatures:
      sonyCameraAdvert:
        kind: bleAdvert
        # The app's parser sees the RAW manufacturer AD record (company id
        # included); offsets below are converted to the schema's
        # post-company-id payload contract (§11.14): raw byte N = payload
        # byte N-2.
        #   payload[0..1]  Sony-camera discriminator `03 00`
        #   payload[2..3]  advert version (app branches on 0x6400 V1 / 0x6500 V2)
        #   payload[4..5]  two-byte ASCII model code
        #   payload[6..]   three-byte feature records, tags 0x21/0x22/0x23
        require:
          manufacturerData:
            companyId: "{ble.advert.manufacturerCompanyId}"
            minLength: 6
            assertByte:
              - { index: 0, equals: 0x03 }
              - { index: 1, equals: 0x00 }
        capture:
          # Byte order of the version word is inferred from the app's
          # 0x6400/0x6500 comparison constants — PRELIMINARY.
          - { source: manufacturerData, at: 2, length: 2, encoding: u16-be, name: sonyBleVersion }
          - { source: manufacturerData, at: 4, length: 2, encoding: ascii, name: sonyModelCode }
          # Whole feature records as opaque hex, assuming the observed tag
          # order 0x21, 0x22, 0x23 at fixed offsets. The app parses these as
          # tagged records, so the order is NOT guaranteed — captures are
          # fail-soft (skipped on short payloads) and exist to collect
          # real-world samples for validation.
          - { source: manufacturerData, at: 6,  length: 3, encoding: bytes, name: sonyFeatureRecord21 }
          - { source: manufacturerData, at: 9,  length: 3, encoding: bytes, name: sonyFeatureRecord22 }
          - { source: manufacturerData, at: 12, length: 3, encoding: bytes, name: sonyFeatureRecord23 }
          # PRELIMINARY bit captures. Assumes flags byte = record[1] and the
          # fixed tag order above. Tag 0x21: bit5 Wi-Fi handover supported,
          # bit4 enabled. Tag 0x22: bit7 pairing supported, bit6 enabled.
          - { source: manufacturerData, at: 7,  length: 1, transform: { bits: { mask: 0x20, shift: 5 } }, encoding: u8, name: wifiHandoverSupported }
          - { source: manufacturerData, at: 7,  length: 1, transform: { bits: { mask: 0x10, shift: 4 } }, encoding: u8, name: wifiHandoverEnabled }
          - { source: manufacturerData, at: 10, length: 1, transform: { bits: { mask: 0x80, shift: 7 } }, encoding: u8, name: pairingSupported }
          - { source: manufacturerData, at: 10, length: 1, transform: { bits: { mask: 0x40, shift: 6 } }, encoding: u8, name: pairingEnabled }
        scope:
          vendor: "sony"
          preliminary: "true"
        suggests: { connection: ble, confidence: medium }
