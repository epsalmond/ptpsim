schema: camera-config/v1

# Provisional explicit model-selection body. Connection behavior is inherited
# registration, camera-side save/reconnect, or returned DeviceInfo was captured.
camera:
  manufacturer: NIKON
  model: D850

connections:
  ble:
    kind: ble
    establishment: ble-pair
    discovery: { mechanism: ble, announces: camera }
    enables:
      - to: app
        mechanism: ble-establish-wifi-ap

  app:
    kind: ptpip
    establishment: ble-establish-wifi-ap
    initShape: standardPtpIp
    init:
      identity: { guid: initiatorGuid, friendlyName: initFriendlyName }
    commandFraming: standard
    eventFraming: standard
    bindings: { command: 15740, event: 15740 }

operations:
  "0x1001": { name: GetDeviceInfo, owner: standard-ptp, connections: [app] }
  "0x1002": { name: OpenSession, owner: standard-ptp, connections: [app] }
  "0x1003": { name: CloseSession, owner: standard-ptp, connections: [app] }

properties: {}

evidence:
  snapBridgeStatic:

    date: "2026-06-10"
    note: "Family connection shape only; D850 remains unvalidated"
