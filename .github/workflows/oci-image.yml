name: OCI image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select-changes:
    name: Select OCI changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test change selection
        run: python3 ci/test-github-oci-changes.py
      # Always start the workflow so commit messages can override path filters.
      - name: Select paths or [ALL] commits
        id: changes
        run: python3 ci/github-oci-changes.py

  build-dry-run:
    name: OCI build dry-run
    needs: select-changes
    if: needs.select-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build both architectures
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          tags: localhost/ptpsim/camera-sim-service:sha-${{ github.sha }}
          # Keep the Dockerfile's public builder default and OCI labels.
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          # Main pushes seed a cache that subsequent fork PRs can restore.
          cache-from: type=gha,scope=ptpsim-oci-linux-amd64-arm64
          cache-to: type=gha,scope=ptpsim-oci-linux-amd64-arm64,mode=max
