
# Smoke proves the webhook→server→nas-agent path; the workspace step matches the
# local quality gates (fmt + clippy -D warnings + 120 tests including the #3/#4
# believability gates). Builds are pure Rust (no openssl/ring/native deps), so
# rust:1-slim suffices.
when:
  - event: [push, pull_request]

steps:
  - name: smoke
    image: alpine
    commands:
      - echo "woodpecker reached ptpsim @ ${CI_COMMIT_SHA:0:8} on ${CI_COMMIT_BRANCH}"

  - name: workspace
    image: rust:1-slim
    commands:
      - rustup component add rustfmt clippy
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace

  - name: python-mapper
    image: python:3.11-slim
    commands:
      - pip install -q pytest
      # protocol-mapper's pyproject defaults to --cov= ; override since pytest-cov
      # isn't in the CI image and the other tests need bleak/hardware anyway.
      - cd tools/protocol-mapper && pytest tests/test_gphoto2_labels.py -o addopts="" -q

  # Build + push the deployable image to the local registry on main pushes only.

  #   docker_registry — e.g. registry.psalmond.com:5000
  #   docker_repo     — e.g. registry.psalmond.com:5000/ptpsim
  # Add username/password secrets if your registry requires auth.
  - name: image
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry:
        from_secret: docker_registry
      repo:
        from_secret: docker_repo
      tags:
        - latest
        - sha-${CI_COMMIT_SHA:0:8}
      platforms: linux/amd64,linux/arm64
    when:
      branch: main
      event: push
