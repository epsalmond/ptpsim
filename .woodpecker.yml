
# Smoke proves the webhook→server→nas-agent path; the workspace step matches the
# local quality gates (fmt + clippy -D warnings + 120 tests including the #3/#4
# believability gates). Builds are pure Rust (no openssl/ring/native deps), so
# rust:1-slim suffices.
when:
  - event: [push, pull_request]

steps:
  - name: smoke
    image: alpine
    commands:
      - echo "woodpecker reached ptpsim @ ${CI_COMMIT_SHA:0:8} on ${CI_COMMIT_BRANCH}"

  - name: workspace
    image: rust:1-slim
    commands:
      - rustup component add rustfmt clippy
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace

  - name: python-mapper
    image: python:3.11-slim
    commands:
      - pip install -q pytest
      # protocol-mapper's pyproject defaults to --cov= ; override since pytest-cov
      # isn't in the CI image and the other tests need bleak/hardware anyway.
      - cd tools/protocol-mapper && pytest tests/test_gphoto2_labels.py -o addopts="" -q



  - name: image
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    network_mode: mgmt-public
    settings:
      registry: ${LOCAL_DOCKER_REGISTRY}
      repo: ${LOCAL_DOCKER_REGISTRY}/ptpsim
      username:
        from_secret: local_registry_username
      password:
        from_secret: local_registry_password
      tags:
        - latest
        - sha-${CI_COMMIT_SHA:0:8}
      platforms: linux/amd64,linux/arm64
    when:
      branch: main
      event: push


  # publish it as a GitHub release attachment. Recipe lives in
  # ci/build-xcframework.sh; agent setup runbook in ci/setup-macos-agent.sh.
  # Plan §11.11 has the design rationale.
  - name: xcframework
    labels:
      platform: darwin     # routes to the macOS agent registered by setup-macos-agent.sh
    commands:
      - ./ci/build-xcframework.sh
      # Tarball lands at out/dist/CameraProtocolFFI-<sha8>.tar.gz.
      # Publish as a GitHub release attached to the commit SHA tag. The
      # tag is created on demand by `gh release create`; `--clobber` makes
      # the upload idempotent on retries.
      - export TAG="sha-${CI_COMMIT_SHA:0:8}"
      - gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG"
          --target "$CI_COMMIT_SHA"
          --title "ptpsim FFI $TAG"
          --notes "Auto-built CameraProtocolFFI.xcframework. Recipe: ci/build-xcframework.sh."
      - gh release upload "$TAG" "out/dist/CameraProtocolFFI-${CI_COMMIT_SHA:0:8}.tar.gz" --clobber
    environment:
      GH_TOKEN:
        from_secret: github_token   # fine-grained PAT with contents:write on the repo
    when:
      branch: main
      event: push
