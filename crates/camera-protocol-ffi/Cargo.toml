[package]
name = "camera-protocol-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# `lib` for workspace/tests; static/cdylib for the iOS xcframework + Android .so.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
camera-config = { workspace = true }
protocol-primitives = { workspace = true }
ptp-core = { workspace = true }
uniffi = "0.31"
serde_yaml = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
regex-lite = { workspace = true }

[dev-dependencies]
# The codec seam tests build byte fixtures with the same primitives the FFI wraps.
ptp-core = { workspace = true }
protocol-primitives = { workspace = true }
# The executor seam tests drive the async plan-walker against the same
# in-memory BLE responder the reference walker's acceptance tests use.
camera-sim = { workspace = true }
futures = { workspace = true }
