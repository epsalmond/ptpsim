# Swift binding name conventions (uniffi 0.31).
#
# Default would be the snake_case crate name (`camera_protocol_ffi`); Swift
# consumers expect PascalCase modules, and the §11.11 xcframework recipe
# targets `CameraProtocolFFI`. The `ffi_module_name` is the inner FFI
# (header + modulemap) name, kept distinct so the public Swift module and
# the C-bridging module never collide.
[bindings.swift]
module_name = "CameraProtocolFFI"
ffi_module_name = "CameraProtocolFFIFFI"

# Kotlin binding package (uniffi 0.31).
#
# The default would be `uniffi.camera_protocol_ffi`. ptpsim owns this name so
# every consumer imports the same package. The generated file lands at
# `dev/ptpsim/cameraprotocol/camera_protocol_ffi.kt` under the output
# directory. `ci/build-android.sh` repeats the name in `KOTLIN_PACKAGE`, and
# `ci/test-build-android.sh` checks that the two match. A consumer that needs
# a different package passes its own `--config` to uniffi-bindgen.
[bindings.kotlin]
package_name = "dev.ptpsim.cameraprotocol"
